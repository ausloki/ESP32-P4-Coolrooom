    type: bool
    restore_value: no
    initial_value: "false"

  # Alt home gauge (view 2) scrolled into the centre snap container.
  # Set from home_gauge_scroll on_scroll_end; gates p4_ui_update_home2_cooling.
  - id: home2_view_active
    type: bool
    restore_value: no
    initial_value: "false"

##############################################################################
# Phase 4: LDO — MIPI-DSI D-PHY power rail
# Channel 3 at 2.5V is the standard ESP32-P4 MIPI-DSI configuration.
# Confirmed: ESP_LDO_VO3 net present in board schematic.
##############################################################################

esp_ldo:
  - id: ldo_mipi_dphy
    channel: 3
    voltage: 2.5V

##############################################################################
# Phase 4: MIPI-DSI Display — 7" 1024×600 JD9365, 2-lane DSI
# Model matches exactly. Reset pin GPIO33 confirmed from schematic.
##############################################################################

display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    update_interval: never
    auto_clear_enabled: false
    on_page_change:
      - lambda: 'ESP_LOGD("lvgl", "display page changed");'

##############################################################################
# Phase 4: GT911 Capacitive Touchscreen
# Shares i2c_bus (GPIO 7/8). INT GPIO23, RST GPIO33 from schematic.
##############################################################################

touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: i2c_bus
    address: 0x5D
    # Run after the on_boot priority -150 settle delay (shared LCD/touch reset
    # on GPIO33 is pulsed during mipi_dsi setup at HARDWARE priority ~50).
    setup_priority: -200
    # Force polling. With interrupt_pin set, ESPHome attaches an IRQ and
    # stops polling ("Touch Polling Stopped"). On this board the GT911 often
    # ACKs I2C after the shared reset but does not reliably fire INT without
    # its own reset pulse — which we cannot safely do on GPIO33 after the
    # panel is live (hard-resets LCD → black screen). Polling reads touch
    # state over I2C and avoids depending on INT.
    update_interval: 50ms
    # Waveshare/Espressif BSP tp_cfg.flags for this panel orientation.
    transform:
      mirror_x: true
      mirror_y: true
    # Skip GT911 max-value I2C probe; use panel native resolution.
    calibration:
      x_min: 0
      x_max: 1024
      y_min: 0
      y_max: 600
    # reset_pin omitted: GPIO33 shared with LCD — post-display pulse = black screen.
    # interrupt_pin omitted: see update_interval note above.
    on_touch:
      - logger.log:
          level: INFO
          format: "Touch at x=%d y=%d"
          args: ['touch.x', 'touch.y']

##############################################################################
# Phase 4: Backlight output
##############################################################################

output:
  - platform: ledc
    id: backlight_pwm
    pin: ${display_bl_pin}
    # Waveshare ESP-IDF BSP uses LEDC output_invert=1 for BL_CTRL.
    inverted: true
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 20

##############################################################################
# Phase 4: Fonts for LVGL
##############################################################################

font:
  - file: "gfonts://Roboto"
    id: font_huge
    size: 80
    # Include '*' so PIN masking (p4_pin_masked) actually draws.
    # °C / °F required by p4_fmt_temp() on the home centre readout.
    glyphs: "0123456789.-+NAF *°C"
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
    # '|' (memory line) and '—' (info/status text) render as tofu boxes when
    # missing — keep them in every text font that shows generated strings.
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-:/%+°()*[],'?!#_=&@<>|^—"
  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-:/%+°()*[],'?!#_=&@<>|^—"
  - file: "gfonts://Roboto"
    id: font_small
    size: 15
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-:/%+°()*[],'?!#_=&@<>|^—"
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 28
    # Last glyph is mdi-volume-high — the per-phrase preview button on Settings 8/8.
    glyphs: "\U000F0717\U000F0238\U000F0335\U000F009A\U000F05A9\U000F091F\U000F0922\U000F0925\U000F0928\U000F0924\U000F092D\U000F057E"
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi_large
    size: 75
    glyphs: "\U000F0717\U000F0238\U000F0335\U000F009A"
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi_wifi
    size: 32
    glyphs: "\U000F05A9\U000F091F\U000F0922\U000F0925\U000F0928\U000F0924\U000F092D"

##############################################################################
# Phase 4: LVGL Coolroom Dashboard
##############################################################################

color:
  - id: col_bg         # Dark background
    hex: "1C1C1E"
  - id: col_panel      # Card surface
    hex: "2C2C2E"
  - id: col_green      # Good / enabled status (settings toggles, etc.)
    hex: "30D158"
  - id: col_blue       # Snowflake (compressor ON) / coolroom temp arc
    hex: "0A84FF"
  - id: col_cyan       # Setpoint arc
    hex: "00BCD4"
  - id: col_pink       # Ambient temp arc
    hex: "FF1493"
  - id: col_grey       # Status icons (inactive)
    hex: "888888"
  - id: col_red        # Alarm / flame (defrost ON)
    hex: "FF453A"
  - id: col_orange     # Probe fault / warning
    hex: "FF9F0A"
  - id: col_text       # Primary text
    hex: "FFFFFF"
  - id: col_subtext    # Secondary text
    hex: "8E8E93"
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_panel
  color_depth: 16
  bg_color: col_bg
  text_color: col_text
  log_level: WARN
  default_font: font_small
  full_refresh: true
  # MUST stay false with mipi_dsi update_interval: never.
  # When true, ESPHome pauses LVGL's refresh timer to 5 minutes whenever
  # display->is_idle() is false — and with update_interval: never the display
  # component never reaches LOOP_DONE, so is_idle() stays false forever.
  # Result: blank/glow screen for ~5–6 minutes until that timer fires
  # (confirmed against ESPHome lvgl_esphome.cpp + this board's symptoms).
  update_when_display_idle: false

  bottom_layer:
    bg_opa: TRANSP
    widgets:
      - obj:
          id: bg_fx_defrost_border
          x: 0
          y: 0
          width: 1024
          height: 600
          bg_opa: TRANSP
          border_side:
            - TOP
            - BOTTOM
            - LEFT
            - RIGHT
          border_width: 0
          border_opa: 0%
          border_color: col_orange
          radius: 0
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_1
          x: 120
          y: 80
          text: "*"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_2
          x: 250
          y: 120
          text: "*"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_3
          x: 390
          y: 100
          text: "*"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_4
          x: 530
          y: 90
          text: "*"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_5
          x: 690
          y: 110
          text: "*"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_6
          x: 840
          y: 130
          text: "*"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

  pages:
    # Home page - Horseshoe Arc Design
    - id: page_home
      bg_color: col_bg
      width: 1024
      height: 600
      # Centre gauge scrolls between classic / delta views; page itself stays put
      # so the left icon rail and tab bar do not move.
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        # Header: date left; 12h time (same size/colour) just left of WiFi icon.
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 56
            bg_color: col_panel
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              # Time on the LEFT, date on the RIGHT beside the WiFi icon.
              - label:
                  id: lbl_clock
                  x: 12
                  y: 8
                  width: 260
                  height: 40
                  text: "--:--"
                  text_font: font_large
                  text_color: col_text
              - label:
                  id: lbl_date
                  x: 690
                  y: 8
                  width: 220
                  height: 40
                  text: "-- ---"
                  text_align: RIGHT
                  text_font: font_large
                  text_color: col_text
              - label:
                  id: lbl_wifi_hdr
                  x: 920
                  y: 8
                  width: 88
                  height: 40
                  text: "\U000F092D"
                  text_font: font_mdi_wifi
                  text_color: col_subtext

        # Left Sidebar - status + two operator controls
        # Compressor / defrost are display-only: animation and colour follow
        # the control tick / relays. Tapping them used to toggle coils and
        # fight automatic control — that path is gone. Light still toggles
        # the cabinet lamp (when Light Relay Enabled). Bell silences siren
        # (and future speech alerts) until all alarms clear.
        # radius 0 + no shadow — no circular chrome around icons.
        # Compressor status (not clickable)
        - button:
            x: 6
            y: 89
            width: 75
            height: 75
            bg_opa: TRANSP
            radius: 0
            border_width: 0
            shadow_width: 0
            pad_all: 0
            clickable: false
            widgets:
              - led:
                  id: led_compressor
                  x: -20
                  y: -20
                  width: 8
                  height: 8
                  color: col_blue
                  brightness: 0%
              - label:
                  id: ui_compressor_icon
                  align: CENTER
                  y: 0
                  text: "\U000F0717"
                  text_font: font_mdi_large
                  text_color: col_grey

        # Off-delay countdown, directly under the compressor icon. The same
        # countdown was already on the Info page, but the home screen is the
        # one anyone looks at when wondering why the compressor isn't running
        # after a power cut — without it the idle grey snowflake looks like a
        # fault rather than a timer. Blank whenever nothing is being withheld.
        - label:
            id: lbl_home_lockout
            x: 0
            y: 166
            width: 87
            text: ""
            text_align: CENTER
            text_font: font_small
            text_color: col_orange

        # Defrost status (not clickable)
        - button:
            x: 6
            y: 205
            width: 75
            height: 75
            bg_opa: TRANSP
            radius: 0
            border_width: 0
            shadow_width: 0
            pad_all: 0
            clickable: false
            widgets:
              - led:
                  id: led_defrost
                  x: -20
                  y: -20
                  width: 8
                  height: 8
                  color: col_red
                  brightness: 0%
              - label:
                  id: ui_defrost_icon
                  align: CENTER
                  y: 0
                  text: "\U000F0238"
                  text_font: font_mdi_large
                  text_color: col_grey

        # Light — manual toggle when Light Relay Enabled
        - button:
            x: 6
            y: 320
            width: 75
            height: 75
            bg_opa: TRANSP
            radius: 0
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - led:
                  id: led_light
                  x: -20
                  y: -20
                  width: 8
                  height: 8
                  color: col_orange
                  brightness: 0%
              - label:
                  id: ui_light_icon
                  align: CENTER
                  y: 0
                  text: "\U000F0335"
                  text_font: font_mdi_large
                  text_color: col_grey
            on_click:
              - lambda: |-
                  if (!id(ctl_relay_light_enabled)) {
                    ESP_LOGW("ui", "Light tap ignored — Light Relay Enabled is off");
                    return;
                  }
                  if (id(relay_light).state) id(relay_light).turn_off();
                  else                       id(relay_light).turn_on();
              - lvgl.led.update:
                  id: led_light
                  brightness: !lambda |-
                    return id(relay_light).state ? 100 : 0;

        # Alarm bell — silence siren / speech while alarms remain active
        - button:
            x: 6
            y: 436
            width: 75
            height: 75
            bg_opa: TRANSP
            radius: 0
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - led:
                  id: led_alarm_hi
                  x: -20
                  y: -20
                  width: 8
                  height: 8
                  color: col_red
                  brightness: 0%
              - label:
                  id: ui_alarm_icon
                  align: CENTER
                  y: 0
                  text: "\U000F009A"
                  text_font: font_mdi_large
                  text_color: col_grey
            on_click:
              - lambda: |-
                  // Soft silence — banners, ntfy and alarm flags stay.
                  // Bell stops jiggling but stays red until conditions clear.
                  // A new alarm type (not in the mask frozen here) lifts mute
                  // so the bell animates again and siren/speech can run.
                  id(ctl_alarm_silenced) = true;
                  id(ctl_alarm_silenced_mask) = p4_ctl_alarm_mask(
                      id(ctl_alarm_high_active), id(ctl_alarm_low_active),
                      id(ctl_door_alarm_active), id(ctl_no_cool_alarm_active),
                      id(ctl_ice_alarm_active), id(ctl_probe_fault));
                  if (id(relay_siren).state) id(relay_siren).turn_off();
                  p4_sd_log_event("ALARM_SILENCED", "operator muted siren/audio from home bell");
                  ESP_LOGI("ui", "Alarm silenced from home screen (mask=0x%02X)",
                           id(ctl_alarm_silenced_mask));

        # Center Arc Gauge — vertical snap-scroll between two horseshoe views.
        #   View 1 (y=0): classic coolroom / setpoint / ambient (unchanged).
        #   View 2 (y=480): HA thermostat-style outer ring (set fill + current↔set
        #   gap + display-only thumbs) with thinner pink ambient inside.
        # home2_view_active tracks which view is snapped so expensive home2 arc
        # math is skipped while classic home is showing.
        - obj:
            id: home_gauge_scroll
            x: 80
            y: 64
            width: 864
            height: 480
            bg_color: col_bg
            border_width: 0
            radius: 0
            scrollable: true
            scroll_dir: VER
            scroll_snap_y: START
            scrollbar_mode: "OFF"
            # Must be clickable so vertical drags scroll the two gauge pages.
            # Left icon rail ends at x≈81 — only a 1 px overlap with this box.
            clickable: true
            on_scroll_end:
              - lambda: |-
                  // Each view is 480 px tall; snap START → y≈0 classic, y≈480 alt.
                  const int32_t sy = lv_obj_get_scroll_y(id(home_gauge_scroll));
                  const bool now_home2 = sy >= 240;
                  const bool was_home2 = id(home2_view_active);
                  id(home2_view_active) = now_home2;
                  if (!now_home2 || was_home2) return;
                  // Entering view 2: one-shot refresh so arcs/knobs are not stale.
                  p4_ui_update_home2_cooling(
                      id(home2_set_arc), id(home2_temp_arc), id(home2_temp_delta_arc),
                      id(home2_knob_set), id(home2_knob_cur),
                      id(probe1_temp).state, id(ctl_setpoint),
                      ${dial_min_c}, ${dial_max_c},
                      id(home2_ambient_arc));
                  lv_arc_set_value(
                      id(home2_ambient_arc),
                      p4_ui_temp_to_arc_pct(id(probe_external_temp).state,
                                            ${dial_min_c}, ${dial_max_c}));
            widgets:
              # ── View 1: classic three-arc gauge ───────────────────────────
              - obj:
                  x: 0
                  y: 0
                  width: 864
                  height: 480
                  bg_color: col_bg
                  border_width: 0
                  radius: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  clickable: false
                  widgets:
                    # Home gauge (2026-08-01)
                    #   - Orientation unchanged: 150→30 (gap at 6 o'clock).
                    #   - Rings only: dim track + bright value indicator, drawn
                    #     straight onto col_bg. Every decorative layer that was
                    #     tried here has been removed — the 448 white rim arc and
                    #     the frosted underlay plate both composited to grey over
                    #     col_bg (#FFFFFF at 22% → ~#4E4E4E; col_panel at 42% →
                    #     ~#232325) and read as a ring / disc behind the arcs.
                    #     A radial tick scale (LVGL meter) was tried and dropped
                    #     as too busy. Don't reintroduce translucent backdrops.
                    #   - Ring colours match their sensor: blue coolroom, cyan
                    #     setpoint, pink ambient (same as the text readouts).
                    #   - Ring stack 440 / 396 / 352, arc_width 14 → 8px daylight
                    #     between rings. 440 leaves 20px top+bottom margin in the
                    #     480-tall container, and the outer edge (centre+220) still
                    #     clears the right-hand labels (centred at centre+328).
                    #   - Left rail + touch targets untouched (container stays
                    #     x:80, clickable false).

                    # Arc 1: Coolroom temp — dim blue track + bright fill
                    - arc:
                        id: home_temp_arc
                        align: CENTER
                        y: 0
                        width: 440
                        height: 440
                        bg_opa: TRANSP
                        arc_color: col_blue
                        arc_opa: 28%
                        arc_width: 14
                        arc_rounded: true
                        rotation: 0
                        start_angle: 150
                        end_angle: 30
                        value: 50
                        indicator:
                          arc_color: col_blue
                          arc_opa: 92%
                          arc_width: 14
                          arc_rounded: true
                        knob:
                          bg_opa: TRANSP

                    # Arc 2: Setpoint — dim cyan track + bright fill
                    - arc:
                        id: home_setpoint_arc
                        align: CENTER
                        y: 0
                        width: 396
                        height: 396
                        bg_opa: TRANSP
                        arc_color: col_cyan
                        arc_opa: 28%
                        arc_width: 14
                        arc_rounded: true
                        rotation: 0
                        start_angle: 150
                        end_angle: 30
                        value: 50
                        indicator:
                          arc_color: col_cyan
                          arc_opa: 92%
                          arc_width: 14
                          arc_rounded: true
                        knob:
                          bg_opa: TRANSP

                    # Arc 3: Ambient — dim pink track + bright fill
                    - arc:
                        id: home_ambient_arc
                        align: CENTER
                        y: 0
                        width: 352
                        height: 352
                        bg_opa: TRANSP
                        arc_color: col_pink
                        arc_opa: 28%
                        arc_width: 14
                        arc_rounded: true
                        rotation: 0
                        start_angle: 150
                        end_angle: 30
                        value: 50
                        indicator:
                          arc_color: col_pink
                          arc_opa: 92%
                          arc_width: 14
                          arc_rounded: true
                        knob:
                          bg_opa: TRANSP

                    # Center disc — same col_bg as the surrounding screen and no
                    # border, so the readout sits on flat background with nothing
                    # outlining it. Still opaque: it masks the inner stub of the
                    # ambient ring (radius 165 vs the ring's inner edge at 162).
                    - obj:
                        align: CENTER
                        y: 0
                        width: 330
                        height: 330
                        radius: 165
                        border_width: 0
                        bg_color: col_bg
                        bg_opa: COVER
                        clickable: false

                    # CENTER: Large temperature display
                    - label:
                        id: lbl_coolroom_temp_large
                        text: "--°C"
                        align: CENTER
                        y: -28
                        text_font: font_huge
                        text_color: col_blue

                    # Setpoint label below temperature
                    - label:
                        id: lbl_setpoint_status
                        text: "Set: --°C"
                        align: CENTER
                        y: 48
                        text_font: font_large
                        text_color: col_cyan

                    # Status text (Running/Fault)
                    - label:
                        id: lbl_status_text
                        text: "OK"
                        align: CENTER
                        y: 86
                        text_font: font_medium
                        text_color: col_orange

                    # RIGHT PANEL: Secondary Readings — nudged out so the larger
                    # outer rim (~448) keeps ~80px clearance from these labels.
                    - label:
                        id: lbl_evap_temp_large
                        text: "Evap\n--°C"
                        align: CENTER
                        x: 328
                        y: 80
                        text_font: font_small
                        text_color: col_text

                    - label:
                        id: lbl_int_humidity_large
                        text: "Int --°C\n--%RH"
                        align: CENTER
                        x: 328
                        y: 196
                        text_font: font_small
                        text_color: col_text

                    - label:
                        id: lbl_ext_humidity_large
                        text: "Ext --°C\n--%RH"
                        align: CENTER
                        x: 328
                        y: 312
                        text_font: font_small
                        text_color: col_pink

                    - label:
                        id: lbl_power_info
                        text: "Heap: ---"
                        align: CENTER
                        x: 328
                        y: 428
                        text_font: font_small
                        text_color: col_subtext

              # ── View 2: HA thermostat-style (display-only) ────────────────
              # Outer ring = coolroom track/fill with current + setpoint overlays.
              # No drag-to-set: arcs and thumbs are non-clickable; swipe only
              # scrolls back to the classic three-arc page.
              - obj:
                  x: 0
                  y: 480
                  width: 864
                  height: 480
                  bg_color: col_bg
                  border_width: 0
                  radius: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  clickable: false
                  widgets:
                    # Track + soft cyan fill to setpoint (HA target path).
                    # Stroke 22 so the outer ring dominates; ambient stays thin.
                    - arc:
                        id: home2_set_arc
                        align: CENTER
                        y: 0
                        width: 440
                        height: 440
                        bg_opa: TRANSP
                        clickable: false
                        arc_color: col_blue
                        arc_opa: 28%
                        arc_width: 22
                        arc_rounded: true
                        rotation: 0
                        start_angle: 150
                        end_angle: 30
                        value: 50
                        indicator:
                          arc_color: col_cyan
                          arc_opa: 55%
                          arc_width: 22
                          arc_rounded: true
                        knob:
                          bg_opa: TRANSP

                    # Placeholder arc (value forced 0 in p4_ui_update_home2_cooling).
                    # Kept so call sites / id stay stable; no progressive fill.
                    - arc:
                        id: home2_temp_arc
                        align: CENTER
                        y: 0
                        width: 440
                        height: 440
                        bg_opa: TRANSP
                        clickable: false
                        arc_color: col_blue
                        arc_opa: 0%
                        arc_width: 22
                        arc_rounded: true
                        rotation: 0
                        start_angle: 150
                        end_angle: 30
                        value: 0
                        indicator:
                          arc_color: col_blue
                          arc_opa: 0%
                          arc_width: 22
                          arc_rounded: true
                        knob:
                          bg_opa: TRANSP

                    # Active gap between current and setpoint (angles in C++)
                    - arc:
                        id: home2_temp_delta_arc
                        align: CENTER
                        y: 0
                        width: 440
                        height: 440
                        bg_opa: TRANSP
                        clickable: false
                        arc_color: col_blue
                        arc_opa: 0%
                        arc_width: 22
                        arc_rounded: true
                        rotation: 0
                        start_angle: 150
                        end_angle: 30
                        value: 0
                        indicator:
                          arc_color: col_blue
                          arc_opa: 90%
                          arc_width: 22
                          arc_rounded: true
                        knob:
                          bg_opa: TRANSP

                    # Ambient — thinner inner ring so the HA outer track dominates.
                    # arc_rounded false on indicator: rounded tip looks like a fake
