##############################################################################
# ESP32-P4 Coolroom Controller
# Board: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
# https://docs.waveshare.com/ESP32-P4-WIFI6-Touch-LCD-7B
#
# CODING PRINCIPLE: C++/ESP-IDF first.
#   Complex logic lives in p4_helpers.h / p4_control.h / p4_ui.h as C++ functions.
#   YAML lambdas are one-liners that call those helpers.
#   YAML is configuration; C++ is the firmware.
#
# HARDWARE-FIRST RULE
# All pin assignments must be verified against the board schematic before
# flashing. Pins marked ⚠️ VERIFY are unconfirmed estimates.
# Schematic: https://files.waveshare.com/wiki/ESP32-P4-WIFI6-Touch-LCD-7B/
#
# TEMPERATURE SENSOR ARCHITECTURE
# Coolroom + evaporator temperature are one RS485 2-channel PT100 Modbus module
# (see reference/PT100-RS485-2CH-terminals.png + hardware_pins.md) — CH1 room air,
# CH2 evaporator, slave addr 100. External/ambient temperature and all humidity
# readings come from I2C sensors (RS485 RTD has no humidity; the old second RTD
# board for ambient was decommissioned in favor of the I2C SHT20). I2C also
# carries the GT911 touch controller. Wall-clock time uses the ESP32-P4 internal
# 48-bit LP RTC + SNTP (Waveshare FAQ) — no on-board I2C RTC chip in the
# published docs. See reference/hardware_pins.md and reference/RTC_Configuration.md.
#
# PROBE MAP
#   Probe 1 (coolroom room air)  — 2CH RTD module, CH1 (RT1), addr 100  [FIXED]
#   Probe 2 (evaporator coil)    — 2CH RTD module, CH2 (RT2), addr 100  [FIXED]
#   Ambient (external reference) — I2C SHT20 @ 0x40 (probe_external_temp)
#   Internal (secondary/humidity)— I2C SHT31 @ 0x44 (probe_internal_temp)
#
# RELAY MAP (Waveshare Modbus RTU Relay 4-CH, addr 1)
#   Coil 0 = Fan       Coil 1 = Compressor
#   Coil 2 = Light     Coil 3 = Siren
#   Defrost is always passive (no heater coil on this controller).
#
# PHASE STATUS
#   Phase 1: WiFi, HA native API, web server, OTA            ✓
#   Phase 2: RS485 Modbus — relays + 2x RTD probes           ✓
#   Phase 3: Coolroom control logic                          ✓
#   Phase 4: LVGL 7" MIPI-DSI touchscreen UI                ✓
#   Phase 5: SD card logging, ntfy, backup/restore           ← CURRENT
##############################################################################

substitutions:
  device_name:   esp32-p4-coolroom
  friendly_name: "Coolroom Controller P4"
  timezone:      Australia/Perth

  # ── Home gauge dial range (°C) ───────────────────────────────────────────
  # Shared by the coolroom / setpoint / ambient arcs so every ring reads
  # against the same scale. dial_min_c is the left-hand (bottom-left) end of
  # the horseshoe; dial_max_c must stay high enough that summer ambient does
  # not peg. Change here only — the arcs and helpers follow.
  dial_min_c: "-10"
  dial_max_c: "30"

  # ── NTP servers ───────────────────────────────────────────────────────────
  ntp_server_1: au.pool.ntp.org
  ntp_server_2: time.google.com

  # ── NTP sync intervals (milliseconds, passed to ESP-IDF esp_sntp_set_sync_interval)
  # ntp_fast_sync_ms     : poll rate at boot until first sync when SoC LP RTC unset
  # ntp_normal_sync_ms   : unused fallback interval (kept for clarity)
  # ntp_with_rtc_sync_ms : steady-state once wall clock is valid (VBAT-held or
  #                        after first SNTP) — weekly correction only
  ntp_fast_sync_ms:      "60000"
  ntp_normal_sync_ms:    "86400000"
  ntp_with_rtc_sync_ms:  "604800000"

  # ── I2C header (GPIO CONFIRMED from Waveshare docs) ───────────────────────
  # GT911 touch + optional SHT humidity sensors. Wall clock is SoC LP RTC + NTP,
  # not an I2C chip. Primary coolroom/evap temps stay on RS485 RTD.
  i2c_sda_pin: GPIO7
  i2c_scl_pin: GPIO8

  # ── RS485 UART (✅ CONFIRMED from Waveshare 13_RS485_Test example) ────────
  rs485_tx_pin: GPIO27
  rs485_rx_pin: GPIO26

  # ── WiFi credentials, also as substitutions ───────────────────────────────
  # The same values wifi:/networks: below is built from. Repeated here because
  # a network saved at runtime *replaces* the configured one at boot rather
  # than sitting alongside it, and by the time any of our code runs the
  # configured credentials are no longer readable from the wifi component —
  # so the only way to offer "put the original network back" is to hand them
  # to p4_wifi.h ourselves at boot. Compiled into the binary either way.
  factory_wifi_ssid: !secret wifi_ssid
  factory_wifi_password: !secret wifi_password

  # ── Relay board ───────────────────────────────────────────────────────────
  modbus_relay_address: "1"

  # ── RTD board 1: CH1 = coolroom air, CH2 = evaporator (FIXED roles) ───────
  modbus_rtd1_address:          "100"
  modbus_rtd_universal_address: "249"
  rtd_temp_reg_ch1:             "1"
  rtd_temp_reg_ch2:             "2"
  rtd_temp_scale:               "0.1"

  # ── WiFi co-processor (ESP32-C6 via SDIO) ─────────────────────────────────
  # ✅ CONFIRMED from Waveshare esp32_p4_function_ev_board.h (CONFIG_BSP_BOARD_TYPE_FIB)
  wifi_sdio_clk_pin: GPIO18
  wifi_sdio_cmd_pin: GPIO19
  wifi_sdio_d0_pin:  GPIO14
  wifi_sdio_d1_pin:  GPIO15
  wifi_sdio_d2_pin:  GPIO16
  wifi_sdio_d3_pin:  GPIO17
  wifi_c6_reset_pin: GPIO54
  wifi_c6_wakeup_pin: GPIO6
  wifi_c6_wakeup_pin_num: "6"
  # On-board ES8311 / NS4150B audio (Waveshare 7B). Reserved — do not reuse
  # for RS485. Speech-alert playback is next; PA_Ctrl must be HIGH for sound.
  #
  # Waveshare names the two data pins from the codec's point of view: its
  # ASDOUT (GPIO11) is the codec driving the bus, and its DSDIN (GPIO9) is the
  # codec listening. These names invert relative to ESPHome's dout/din, which
  # are from the ESP's point of view — so playback goes out on GPIO9.
  audio_pa_ctrl_pin: GPIO53
  audio_i2s_mclk_pin: GPIO13
  audio_i2s_sclk_pin: GPIO12
  audio_i2s_dout_pin: GPIO9
  audio_i2s_lrck_pin: GPIO10
  audio_i2s_din_pin: GPIO11

  # ── Phase 4: Display & Touch GPIO (✅ confirmed from board schematic PDF) ─
  # INT_TP  → NLGPIO23, RESET_TP → NLGPIO33, BL_CTRL → NLGPIO32
  touch_int_pin:  GPIO23
  touch_int_pin_num: "23"
  touch_rst_pin:  GPIO33   # shared with LCD reset — ESPHome model handles LCD side
  display_bl_pin: GPIO32

  # ── Field I/O on the PH2.0 12PIN headers (✅ confirmed from board schematic) ─
  # P1 pin 7 = GPIO46, and P1 pin 8 = GND sits right beside it, so the reed
  # switch is a two-wire tail onto adjacent pins of one connector.
  # GPIO46 is a plain IO pad (datasheet pin 88, VDD_IO_5, no strapping/analog
  # function). GPIO20 must NOT be used: on this board it is the battery-sense
  # divider (BAT → R92 → GPIO20 → R93 → GND) and is not on either header.
  door_reed_pin_num: "46"

  # ── Control defaults ──────────────────────────────────────────────────────
  default_setpoint_c:   "2.0"
  default_comp_diff_c:  "1.0"
  default_alarm_high_c: "3.0"
  default_alarm_low_c:  "3.0"

  # ── Phase 6: Extended control parameter defaults ──────────────────────────
  default_comp_lockout_min:    "3"    # compressor off-delay (minutes)
  default_comp_min_run_min:    "2"    # compressor min ON time before cut-out allowed (min)
  default_startup_grace_min:   "15"   # no alarms for N min after boot
  default_defrost_grace_min:   "20"   # no alarms for N min after defrost
  default_alarm_persist_min:   "5"    # alarm must hold N min before siren
  default_alarm_hysteresis_c:  "0.5"  # temp band to clear alarm (°C)
  default_no_cool_alarm_min:   "60"   # no-cool alarm after N min compressor run
  default_door_alarm_delay_s:  "300"  # door open alarm delay (seconds, 5 min)
  default_defrost_interval_min: "480"  # defrost every N min (8h)
  default_defrost_duration_min: "30"   # max defrost on-time (min)
  default_defrost_drip_min:    "5"    # drip time after defrost (min)
  default_defrost_end_c:       "5.0"  # evap temp to terminate defrost (°C)
  default_defrost_skip_below_c: "-10.0"  # skip scheduled defrost if evap ≤ this (°C)
  default_defrost_force_max_min: "720"   # force defrost after N min even if skip-cold (12h)
  default_frost_rate_rh_pct:   "5.0"  # humidity-drop % that triggers frost-rate defrost
  default_frost_rate_window_s: "300"  # frost-rate sample window (seconds)
  # Ice: Precision polarity — large coolroom−evap gap = iced coil. Default 15°C.
  default_ice_delta_c:         "15.0"
  default_ice_dwell_min:       "10"   # ice condition must hold N min before alarm
  default_fallback_on_min:     "3"    # sensor fallback compressor on-time (min)
  default_fallback_off_min:    "27"   # sensor fallback compressor off-time (min)
  default_smart_delta_c:       "8.0"  # delta threshold for smart defrost trigger
  default_smart_dwell_min:     "30"   # delta must hold N min before smart defrost
  default_cal_samples_min:     "10"
  default_cal_samples_max:     "20"
  # Speaker volume as percent of the ES8311 register scale (50–90). 85 matches
  # the measured on-board level; the media player clamps to the same window.
  default_audio_volume_pct:    "85"
  # Keep the last N daily /sdcard/YYYY-MM-DD.csv temperature logs (7–365).
  # Pruned on mount / auto-remount and at most once per calendar day.
  default_sd_temp_log_retention_days: "60"
  # ── Phase 3: Defrost scheduling & probe health ────────────────────
  defrost_interval_h:  "8"      # hours between defrost cycles
  defrost_max_min:     "30"     # maximum defrost duration (minutes)
  probe_stale_ms:      "30000"  # probe 1 declared stale after this many ms

  # Hard safety ceiling on the startup alarm grace period — the grace stays
  # active past default_startup_grace_min until the room first reaches the
  # alarm-safe band (covers a slow pulldown from a warm start), but never
  # longer than this, so a genuinely stuck/broken pulldown still alarms
  # eventually. Not exposed as a tunable number entity (technical safety
  # limit, not an operational setting) — matches probe_stale_ms/
  # defrost_max_min's treatment above.
  startup_grace_max_min: "240"  # 4h hard ceiling on startup pulldown grace

  # ── Phase 5: SD logging & ntfy ──────────────────────────────
  log_interval_min:    "5"      # temperature log interval (minutes)
  ntfy_server:         "https://ntfy.sh"   # ntfy server URL
  ntfy_topic:          "sacor-coolroom"    # ntfy topic name
  # Per-alert-type priorities are runtime settings now (select: block below,
  # web Alarms & Notify tab) rather than one compile-time value for everything.

##############################################################################
# Platform
##############################################################################

# Voice alerts (ES8311 / speaker). Mic deferred — see p4_audio.yaml header.
# Anti-click: soft-start in p4_audio.yaml (canonical). Do not enable
# speaker.keep_alive (PR #15565) on 2026.7.0 — truncates clips. Details:
# reference/AUDIO_ALERTS.md § "Canonical anti-click approach".
packages:
  voice_audio: !include p4_audio.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - p4_helpers.h
    - p4_control.h
    - p4_ui.h
    - p4_logging.h
    - p4_log_manager.h
    - p4_wifi.h
    - p4_dashboard_html.h
    - p4_dashboard.h
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            // Keep the ESP32-C6 co-processor awake before hosted SDIO init.
            gpio_reset_pin((gpio_num_t) ${wifi_c6_wakeup_pin_num});
            gpio_set_direction((gpio_num_t) ${wifi_c6_wakeup_pin_num}, GPIO_MODE_OUTPUT);
            gpio_set_level((gpio_num_t) ${wifi_c6_wakeup_pin_num}, 1);

    - priority: 600
      then:
        - lambda: |-
            id(ctl_boot_ms) = millis();
            if (id(ctl_boot_ms) == 0) id(ctl_boot_ms) = 1;  // 0 means "never" below
            // Defrost interval clock starts counting from power-on rather
            // than triggering immediately (matches Carel's d0=off default —
            // no forced defrost on every reboot/OTA of an already-cold room).
            id(ctl_defrost_last_end_ms) = id(ctl_boot_ms);
            // Off-delay counts from power-on too. It used to start at 0, which
            // p4_ctl_comp_locked_out() reads as "compressor has never run, no
            // lockout owed" — so a reboot let the compressor restart on the
            // first control tick, which is exactly the short-cycle the off-delay
            // exists to prevent (a compressor restarted against undropped head
            // pressure stalls or trips). A power cut looks identical to the
            // compressor stopping, so boot is treated as an off event.
            id(ctl_comp_last_off_ms) = id(ctl_boot_ms);
            p4_log_boot();
            p4_ntp_set_fast_sync(${ntp_fast_sync_ms});
    - priority: -200
      then:
        - lambda: |-
            // Phase 5: mount SD card after all peripherals are up.
            //
            // Deliberately does NOT apply /sdcard/backup.json here. It used to,
            // "as recovery if NVS was reset/lost" — but an unconditional restore
            // makes the card, not NVS, the master copy of every setting: any
            // change made since the last time the Backup button was pressed was
            // silently reverted on the next reboot. Settings now live in NVS and
            // survive reboots on their own; backup.json is applied only when the
            // operator presses Restore All Settings from SD.
            if (p4_sd_mount()) {
                id(sd_card_ok) = true;
                p4_sd_prune_temp_logs_if_due(
                    (int) id(ctl_sd_temp_log_retention_days), true);
                size_t backup_size = 0;
                if (p4_sd_backup_present(&backup_size)) {
                    ESP_LOGI("sd", "Settings backup on card (%u bytes) — press "
                                   "Restore to apply it; not applied automatically",
                             (unsigned) backup_size);
                    p4_sd_log_event("BOOT", "SD mounted, backup available");
                } else {
                    p4_sd_log_event("BOOT", "SD mounted, no backup on card");
                }
            } else {
                id(sd_card_ok) = false;
                ESP_LOGW("sd", "SD card not found or mount failed");
            }

            // SoC LP RTC (Waveshare FAQ): if VBAT already held wall time across
            // reset, skip the 60s NTP hammer. Otherwise stay on fast sync until
            // the first SNTP settimeofday(). No I2C RTC chip on this board.
            if (p4_wall_clock_ok()) {
              p4_ntp_set_interval(${ntp_with_rtc_sync_ms});
              id(system_time_valid).publish_state(true);
              ESP_LOGI("rtc", "SoC LP RTC already has wall time — NTP interval %u ms",
                       (unsigned) ${ntp_with_rtc_sync_ms});
            } else {
              id(system_time_valid).publish_state(false);
              ESP_LOGI("rtc", "SoC LP RTC unset — fast NTP until first sync");
            }

            {
                uint8_t reg = 0x00;
                uint8_t b = 0;
                auto probe = [&](uint8_t addr) -> bool {
                    return id(i2c_bus).write_readv(addr, &reg, 1, &b, 1) == i2c::ERROR_OK;
                };

                if (probe(0x18)) {
                    id(hw_audio_ok) = true;
                    ESP_LOGI("audio", "ES8311 codec detected at 0x18 — speaker path ready");
                } else {
                    id(hw_audio_ok) = false;
                    ESP_LOGW("audio", "ES8311 not responding at 0x18 — speech alerts deferred");
                }
            }
    - priority: -250
      then:
        - lambda: |-
            // Custom SD log-manager endpoint (list/download/delete daily CSV
            // logs) — registered on the same AsyncWebServer instance
            // web_server uses, so it automatically inherits the same
            // basic-auth credentials via WebServerBase::add_handler().
            if (web_server_base::global_web_server_base != nullptr) {
                web_server_base::global_web_server_base->add_handler(new p4_logs::LogManagerHandler());
                ESP_LOGI("logmgr", "SD log manager endpoint registered at /logs");
                p4_wifi::set_factory_network("${factory_wifi_ssid}", "${factory_wifi_password}");
                p4_wifi::p4_wifi_register();
                p4_dash::p4_dashboard_register();
            }
    - priority: -100
      then:
        - lambda: id(status_text).publish_state("Booting...");
    - priority: -95
      then:
        # Apply NVS-restored speaker volume after the media player is up. The
        # speaker platform also restores its own volume; our % setting is the
        # operator-facing source of truth (web Audio tab / HA sync).
        - media_player.volume_set:
            id: coolroom_media
            volume: !lambda |-
              id(ctl_audio_volume_suppress_until_ms) = millis() + 2000;
              return id(ctl_audio_volume_pct) / 100.0f;
        - lambda: |-
            ESP_LOGI("audio", "Speaker volume applied from NVS: %.0f%%",
                     id(ctl_audio_volume_pct));
            // Coerce stale NVS: door light ON with sensor OFF is invalid.
            if (id(input_door_light_enabled) && !id(input_door_sensor_enabled)) {
              id(input_door_light_enabled) = false;
              ESP_LOGW("config", "Door light cleared at boot (sensor was off)");
            }
            if (id(input_door_hold_compressor) && !id(input_door_sensor_enabled)) {
              id(input_door_hold_compressor) = false;
              ESP_LOGW("config", "Door-hold compressor cleared at boot (sensor was off)");
            }
            // Coerce stale NVS: setpoint below the dial floor (was -30..15).
            if (id(ctl_setpoint) < ${dial_min_c}) {
              ESP_LOGW("config", "Setpoint %.1f°C raised to dial floor %.0f°C",
                       id(ctl_setpoint), (float) ${dial_min_c});
              id(ctl_setpoint) = ${dial_min_c};
            }
    - priority: -150
      then:
        # Settle after mipi_dsi's shared LCD/touch reset (GPIO33) before GT911
        # I2C bring-up. Confirmed needed on Waveshare ESP32-P4 GT911 boards
        # (ESPHome #15019 / vendor BSP): without a wall-clock gap, touch can
        # appear to init (I2C ACK) but never deliver usable touch events.
        - delay: 300ms

    - priority: -90
      then:
        - logger.log: "Wi-Fi enable_on_boot=true (SD on SDMMC slot 0, hosted on slot 1)"

esp32:
  variant: esp32p4
  # First real hardware in hand (2026-07-29) reports chip revision v1.3 via
  # esptool -- confirmed engineering-sample silicon (rev < 3.0). This flag
  # gates chip-revision-specific init (PSRAM/flash timing tuning differs
  # between ES and production silicon); already documented as required in
  # reference/hardware_pins.md but never applied since no board existed to
  # check the actual revision against until now. cpu_frequency below was
  # already at the ES-safe 360MHz cap independently, so that part was fine.
  engineering_sample: true
  # Every official Waveshare ESP-IDF example for this exact board (including
  # 08_lvgl_display_panel, the closest analog to what we're doing) sets
  # CONFIG_ESPTOOLPY_FLASHMODE_QIO — Quad I/O. We were on ESPHome's default
  # (DIO), confirmed via the ROM bootloader's own boot banner ("SPI mode:DIO")
  # captured from real hardware. A flash-mode mismatch against what the
  # physical chip is actually characterized for is a plausible cause of a
  # hang during the bootloader's own SPI-speed reconfiguration, which happens
  # very early -- before any of its own log output.
  flash_mode: qio
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESPHome's flash_mode: qio (above) only sets the CONFIG_ESPTOOLPY_
      # FLASHMODE_QIO choice-boolean, not the companion literal string
      # CONFIG_ESPTOOLPY_FLASHMODE that esptool's elf2image actually reads
      # when stamping the bootloader/app image header's flash-mode byte --
      # confirmed by inspecting the generated sdkconfig (QIO=y but the
      # string still read "dio") and the built binaries themselves (header
      # byte 0x02 = DIO in both bootloader.bin and the app image). Setting
      # the string explicitly here forces both to agree.
      CONFIG_ESPTOOLPY_FLASHMODE: "qio"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65535"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "16"
      # Phase 5: FATFS for SD card (long filename support).
      # LFN_NONE must be explicitly cleared: it and LFN_HEAP are members of the
      # same Kconfig choice, and ESPHome sets LFN_NONE=y for disable_fatfs
      # (default true) — which won, leaving the card on 8.3 names only. That
      # silently broke every filename this project writes except events.csv:
      # "1970-01-01.csv" (10-char stem) and "backup.json" (4-char extension)
      # both fail fopen(), which the log path then misread as a dead card.
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
      # Per-task run-time counters so we can derive CPU utilisation from idle
      # time (ulTaskGetIdleRunTimeCounterForCore). Selects USE_TRACE_FACILITY.
      # ESP32-P4 is not on FreeRTOS SMP yet (IDF-8113), so the non-SMP APIs apply.
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
      # ESPHome otherwise wraps fprintf() in a 512-byte buffer that calls
      # esp_system_abort() on overflow — it assumes nothing writes real files.
      # p4_sd_backup_params() emits ~1080 bytes of JSON in one fprintf, so
      # pressing "Backup All Settings to SD" panicked and rebooted the
      # controller, leaving a 0-byte backup.json behind. Costs ~11 KB flash.
      enable_full_printf: true
      # This project mounts the TF card directly (esp_vfs_fat_sdmmc_mount in
      # p4_logging.h) rather than through an ESPHome SD component, so nothing
      # calls require_fatfs()/require_vfs_support_dir() for us — say so here.
      disable_fatfs: false
      # Without this, opendir/readdir/stat/unlink are compiled out of the VFS
      # layer and return ENOSYS, so /logs always reported an empty card and
      # downloads 404'd even though fopen()/fread() on the same paths worked.
      disable_vfs_support_dir: false
  flash_size: 32MB
  partitions: partitions_custom.csv
  cpu_frequency: 360MHz

psram:
  mode: hex
  # Keep PSRAM at a conservative speed during bench bring-up. The UI path is
  # PSRAM-heavy; aggressive timing can destabilize early hardware sessions.
  speed: 100MHZ

##############################################################################
# WiFi via ESP32-C6 co-processor (ESP-Hosted SDIO)
# ✅ SDIO PINS CONFIRMED from Waveshare esp32_p4_function_ev_board.h (FIB variant)
##############################################################################

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: ${wifi_c6_reset_pin}
  active_high: true
  clk_pin: ${wifi_sdio_clk_pin}
  cmd_pin: ${wifi_sdio_cmd_pin}
  d0_pin:  ${wifi_sdio_d0_pin}
  d1_pin:  ${wifi_sdio_d1_pin}
  d2_pin:  ${wifi_sdio_d2_pin}
  d3_pin:  ${wifi_sdio_d3_pin}
  bus_width: 4
  sdio_frequency: 40MHz
  use_psram: true

wifi:
  # Re-enabled after fixing SDMMC slot collision: TF card was on slot 1
  # (same controller as ESP-Hosted C6). Waveshare BSP uses slot 0 for TF.
  enable_on_boot: true
  power_save_mode: NONE
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
  # Keep control logic autonomous if Wi-Fi/AP is unavailable.
  reboot_timeout: 0s
  ap:
    ssid: "CoolroomP4-Setup"
    password: !secret ap_password
  on_connect:
    - lambda: |-
        id(ctl_wifi_connected) = true;
        ESP_LOGI("wifi", "WiFi connected");
        ESP_LOGI("wifi", "IP: %s  SSID: %s",
                 id(ip_address).state.c_str(), id(wifi_ssid_text).state.c_str());
  on_disconnect:
    - lambda: id(ctl_wifi_connected) = false;

captive_portal:

api:
  # NOTE: ESPHome native API is inbound (Home Assistant connects to this device).
  # Endpoint selection (for web dashboards or proxies) must be handled by the
  # connecting client. In this project we now target HA's LAN IP over VPN
  # routing between sites instead of using a public IP fallback.
  #
  # Visibility is gated by sw_ha_api_enabled (default OFF). When off, any
  # connecting client is dropped immediately so HA cannot parse entities until
  # an operator opts in from the web Wireless tab.
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  on_client_connected:
    - lambda: |-
        ESP_LOGI("ha", "HA client connected: %s", client_info.c_str());
        if (!id(input_ha_api_enabled)) {
          p4_ha_api_drop_clients();
        }

ota:
  - platform: esphome
    password: !secret ota_password

mdns:
  disabled: false

##############################################################################
# Time — ESP32-P4 internal 48-bit LP RTC + SNTP (Waveshare FAQ)
#
# System Time API: SNTP calls settimeofday() into the SoC LP RTC.
# Network Sync: C6 Wi-Fi + NTP servers below.
# Optional 1220 cell in holder item 11 backs VBAT so time can survive power loss.
# No I2C RTC component — PCF8563 removed 2026-08-01.
##############################################################################

time:
  - platform: sntp
    id: ntp_time
    timezone: ${timezone}
    servers:
      - ${ntp_server_1}
      - ${ntp_server_2}
    on_time_sync:
      - lambda: |-
          // After first sync (or any later correction), settle to the normal
          // interval. If VBAT already held time at boot we may already be on
          // the longer cadence from on_boot — that is fine to keep.
          p4_ntp_mark_synced();
          if (p4_wall_clock_ok())
            p4_ntp_set_interval(${ntp_with_rtc_sync_ms});
          else
            p4_ntp_set_interval(${ntp_normal_sync_ms});
          id(system_time_valid).publish_state(p4_wall_clock_ok());
          ESP_LOGI("ntp", "Sync complete — SoC LP RTC updated, NTP interval set");

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    modbus_controller: WARN
    modbus: WARN
    sensor: WARN
    text_sensor: WARN

safe_mode:
  # Keep safe mode available for bad firmware, but avoid false boot-loop
  # detection during bench diagnostics when optional external hardware is
  # missing and/or USB logging tools trigger an early reset event.
  boot_is_good_after: 1s
  num_attempts: 8

web_server:
  port: 80
  version: 3
  # No HTTP Basic Auth on the stock web_server / REST API — guest live metrics on
  # the Coolroom dashboard need unauthenticated GET /api/states. Operator elevation
  # is dashboard Login only: credentials from secrets.yaml are hashed into the
  # embedded HTML at build time (scripts/embed_dashboard.py). LAN trust model —
  # anyone on the network can call the API; treat the LAN as the trust boundary.
  # Open: http://<device-ip>/  (redirects to /assets/dashboard.html) or /dashboard
  # Web dashboard access model (see reference/RBAC_USER_GUIDE.md):
  # ESPHome's web_server auth is a single pair and cannot do "guest read / operator
  # write". Dashboard guest/operator is UI-only; "operator" means "passed Login".
  #
  # Access REST API: GET http://192.168.x.x/api/states (JSON, no auth)
  # Dashboard: /assets/dashboard.html (or /dashboard) — served from firmware
  # Example: curl http://192.168.x.x/api/states | jq '.'
  sorting_groups:
    - id: group_system_info
      name: "System"
      sorting_weight: -200
    - id: group_network
      name: "Network & Connectivity"
      sorting_weight: -190
    - id: group_control
      name: "Temperature Control"
      sorting_weight: -100
    - id: group_compressor
      name: "Compressor"
      sorting_weight: -80
    - id: group_defrost
      name: "Defrost"
      sorting_weight: -60
    - id: group_probes
      name: "Probes & Sensors"
      sorting_weight: -40
    - id: group_door
      name: "Door"
      sorting_weight: -30
    - id: group_alarms
      name: "Alarms"
      sorting_weight: -20
    - id: group_audio
      name: "Audio Alerts"
      sorting_weight: -15
    - id: group_hardware
      name: "Hardware"
      sorting_weight: 90
    - id: group_diagnostics
      name: "Diagnostics"
      sorting_weight: 100

##############################################################################
# I2C — GT911 touch + external I2C header (item 19, PH2.0 4-PIN: SDA/SCL
# GPIO7/8, on-board pullups already present, do not enable internal pullups).
#
# Phase 2 deliberately kept this bus free of primary coolroom/evap probes
# (RS485 RTD handles those). Humidity (and ambient temp) use SHT31 / SHT20 on
# this same bus. Addresses: GT911 0x5D, SHT31 0x44/0x45, SHT20 0x40, ES8311
# 0x18 (codec). No I2C RTC — wall clock is SoC LP RTC + SNTP. See
# reference/hardware_pins.md.
##############################################################################

i2c:
  - id: i2c_bus
    sda: ${i2c_sda_pin}
    scl: ${i2c_scl_pin}
    scan: true
    # Waveshare official BSP (esp32_p4_wifi6_touch_lcd_7b) defaults to 400 kHz.
    frequency: 400kHz

##############################################################################
# RS485 / Modbus
# ✅ UART PINS CONFIRMED from Waveshare 13_RS485_Test example (GPIO 27 TX / 26 RX)
##############################################################################

uart:
  - id: rs485_uart
    tx_pin: ${rs485_tx_pin}
    rx_pin: ${rs485_rx_pin}
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE

modbus:
  - id: rs485_modbus
    uart_id: rs485_uart
    send_wait_time: 250ms

modbus_controller:
  - id: relay_board
    address: ${modbus_relay_address}
    modbus_id: rs485_modbus
    setup_priority: -10
    update_interval: 5s
    on_online:
      - lambda: |-
          id(hw_rs485_relay_ok) = true;
          ESP_LOGI("rs485", "Relay board ONLINE");
          // The relay board is a separate device on its own supply: a
          // controller reboot doesn't clear its coils, and the first poll after
          // reconnecting publishes whatever they were still holding. That both
          // showed the compressor as running on the home screen seconds after a
          // reboot and left it genuinely energised during the boot off-delay.
          // Coils are commanded to a known-off state once, on the first
          // negotiation of this boot; the control tick takes over from there.
          if (!id(ctl_relays_synced_at_boot)) {
              id(ctl_relays_synced_at_boot) = true;
              id(relay_compressor).turn_off();
              id(relay_fan).turn_off();
              id(relay_siren).turn_off();
              // The light coil latches the same way, which left the home-screen
              // bulb lit after a reboot. It is reconciled rather than simply
              // cleared: with Door-Triggered Light on and the door already open
              // at boot, the reed sensor's only on_state fires before the board
              // negotiates, so an unconditional turn_off() would leave an open
              // door dark until someone closed it again.
              // Door light requires Door Sensor Enabled — light alone is nonsense.
              bool light_should_be_on = false;
              if (id(input_door_sensor_enabled) && id(input_door_light_enabled) &&
                  id(ctl_relay_light_enabled)) {
                  light_should_be_on = p4_door_is_open(
                      id(ctl_door_sensor_mode_is_nc), id(door_reed_sensor).state);
              }
              if (light_should_be_on) id(relay_light).turn_on();
              else                    id(relay_light).turn_off();
              ESP_LOGI("rs485", "Relay coils reset after boot (light %s)",
                       light_should_be_on ? "ON — door open" : "OFF");
          }
    on_offline:
      - lambda: |-
          id(hw_rs485_relay_ok) = false;
          ESP_LOGW("rs485", "Relay board OFFLINE");

  - id: rtd_board_1
    address: ${modbus_rtd1_address}
    modbus_id: rs485_modbus
    setup_priority: -10
    update_interval: 2s
    on_online:
      - lambda: |-
          id(hw_rs485_rtd1_ok) = true;
          ESP_LOGI("rs485", "RTD board 1 ONLINE");
    on_offline:
      - lambda: |-
          id(hw_rs485_rtd1_ok) = false;
          ESP_LOGW("rs485", "RTD board 1 OFFLINE");

##############################################################################
# Relay Switches — coils 0-3 on relay_board
##############################################################################

switch:
  # Coil 0 — Fan Relay (optional / future). Plant today: evaporator fans run
  # continuously hardwired, not through this coil — leave Fan Relay Enabled off.
  # When fans are later moved onto coil 0 and the enable is on: fan follows the
  # compressor; forced off during defrost + drip. Defrost is always passive
  # (compressor held off); flame UI follows ctl_defrost_active, not this coil.
  - platform: modbus_controller
    modbus_controller_id: relay_board
    id: relay_fan
    name: "Fan Relay"
    icon: "mdi:fan"
    web_server:
      sorting_group_id: group_compressor
      sorting_weight: 2
    register_type: coil
    address: 0
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: ESP_LOGI("relay", "Fan ON");
    on_turn_off:
      - lambda: ESP_LOGI("relay", "Fan OFF");

  - platform: modbus_controller
    modbus_controller_id: relay_board
    id: relay_compressor
    name: "Compressor Relay"
    icon: "mdi:hvac"
    web_server:
      sorting_group_id: group_compressor
      sorting_weight: 1
    register_type: coil
    address: 1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: ESP_LOGI("relay", "Compressor ON");
      - lvgl.led.update:
          id: led_compressor
          brightness: 100%
      - lvgl.label.update:
          id: ui_compressor_icon
          text_color: col_blue
    on_turn_off:
      - lambda: ESP_LOGI("relay", "Compressor OFF");
      - lvgl.led.update:
          id: led_compressor
          brightness: 0%
      - lvgl.label.update:
          id: ui_compressor_icon
          text_color: col_grey

  - platform: modbus_controller
    modbus_controller_id: relay_board
    id: relay_light
    name: "Light Relay"
    icon: "mdi:lightbulb"
    web_server:
      sorting_group_id: group_door
      sorting_weight: 5
    register_type: coil
    address: 2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: ESP_LOGI("relay", "Light ON");
      - lvgl.led.update:
          id: led_light
          brightness: 100%
      - lvgl.label.update:
          id: ui_light_icon
          text_color: col_orange
    on_turn_off:
      - lambda: ESP_LOGI("relay", "Light OFF");
      - lvgl.led.update:
          id: led_light
          brightness: 0%
      - lvgl.label.update:
          id: ui_light_icon
          text_color: col_grey

  - platform: modbus_controller
    modbus_controller_id: relay_board
    id: relay_siren
    name: "Siren Relay"
    icon: "mdi:alarm-bell"
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 5
    register_type: coil
    address: 3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: ESP_LOGI("relay", "Siren ON");
    on_turn_off:
      - lambda: ESP_LOGI("relay", "Siren OFF");

  # Master switch for ntfy push delivery. Alarms, banners, siren and SD event
  # logging keep working either way — this only gates the HTTP posts.
  #
  # restore_mode: DISABLED on this and every other config switch below is
  # load-bearing, not tidy-up. These switches are windows onto an NVS-backed
  # global, not state holders. With the default RESTORE_DEFAULT_OFF, ESPHome
  # restores the *switch's own* saved state at setup() and fires the matching
  # turn_on/turn_off action — which overwrites the global that the globals
  # component had just restored correctly. Any switch never toggled since the
  # last flash had no saved state at all, so it defaulted to OFF and silently
  # disabled defrost/siren/probe-2/humidity on every single boot.
  - platform: template
    id: sw_ntfy_enabled
    name: "ntfy Notifications Enabled"
    icon: "mdi:bell-badge"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 20
    turn_on_action:
      - lambda: |-
          id(input_ntfy_enabled) = true;
          ESP_LOGI("ntfy", "Push notifications ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(input_ntfy_enabled) = false;
          ESP_LOGI("ntfy", "Push notifications DISABLED");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(input_ntfy_enabled);'

  # Opt-in native API for Home Assistant. Off by default — the custom web
  # dashboard is the primary UI. When on, HA can discover/subscribe to every
  # published sensor, switch, number, etc. Turning off drops connected clients
  # immediately (NVS-backed; re-enable only from web/stock UI, not from HA).
  - platform: template
    id: sw_ha_api_enabled
    name: "Home Assistant API Enabled"
    icon: "mdi:home-assistant"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_network
      sorting_weight: 10
    turn_on_action:
      - lambda: |-
          id(input_ha_api_enabled) = true;
          ESP_LOGI("ha", "Home Assistant API ENABLED — clients may connect");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(input_ha_api_enabled) = false;
          ESP_LOGI("ha", "Home Assistant API DISABLED");
          p4_ha_api_drop_clients();
      - script.execute: persist_config_to_nvs
    lambda: 'return id(input_ha_api_enabled);'

  # ── Relay hardware enables ──────────────────────────────────────────────
  # Turning one off de-energises its coil immediately rather than waiting for
  # the next control tick, so "disable" is instant from the operator's point
  # of view; the tick then holds it off (see the enforcement block there).
  - platform: template
    id: sw_relay_compressor_enabled
    name: "Compressor Relay Enabled"
    icon: "mdi:power-plug"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_hardware
      sorting_weight: 30
    turn_on_action:
      - lambda: |-
          id(ctl_relay_compressor_enabled) = true;
          ESP_LOGI("relay", "Compressor relay ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(ctl_relay_compressor_enabled) = false;
          if (id(relay_compressor).state) {
              id(relay_compressor).turn_off();
              id(ctl_comp_last_off_ms) = millis();
              id(ctl_comp_on_since_ms) = 0;
          }
          ESP_LOGW("relay", "Compressor relay DISABLED — output held off");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(ctl_relay_compressor_enabled);'

  - platform: template
    id: sw_relay_fan_enabled
    name: "Fan Relay Enabled"
    icon: "mdi:fan"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_hardware
      sorting_weight: 31
    turn_on_action:
      - lambda: |-
          id(ctl_relay_fan_enabled) = true;
          ESP_LOGI("relay", "Fan relay ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(ctl_relay_fan_enabled) = false;
          if (id(relay_fan).state) id(relay_fan).turn_off();
          ESP_LOGW("relay", "Fan relay DISABLED — output held off");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(ctl_relay_fan_enabled);'

  - platform: template
    id: sw_relay_light_enabled
    name: "Light Relay Enabled"
    icon: "mdi:power-plug"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_hardware
      sorting_weight: 32
    turn_on_action:
      - lambda: |-
          id(ctl_relay_light_enabled) = true;
          ESP_LOGI("relay", "Light relay ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(ctl_relay_light_enabled) = false;
          if (id(relay_light).state) id(relay_light).turn_off();
          ESP_LOGW("relay", "Light relay DISABLED — output held off");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(ctl_relay_light_enabled);'

  - platform: template
    id: sw_relay_siren_enabled
    name: "Siren Relay Enabled"
    icon: "mdi:power-plug"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_hardware
      sorting_weight: 33
    turn_on_action:
      - lambda: |-
          id(ctl_relay_siren_enabled) = true;
          ESP_LOGI("relay", "Siren relay ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(ctl_relay_siren_enabled) = false;
          if (id(relay_siren).state) id(relay_siren).turn_off();
          ESP_LOGW("relay", "Siren relay DISABLED — alarms still raise, siren stays silent");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(ctl_relay_siren_enabled);'

  # On-board NS4150B amp enable (GPIO 53). HIGH = speaker powered. Kept as an
  # explicit diagnostic switch until speech-alert playback is wired through
  # ES8311 / i2s_audio — alarms can then turn this on before playing a clip.
  - platform: gpio
    id: audio_pa_enable
    name: "Speaker Amplifier"
    icon: "mdi:speaker"
    entity_category: diagnostic
    pin:
      number: ${audio_pa_ctrl_pin}
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 40

  # ── Door Sensor Mode (NC=on / NO=off) ───────────────────────────────────────
  # Previously also toggled relay_light directly (id: door_sensor_mode_light_
  # control) — an unintentional coupling where changing the wiring-mode
  # setting flipped the cabinet light as a side effect. Decoupled: this
  # switch only sets NC/NO now. Door-triggered lighting is its own feature —
  # see sw_door_light_enabled below and the door_reed_sensor on_state handler.
  - platform: template
    id: door_sensor_mode_nc_no
    name: "Door Sensor Mode (NC or NO)"
    icon: "mdi:door"
    restore_mode: DISABLED
    web_server:
      sorting_group_id: group_door
      sorting_weight: 3
    turn_on_action:
      - lambda: |-
          id(ctl_door_sensor_mode_is_nc) = true;
          ESP_LOGI("door", "Door sensor mode: NC (Normally Closed)");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(ctl_door_sensor_mode_is_nc) = false;
          ESP_LOGI("door", "Door sensor mode: NO (Normally Open)");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(ctl_door_sensor_mode_is_nc);'

  # ── Door-Triggered Light — requires Door Sensor Enabled. Opening the door
  # turns relay_light on, closing it turns relay_light off. You cannot run the
  # light feature with the door sensor off (the reed is what drives it). Default
  # off to match Door Sensor Enabled; enabling light auto-enables the sensor.
  - platform: template
    id: sw_door_light_enabled
    name: "Door-Triggered Light Enabled"
    icon: "mdi:lightbulb-on-outline"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_door
      sorting_weight: 4
    turn_on_action:
      - lambda: |-
          // Light without the sensor is nonsense — pull the master on too.
          if (!id(input_door_sensor_enabled)) {
            id(input_door_sensor_enabled) = true;
            ESP_LOGI("config", "Door sensor auto-ENABLED (required for door light)");
          }
          id(input_door_light_enabled) = true;
          // Apply immediately from the current reed state — otherwise the
          // operator has to open/close the door once before anything moves,
          // which reads as "the switch does nothing".
          if (id(ctl_relay_light_enabled)) {
            bool door_is_open = p4_door_is_open(
                id(ctl_door_sensor_mode_is_nc), id(door_reed_sensor).state);
            if (door_is_open) id(relay_light).turn_on();
            else              id(relay_light).turn_off();
          }
          ESP_LOGI("config", "Door-triggered light ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(input_door_light_enabled) = false;
          // Drop the light if it was being held on by the door feature.
          if (id(relay_light).state) id(relay_light).turn_off();
          ESP_LOGI("config", "Door-triggered light DISABLED");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(input_door_light_enabled);'

  # ── Hold compressor while door open (Carel-style pause). Default off so a
  # missing/stuck reed cannot starve cooling. Requires Door Sensor Enabled.
  - platform: template
    id: sw_door_hold_compressor
    name: "Hold Compressor While Door Open"
    icon: "mdi:door-closed-lock"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_door
      sorting_weight: 5
    turn_on_action:
      - lambda: |-
          if (!id(input_door_sensor_enabled)) {
            id(input_door_sensor_enabled) = true;
            ESP_LOGI("config", "Door sensor auto-ENABLED (required for door hold)");
          }
          id(input_door_hold_compressor) = true;
          ESP_LOGI("config", "Door-hold compressor ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(input_door_hold_compressor) = false;
          ESP_LOGI("config", "Door-hold compressor DISABLED");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(input_door_hold_compressor);'

  # ── Dew-point-triggered early defrost — an early-defrost trigger layered
  # on top of the fixed interval, not a replacement for it. See the control
  # tick's dew-point section for the actual trigger condition.
  - platform: template
    id: sw_dew_point_trigger
    name: "Dew Point Early Defrost Trigger"
    icon: "mdi:water-percent"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 6
    turn_on_action:
      - lambda: |-
          id(input_dew_point_trigger_enabled) = true;
          ESP_LOGI("config", "Dew point early defrost trigger ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(input_dew_point_trigger_enabled) = false;
          ESP_LOGI("config", "Dew point early defrost trigger DISABLED");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(input_dew_point_trigger_enabled);'

  - platform: template
    id: sw_defrost_skip_cold
    name: "Defrost Skip-If-Cold"
    icon: "mdi:snowflake-off"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 8
    turn_on_action:
      - lambda: |-
          id(input_defrost_skip_cold_enabled) = true;
          ESP_LOGI("config", "Defrost skip-if-cold ENABLED");
      - script.execute: persist_config_to_nvs
    turn_off_action:
      - lambda: |-
          id(input_defrost_skip_cold_enabled) = false;
          ESP_LOGI("config", "Defrost skip-if-cold DISABLED");
      - script.execute: persist_config_to_nvs
    lambda: 'return id(input_defrost_skip_cold_enabled);'

  - platform: template
    id: sw_frost_rate_monitoring
    name: "Frost Rate Monitoring"
    icon: "mdi:water-percent-alert"
    restore_mode: DISABLED
    entity_category: config
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 9
    turn_on_action:
      - lambda: |-
          id(input_frost_rate_monitoring_enabled) = true;
