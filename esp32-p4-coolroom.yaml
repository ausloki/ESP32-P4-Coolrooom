          // open at the moment this is disabled could still alarm later
          // once re-enabled, off a stale timestamp.
          id(ctl_door_open_since_ms) = 0;
          id(ctl_door_alarm_active) = false;
          // Door light cannot run without the sensor — force it off too.
          if (id(input_door_light_enabled)) {
            id(input_door_light_enabled) = false;
            if (id(relay_light).state) id(relay_light).turn_off();
            ESP_LOGI("config", "Door-triggered light auto-DISABLED (sensor off)");
