    # Info page — two-column diagnostics, readable spacing for 1024x600
    - id: page_info
      bg_color: col_bg
      widgets:
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 56
            bg_color: col_panel
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  x: 16
                  y: 0
                  width: 900
                  height: 56
                  align: LEFT_MID
                  text: "System Information"
                  text_font: font_medium
                  text_color: col_text

        - obj:
            x: 12
            y: 64
            width: 1000
            height: 480
            bg_color: col_bg
            border_width: 0
            pad_all: 0
            scrollable: true
            scrollbar_mode: "AUTO"
            widgets:
              # Left column — Memory / CPU / PSRAM / uptime / WiFi. CPU sits
              # under Memory; later rows shift down ~80px (scrollable).
              - label: {x: 0, y: 0, width: 470, text: "Memory", text_font: font_medium, text_color: col_subtext}
              - label: {id: lbl_info_heap, x: 0, y: 32, width: 470, text: "---", text_font: font_medium, text_color: col_text}
              - label: {x: 0, y: 80, width: 470, text: "CPU", text_font: font_medium, text_color: col_subtext}
