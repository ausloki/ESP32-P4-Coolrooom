                  rotation: 0
                  start_angle: 150
                  end_angle: 30
                  value: 50
                  indicator:
                    arc_opa: TRANSP
                  knob:
                    bg_opa: TRANSP

              # Arc 2: Setpoint Temperature (Middle, Cyan)
              - arc:
                  id: home_setpoint_arc
                  align: CENTER
                  y: 0
                  width: 316
                  height: 316
                  bg_opa: TRANSP
                  arc_color: col_cyan
                  arc_width: 12
                  rotation: 0
                  start_angle: 150
                  end_angle: 30
                  value: 50
                  indicator:
                    arc_opa: TRANSP
                  knob:
                    bg_opa: TRANSP

              # Arc 3: Ambient Temperature (Inner, Pink)
              # Innermost ring -- its inner edge (284-12=272) has to clear
              # the inner cover below (a fixed 270px box; LVGL draws
              # border_width inside the box, so 270 is its true outer
              # edge too), currently leaving a slim ~2px gap. This ring
              # can't shrink much further without also shrinking the
              # inner cover (which holds the temp-readout text, so that's
              # a layout change, not just a resize -- flag it rather than
              # guess if more headroom is needed here).
              - arc:
