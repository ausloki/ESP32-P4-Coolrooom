    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_no_cool_alarm_sent
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_ice_alarm_sent
    type: bool
    restore_value: no
