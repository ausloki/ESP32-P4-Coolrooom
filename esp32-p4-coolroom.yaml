  # should be logged for troubleshooting regardless of whether the device
  # happens to be online at that exact moment. Previously ALARM_HI/LO/
  # PROBE_FAULT logging lived inside the WiFi-gated block and simply never
  # wrote to SD at all while offline; door/no-cool/ice alarms had no event
  # logging whatsoever.
  - id: ctl_alarm_hi_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_alarm_lo_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_probe_fault_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_door_alarm_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_no_cool_alarm_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_ice_alarm_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_relay_board_offline_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_temp_board_offline_logged
    type: bool
    restore_value: no
    initial_value: "false"

