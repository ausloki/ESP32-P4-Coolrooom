    restore_value: no
    initial_value: "0"

  - id: rtd1_ch2_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # ── Probe enable flags (NVS-persistent) ───────────────────────────────────
  - id: input_probe2_enabled
