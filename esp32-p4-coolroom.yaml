##############################################################################
# Phase 5: HTTP request component for ntfy push notifications
##############################################################################

http_request:
  verify_ssl: false
  timeout: 10s

##############################################################################
# Phase 3: 10-second control loop
# All decision logic lives in p4_control.h. This lambda is the orchestrator.
##############################################################################

interval:
  - interval: 10s
    then:
      - lambda: |-
          const uint32_t now_ms = millis();
          float t    = id(probe1_temp).state;
          float evap = id(probe2_temp).state;
          bool evap_ok = p4_rtd_valid(evap) && p4_sample_fresh(id(rtd1_ch2_last_ms), ${probe_stale_ms} * 3);
          // Captured up front so a single check at the end of this tick can
          // log exactly one COMPRESSOR_ON/OFF event per actual transition,
          // regardless of which branch below changed the relay.
          bool comp_was_on = id(relay_compressor).state;
          bool sd_was_ready = p4_sd_is_ready();

          // ── 1. Probe fault detection ────────────────────────────────────
          bool fault = p4_ctl_probe_fault(t, id(rtd1_ch1_last_ms), ${probe_stale_ms});
          id(ctl_probe_fault) = fault;

          // ── 2. Grace periods ────────────────────────────────────────────
          const uint32_t startup_grace_ms     = (uint32_t)(id(ctl_startup_grace_min)  * 60000.0f);
          const uint32_t startup_grace_max_ms = (uint32_t)(${startup_grace_max_min}   * 60000.0f);
          const uint32_t defrost_grace_ms     = (uint32_t)(id(ctl_defrost_grace_min)  * 60000.0f);
          const uint32_t alarm_persist_ms     = (uint32_t)(id(ctl_alarm_persist_min)  * 60000.0f);

          // Pulldown-aware: extends the plain startup grace timer (still the
          // floor for a normal quick pulldown) until the room actually first
          // reaches the alarm-safe band, capped at startup_grace_max_min so a
          // genuinely stuck pulldown still alarms eventually.
          if (!id(ctl_startup_pulldown_done) &&
              p4_ctl_pulldown_reached(t, id(ctl_setpoint),
                                       id(ctl_alarm_high_delta), id(ctl_alarm_low_delta))) {
              id(ctl_startup_pulldown_done) = true;
              ESP_LOGI("ctl", "Startup pulldown reached — normal alarm grace resumes");
          }
          bool in_grace = p4_ctl_startup_grace_active(id(ctl_boot_ms), startup_grace_ms,
                                                       startup_grace_max_ms,
                                                       id(ctl_startup_pulldown_done)) ||
                          p4_ctl_defrost_grace(id(ctl_defrost_last_end_ms), defrost_grace_ms);

          // ── 3. Sensor fallback duty cycle (when probe is faulted) ───────
          bool fallback_run = p4_ctl_fallback_should_run(
              fault, id(input_fallback_enabled),
              id(ctl_fallback_phase_on), id(ctl_fallback_last_toggle_ms),
              (uint32_t)(id(ctl_fallback_on_min)  * 60000.0f),
              (uint32_t)(id(ctl_fallback_off_min) * 60000.0f));
          if (fault) {
              id(ctl_sensor_fallback_active) = id(input_fallback_enabled);
              if (!id(relay_defrost).state) {
                  if (fallback_run && !id(relay_compressor).state) {
                      id(relay_compressor).turn_on();
                      id(ctl_comp_on_since_ms) = now_ms;
                  } else if (!fallback_run && id(relay_compressor).state) {
                      id(relay_compressor).turn_off();
                      id(ctl_comp_last_off_ms) = now_ms;
                      id(ctl_comp_on_since_ms) = 0;
                  }
              }
              // Drive siren for probe fault
              if (id(input_siren_enabled) && !id(relay_siren).state)
                  id(relay_siren).turn_on();
          } else {
              if (id(ctl_sensor_fallback_active)) {
                  id(ctl_sensor_fallback_active) = false;
                  id(ctl_fallback_last_toggle_ms) = 0;
              }
          }

          // ── 4. Compressor lockout (off-delay protection) ─────────────────
          const uint32_t lockout_ms = (uint32_t)(id(ctl_comp_lockout_min) * 60000.0f);
          bool locked_out = p4_ctl_comp_locked_out(id(ctl_comp_last_off_ms), lockout_ms);

          // ── 5. Defrost sequencing (skip if probe fault) ──────────────────
          if (!fault) {
              const uint32_t def_interval_ms  = (uint32_t)(id(ctl_defrost_interval_min) * 60000.0f);
              const uint32_t def_duration_ms  = (uint32_t)(id(ctl_defrost_duration_min) * 60000.0f);
              const uint32_t drip_ms          = (uint32_t)(id(ctl_defrost_drip_min)     * 60000.0f);

              if (id(ctl_defrost_dripping)) {
                  // Drip phase: keep compressor off until drip time elapsed
                  if (id(relay_compressor).state) {
                      id(relay_compressor).turn_off();
                      id(ctl_comp_last_off_ms) = now_ms;
                      id(ctl_comp_on_since_ms) = 0;
                  }
                  if ((now_ms - id(ctl_drip_start_ms)) >= drip_ms) {
                      id(ctl_defrost_dripping) = false;
                      ESP_LOGI("ctl", "Drip phase complete");
                  }
              } else if (id(relay_defrost).state) {
                  // Defrost running: keep compressor off, watch for end conditions
                  if (id(relay_compressor).state) {
                      id(relay_compressor).turn_off();
                      id(ctl_comp_last_off_ms) = now_ms;
                      id(ctl_comp_on_since_ms) = 0;
                  }
                  bool end_by_temp = evap_ok && id(input_defrost_term_temp_enabled) &&
                                     p4_ctl_defrost_term_by_temp(evap, id(ctl_defrost_end_c), true);
                  bool end_by_time = p4_ctl_defrost_timeout(id(ctl_defrost_on_since_ms), def_duration_ms);
                  if (end_by_temp || end_by_time) {
                      id(relay_defrost).turn_off();
                      id(ctl_defrost_last_end_ms) = now_ms;
                      id(ctl_dew_point_defrost_triggered) = false;
                      {
                          char detail[96];
                          snprintf(detail, sizeof(detail), "%s coolroom=%.1f evap=%.1f term_c=%.1f",
                                   end_by_temp ? "evap_temp" : "timeout", t, evap, id(ctl_defrost_end_c));
                          p4_sd_log_event("DEFROST_END", detail);
                      }
                      if (id(input_defrost_drip_enabled) && drip_ms > 0) {
                          id(ctl_defrost_dripping) = true;
                          id(ctl_drip_start_ms) = now_ms;
                      }
                  }
              } else {
                  // Not defrosting: check if a cycle should start
                  bool manual_start = id(ctl_manual_defrost_req);
                  // Smart delta tracking
                  if (id(input_smart_defrost_enabled) && evap_ok) {
                      float delta = t - evap;
                      if (delta >= id(ctl_smart_delta_c) && id(relay_compressor).state) {
                          if (id(ctl_defrost_delta_since_ms) == 0)
                              id(ctl_defrost_delta_since_ms) = now_ms;
                      } else {
                          id(ctl_defrost_delta_since_ms) = 0;
                      }
                  }
                  bool smart_start = id(input_smart_defrost_enabled) &&
                      p4_ctl_smart_defrost_ready(t, evap,
                          id(ctl_smart_delta_c),
                          id(ctl_defrost_delta_since_ms),
                          (uint32_t)(id(ctl_smart_dwell_min) * 60000.0f),
                          id(ctl_comp_on_since_ms),
                          (uint32_t)(15UL * 60000UL),  // 15 min min comp run
                          false);
                  bool time_start = p4_ctl_defrost_due(id(ctl_defrost_last_end_ms), def_interval_ms);

                  // ── Dew-point-triggered early defrost ─────────────────────
                  // Uses the internal SHT31 (temp+humidity) as the reference
                  // for the surrounding air's dew point — an early trigger
                  // layered on top of the interval/smart triggers above, not
                  // a replacement for them.
                  bool dew_point_start = false;
                  if (id(input_dew_point_trigger_enabled) && id(input_humidity_internal_enabled)) {
                      float internal_t = id(probe_internal_temp).state;
                      float internal_rh = id(probe_internal_humidity).state;
                      id(ctl_last_dew_point_c) = p4_calc_dew_point_c(internal_t, internal_rh);
                      dew_point_start = p4_ctl_dew_point_defrost_ready(
                          evap, id(ctl_last_dew_point_c), id(ctl_dew_point_defrost_triggered));
                      if (dew_point_start) id(ctl_dew_point_defrost_triggered) = true;
                  }

                  if (manual_start || smart_start || time_start || dew_point_start) {
                      id(ctl_manual_defrost_req) = false;
                      id(ctl_defrost_delta_since_ms) = 0;
                      if (id(relay_compressor).state) {
                          id(relay_compressor).turn_off();
                          id(ctl_comp_last_off_ms) = now_ms;
                          id(ctl_comp_on_since_ms) = 0;
                      }
                      id(relay_defrost).turn_on();
                      id(ctl_defrost_on_since_ms) = now_ms;
                      const char* reason = manual_start ? "manual" :
                                           (smart_start ? "smart_delta" :
                                           (dew_point_start ? "dew_point" : "interval"));
                      ESP_LOGI("ctl", "Defrost started: %s", reason);
                      {
                          char detail[112];
                          snprintf(detail, sizeof(detail), "%s coolroom=%.1f evap=%.1f setpoint=%.1f",
                                   reason, t, evap, id(ctl_setpoint));
                          p4_sd_log_event("DEFROST_START", detail);
                      }
                  }

                  // ── 6. Compressor hysteresis (skip if defrost, dripping, locked out) ──
                  if (!locked_out) {
                      int cmd = p4_ctl_compressor_eval(
                          t, id(ctl_setpoint), id(ctl_comp_diff),
                          id(relay_compressor).state,
                          id(rtd1_ch1_last_ms), ${probe_stale_ms});
                      if (cmd == 1) {
                          id(relay_compressor).turn_on();
                          if (id(ctl_comp_on_since_ms) == 0) id(ctl_comp_on_since_ms) = now_ms;
                      }
                      if (cmd == -1) {
                          if (id(relay_compressor).state) {
                              id(relay_compressor).turn_off();
                              id(ctl_comp_last_off_ms) = now_ms;
                              id(ctl_comp_on_since_ms) = 0;
                          }
                      }
                  }
              }
          }

          // ── 7. Alarm evaluation (with grace + persist + hysteresis) ──────
          if (!fault && !in_grace) {
              bool raw_hi = p4_ctl_alarm_high(t, id(ctl_setpoint), id(ctl_alarm_high_delta));
              bool raw_lo = p4_ctl_alarm_low(t, id(ctl_setpoint), id(ctl_alarm_low_delta));
              // Persist tracking
              if (raw_hi && id(ctl_high_alarm_since_ms) == 0) id(ctl_high_alarm_since_ms) = now_ms;
              if (!raw_hi) id(ctl_high_alarm_since_ms) = 0;
              if (raw_lo && id(ctl_low_alarm_since_ms) == 0) id(ctl_low_alarm_since_ms) = now_ms;
              if (!raw_lo) id(ctl_low_alarm_since_ms) = 0;
              bool hi = raw_hi && p4_ctl_alarm_persisted(id(ctl_high_alarm_since_ms), alarm_persist_ms);
              bool lo = raw_lo && p4_ctl_alarm_persisted(id(ctl_low_alarm_since_ms), alarm_persist_ms);
              id(ctl_alarm_high_active) = hi;
              id(ctl_alarm_low_active)  = lo;
              // No-cool alarm
              bool nc = p4_ctl_no_cool_alarm(t, id(ctl_setpoint), id(ctl_comp_diff),
                                              id(relay_compressor).state, id(ctl_comp_on_since_ms),
                                              (uint32_t)(id(ctl_no_cool_alarm_min) * 60000.0f));
              id(ctl_no_cool_alarm_active) = nc;
              // Ice alarm (needs evap probe)
              bool ice = evap_ok && p4_ctl_ice_alarm(t, evap, id(ctl_ice_delta_c));
              id(ctl_ice_alarm_active) = ice;
              // ── Door open alarm (with configurable delay) ────────────
              // Gated on input_door_sensor_enabled as a safety net — the
              // reed sensor's on_state already refuses to start the timer
              // while disabled, but this catches the edge case of the
              // switch being turned off mid-open before that fix existed
              // in an already-running session, or a stale timestamp.
              if (id(input_door_sensor_enabled) && id(ctl_door_open_since_ms) > 0) {
                  const uint32_t door_delay_ms = (uint32_t)(id(ctl_door_alarm_delay_s) * 1000.0f);
                  if ((now_ms - id(ctl_door_open_since_ms)) >= door_delay_ms)
                      id(ctl_door_alarm_active) = true;
              }
              // Siren: any active alarm drives it
              bool any_alarm = hi || lo || nc || ice || id(ctl_door_alarm_active);
              if (id(input_siren_enabled)) {
                  if (any_alarm && !id(relay_siren).state) id(relay_siren).turn_on();
                  if (!any_alarm && id(relay_siren).state) id(relay_siren).turn_off();
              }
          } else if (!fault) {
              // In grace: clear alarm flags, silence siren
              id(ctl_alarm_high_active) = false;
              id(ctl_alarm_low_active)  = false;
              id(ctl_no_cool_alarm_active) = false;
              id(ctl_ice_alarm_active)  = false;
              if (id(relay_siren).state) id(relay_siren).turn_off();
          }

          // ── 7b. Event-log edge detection (independent of WiFi/ntfy) ─────
          // Every alarm transition is logged to the SD event log for
          // troubleshooting regardless of whether ntfy delivery succeeds or
          // the device is online — reads the persisted *_active globals
          // (set in both branches above) rather than the if/else-scoped
          // locals, so it's agnostic to which branch actually ran this tick.
          {
              bool alarm_hi_now = id(ctl_alarm_high_active);
              if (alarm_hi_now && !id(ctl_alarm_hi_logged)) {
                  id(ctl_alarm_hi_logged) = true;
                  char d[96];
                  snprintf(d, sizeof(d), "coolroom=%.1f setpoint=%.1f delta=%.1f",
                           t, id(ctl_setpoint), id(ctl_alarm_high_delta));
                  p4_sd_log_event("ALARM_HI", d);
              } else if (!alarm_hi_now && id(ctl_alarm_hi_logged)) {
                  id(ctl_alarm_hi_logged) = false;
                  char d[64];
                  snprintf(d, sizeof(d), "coolroom=%.1f setpoint=%.1f", t, id(ctl_setpoint));
                  p4_sd_log_event("ALARM_HI_CLEAR", d);
              }

              bool alarm_lo_now = id(ctl_alarm_low_active);
              if (alarm_lo_now && !id(ctl_alarm_lo_logged)) {
                  id(ctl_alarm_lo_logged) = true;
                  char d[96];
                  snprintf(d, sizeof(d), "coolroom=%.1f setpoint=%.1f delta=%.1f",
                           t, id(ctl_setpoint), id(ctl_alarm_low_delta));
                  p4_sd_log_event("ALARM_LO", d);
              } else if (!alarm_lo_now && id(ctl_alarm_lo_logged)) {
                  id(ctl_alarm_lo_logged) = false;
                  char d[64];
                  snprintf(d, sizeof(d), "coolroom=%.1f setpoint=%.1f", t, id(ctl_setpoint));
                  p4_sd_log_event("ALARM_LO_CLEAR", d);
              }

              if (fault && !id(ctl_probe_fault_logged)) {
                  id(ctl_probe_fault_logged) = true;
                  p4_sd_log_event("PROBE_FAULT", "probe1 stale_or_invalid");
              } else if (!fault && id(ctl_probe_fault_logged)) {
                  id(ctl_probe_fault_logged) = false;
                  p4_sd_log_event("PROBE_FAULT_CLEAR", "probe1 recovered");
              }

              bool door_now = id(ctl_door_alarm_active);
              if (door_now && !id(ctl_door_alarm_logged)) {
                  id(ctl_door_alarm_logged) = true;
                  char d[80];
                  uint32_t open_s = id(ctl_door_open_since_ms) > 0 ?
                      (now_ms - id(ctl_door_open_since_ms)) / 1000U : 0U;
                  snprintf(d, sizeof(d), "open_for=%us delay=%.0fs", (unsigned) open_s, id(ctl_door_alarm_delay_s));
                  p4_sd_log_event("DOOR_ALARM", d);
              } else if (!door_now && id(ctl_door_alarm_logged)) {
                  id(ctl_door_alarm_logged) = false;
                  p4_sd_log_event("DOOR_ALARM_CLEAR", "door closed");
              }

              bool nc_now = id(ctl_no_cool_alarm_active);
              if (nc_now && !id(ctl_no_cool_alarm_logged)) {
                  id(ctl_no_cool_alarm_logged) = true;
                  char d[112];
                  snprintf(d, sizeof(d), "coolroom=%.1f setpoint=%.1f diff=%.1f compressor_on=%d",
                           t, id(ctl_setpoint), id(ctl_comp_diff), (int) id(relay_compressor).state);
                  p4_sd_log_event("NO_COOL_ALARM", d);
              } else if (!nc_now && id(ctl_no_cool_alarm_logged)) {
                  id(ctl_no_cool_alarm_logged) = false;
                  p4_sd_log_event("NO_COOL_ALARM_CLEAR", "room cooling normally");
              }

              bool ice_now = id(ctl_ice_alarm_active);
              if (ice_now && !id(ctl_ice_alarm_logged)) {
                  id(ctl_ice_alarm_logged) = true;
                  char d[96];
                  snprintf(d, sizeof(d), "coolroom=%.1f evap=%.1f delta_threshold=%.1f", t, evap, id(ctl_ice_delta_c));
                  p4_sd_log_event("ICE_ALARM", d);
              } else if (!ice_now && id(ctl_ice_alarm_logged)) {
                  id(ctl_ice_alarm_logged) = false;
                  p4_sd_log_event("ICE_ALARM_CLEAR", "delta recovered");
              }
          }

          // ── 8. SD temperature logging (Phase 5) ─────────────────────────
          const uint32_t log_every_ticks = (uint32_t)(${log_interval_min}) * 6U;
          id(log_tick_count) = id(log_tick_count) + 1U;
          if (id(sd_card_ok) && id(log_tick_count) >= log_every_ticks) {
              id(log_tick_count) = 0;
              p4_sd_log_temps(
                  id(probe1_temp).state, id(probe2_temp).state, id(probe_external_temp).state,
                  id(ctl_setpoint), id(relay_compressor).state, id(relay_defrost).state,
                  id(ctl_alarm_high_active), id(ctl_alarm_low_active), id(ctl_probe_fault));
          }

            // ── 9. ntfy push notifications — edge-triggered (Phase 5) ───────
            // Network delivery is optional; local control/alarm logic stays autonomous.
            // Event LOGGING for these already happened unconditionally in 7b above —
            // this block is purely about the WiFi-dependent push notification.
            if (id(ctl_wifi_connected)) {
              bool ntfy_hi = id(ctl_alarm_high_active);
              bool ntfy_lo = id(ctl_alarm_low_active);
              bool ntfy_pf = id(ctl_probe_fault);
              if (ntfy_hi && !id(ntfy_alarm_hi_sent)) {
                id(ntfy_alarm_hi_sent) = true;
                id(ntfy_high_alarm_request).trigger();
              } else if (!ntfy_hi && id(ntfy_alarm_hi_sent)) {
                id(ntfy_alarm_hi_sent) = false;
                id(ntfy_alarm_clear_request).trigger();
              }
              if (ntfy_lo && !id(ntfy_alarm_lo_sent)) {
                id(ntfy_alarm_lo_sent) = true;
                id(ntfy_low_alarm_request).trigger();
              } else if (!ntfy_lo && id(ntfy_alarm_lo_sent)) {
                id(ntfy_alarm_lo_sent) = false;
                id(ntfy_alarm_clear_request).trigger();
              }
              if (ntfy_pf && !id(ntfy_probe_fault_sent)) {
                id(ntfy_probe_fault_sent) = true;
                id(ntfy_probe_fault_request).trigger();
              } else if (!ntfy_pf && id(ntfy_probe_fault_sent)) {
                id(ntfy_probe_fault_sent) = false;
              }
              // Door/no-cool/ice — previously event-log only, now pushed too,
              // reusing the same generic "cleared" push the hi/lo alarms use.
              bool ntfy_door = id(ctl_door_alarm_active);
              bool ntfy_nc   = id(ctl_no_cool_alarm_active);
              bool ntfy_ice  = id(ctl_ice_alarm_active);
              if (ntfy_door && !id(ntfy_door_alarm_sent)) {
                id(ntfy_door_alarm_sent) = true;
                id(ntfy_door_alarm_request).trigger();
              } else if (!ntfy_door && id(ntfy_door_alarm_sent)) {
                id(ntfy_door_alarm_sent) = false;
                id(ntfy_alarm_clear_request).trigger();
              }
              if (ntfy_nc && !id(ntfy_no_cool_alarm_sent)) {
                id(ntfy_no_cool_alarm_sent) = true;
                id(ntfy_no_cool_alarm_request).trigger();
              } else if (!ntfy_nc && id(ntfy_no_cool_alarm_sent)) {
                id(ntfy_no_cool_alarm_sent) = false;
                id(ntfy_alarm_clear_request).trigger();
              }
              if (ntfy_ice && !id(ntfy_ice_alarm_sent)) {
                id(ntfy_ice_alarm_sent) = true;
                id(ntfy_ice_alarm_request).trigger();
              } else if (!ntfy_ice && id(ntfy_ice_alarm_sent)) {
                id(ntfy_ice_alarm_sent) = false;
                id(ntfy_alarm_clear_request).trigger();
              }
              // SD card failure — fires once per failure episode (mount-failed-at-boot
              // or a runtime write failure via p4_sd_mark_failed()), independent of the
              // event-log edge tracking above since a failed card can't log its own
              // failure. The "recovered" push itself is sent by the 60s auto-remount
              // interval, not here — this just clears the sent-flag defensively in
              // case the card came back some other way (e.g. a reboot) without going
              // through that interval.
              if (!id(sd_card_ok) && !id(ntfy_sd_failure_sent)) {
                id(ntfy_sd_failure_sent) = true;
                id(ntfy_sd_failure_request).trigger();
              } else if (id(sd_card_ok) && id(ntfy_sd_failure_sent)) {
                id(ntfy_sd_failure_sent) = false;
              }
            } else {
              // Keep edge flags reset while offline so active alarms can notify after reconnect.
              id(ntfy_alarm_hi_sent) = false;
              id(ntfy_alarm_lo_sent) = false;
              id(ntfy_probe_fault_sent) = false;
              id(ntfy_door_alarm_sent) = false;
              id(ntfy_no_cool_alarm_sent) = false;
              id(ntfy_ice_alarm_sent) = false;
              id(ntfy_sd_failure_sent) = false;
            }

          // ── 10. Compressor on/off event logging ──────────────────────────
          // Single check for the whole tick rather than a log call scattered
          // across every relay_compressor.turn_on()/turn_off() site above —
          // guarantees exactly one log entry per actual transition, with the
          // reason inferred from which mode was active this tick.
          {
              bool comp_is_on = id(relay_compressor).state;
              if (comp_is_on != comp_was_on) {
                  const char* reason = fault ? "sensor_fallback" :
                                       (id(relay_defrost).state || id(ctl_defrost_dripping)) ? "defrost" :
                                       locked_out ? "lockout_end" : "hysteresis";
                  char d[112];
                  snprintf(d, sizeof(d), "%s coolroom=%.1f setpoint=%.1f diff=%.1f",
                           reason, t, id(ctl_setpoint), id(ctl_comp_diff));
                  p4_sd_log_event(comp_is_on ? "COMPRESSOR_ON" : "COMPRESSOR_OFF", d);
              }
          }

          // ── 11. SD card runtime-failure detection ────────────────────────
          // p4_sd_mark_failed() (called from inside p4_logging.h's write
          // paths) flips this the instant a write actually fails — mirror it
          // into the sd_card_ok diagnostic immediately rather than waiting
          // for something else to notice, so "SD Card Mounted" stops lying
          // the moment the card is actually gone.
          {
              bool sd_is_ready = p4_sd_is_ready();
              if (sd_was_ready && !sd_is_ready) {
                  id(sd_card_ok) = false;
                  ESP_LOGE("ctl", "SD card failure detected during runtime — logging/backup now unavailable");
              }
          }

  # ── Phase 4: 1s LVGL display updates ─────────────────────────────────────
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            char buf[24];
            p4_fmt_time(buf, sizeof(buf));
            std::string s(buf);
            return s.size() > 8 ? s.substr(s.size()-8) : s;
      - lvgl.label.update:
          id: lbl_power_info
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "Heap: %.0f KB", p4_free_heap_kb());
            return std::string(buf);
      - lvgl.label.update:
          # Previously a dead "0 min" label — never updated by anything.
          # Now shows the live compressor lockout countdown, mirroring
          # comp_lockout_remaining_sec on the web dashboard.
          id: lbl_lockout_timer_display
          text: !lambda |-
            float remaining_s = id(comp_lockout_remaining_sec).state;
            if (isnan(remaining_s) || remaining_s <= 0.0f) return std::string("Ready");
            int total_s = (int) remaining_s;
            char buf[16];
            snprintf(buf, sizeof(buf), "%dm %02ds", total_s / 60, total_s % 60);
            return std::string(buf);
      - lvgl.widget.update:
          id: lbl_home_alarm_banner
          hidden: !lambda |-
            return !(id(ctl_alarm_high_active) || id(ctl_alarm_low_active) ||
                     id(ctl_door_alarm_active) || id(ctl_no_cool_alarm_active) ||
                     id(ctl_ice_alarm_active));
      - lvgl.label.update:
          id: lbl_home_alarm_banner
          text: !lambda |-
            std::string s;
            if (id(ctl_alarm_high_active))    s += "HIGH TEMPERATURE   ";
            if (id(ctl_alarm_low_active))     s += "LOW TEMPERATURE   ";
            if (id(ctl_door_alarm_active))    s += "DOOR OPEN   ";
            if (id(ctl_no_cool_alarm_active)) s += "NO COOLING   ";
            if (id(ctl_ice_alarm_active))     s += "ICE DETECTED   ";
            return s;
      - lambda: |-
          // Background motion disabled to prevent intermittent redraw artifacts.
          id(fx_anim_tick) = 0U;
      - lvgl.widget.update:
          id: bg_fx_defrost_border
          hidden: true
          border_width: 0
          border_opa: 0
      - lvgl.widget.update:
          id: bg_fx_snow_1
          hidden: true
      - lvgl.widget.update:
          id: bg_fx_snow_2
          hidden: true
      - lvgl.widget.update:
          id: bg_fx_snow_3
          hidden: true
      - lvgl.widget.update:
          id: bg_fx_snow_4
          hidden: true
      - lvgl.widget.update:
          id: bg_fx_snow_5
          hidden: true
      - lvgl.widget.update:
          id: bg_fx_snow_6
          hidden: true
      # Phase 10: Update info page diagnostics
      - lvgl.label.update:
          id: lbl_info_heap
          text: !lambda |-
            char buf[64];
            p4_fmt_heap_mb(buf, sizeof(buf));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_info_psram
          text: !lambda |-
            char buf[64];
            p4_fmt_psram_mb(buf, sizeof(buf));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_info_uptime
          text: !lambda |-
            uint32_t uptime_s = millis() / 1000;
            uint32_t days = uptime_s / 86400;
            uint32_t hours = (uptime_s % 86400) / 3600;
            uint32_t mins = (uptime_s % 3600) / 60;
            char buf[48];
            snprintf(buf, sizeof(buf), "Uptime: %lu d %02lu h %02lu m", days, hours, mins);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_info_signal
          text: !lambda |-
            char buf[48];
            int rssi = id(wifi_rssi).state;
            snprintf(buf, sizeof(buf), "Signal: %d dBm", rssi);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_info_ssid
          text: !lambda |-
            std::string ssid = id(wifi_ssid_text).state;
            return "SSID: " + ssid;
      - lvgl.label.update:
          id: lbl_info_ip
          text: !lambda |-
            std::string ip = id(ip_address).state;
            return "IP: " + ip;
      - lvgl.label.update:
          id: lbl_info_rs485
          text: !lambda |-
            char buf[64];
            bool relay_ok = id(hw_rs485_relay_ok);
            bool rtd_ok = id(hw_rs485_rtd1_ok);
            bool rtc_ok = id(hw_rtc_ok);
            snprintf(buf, sizeof(buf), "Relay:%s RTD:%s RTC:%s",
              relay_ok ? "✓" : "✗", rtd_ok ? "✓" : "✗", rtc_ok ? "✓" : "✗");
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_info_probes
          text: !lambda |-
            char buf[80];
            bool rtd_ok = id(hw_rs485_rtd1_ok);
            bool sht31_ok = !isnan(id(sht31_internal_temp_raw).state);
            bool sht20_ok = !isnan(id(sht20_external_temp_raw).state);
            snprintf(buf, sizeof(buf), "RTD:%s SHT31:%s SHT20:%s Fault:%s",
              rtd_ok ? "✓" : "✗", sht31_ok ? "✓" : "✗", sht20_ok ? "✓" : "✗",
              id(ctl_probe_fault) ? "YES" : "no");
            return std::string(buf);
      - lvgl.led.update:
          id: led_rs485
          brightness: !lambda 'return (id(hw_rs485_relay_ok) && id(hw_rs485_rtd1_ok)) ? 100.0f : 0.0f;'
      - lvgl.led.update:
          id: led_rtc
          brightness: !lambda 'return id(hw_rtc_ok) ? 100.0f : 0.0f;'

  # ── Phase 5: SD card auto-remount ────────────────────────────────────────
  # Retries the mount every 60s while the card is marked unavailable —
  # whether that's "never detected at boot" or "failed mid-session" (see
  # p4_sd_mark_failed()/p4_sd_mount() in p4_logging.h for the stale-VFS
  # cleanup that makes a retry actually work rather than failing again with
  # "already mounted"). Deliberately does not replay backup.json on
  # recovery — that would risk overwriting live settings changed since the
  # last backup with stale data; recovery only resumes logging/backup going
  # forward. A card that's still missing/dead just fails silently again
  # every 60s (already covered by the one-time ntfy_sd_failure_request from
  # the main tick) until it's actually reinserted.
  - interval: 60s
    then:
      - lambda: |-
          if (!id(sd_card_ok) && p4_sd_mount()) {
              id(sd_card_ok) = true;
              ESP_LOGI("ctl", "SD card auto-remounted successfully");
              p4_sd_log_event("SD_REMOUNTED", "auto");
              if (id(ctl_wifi_connected)) {
                  id(ntfy_sd_recovered_request).trigger();
              }
              id(ntfy_sd_failure_sent) = false;
          }

##############################################################################
# Globals
##############################################################################

globals:
  # ── Control parameters (NVS-persistent) ───────────────────────────────────
  - id: ctl_setpoint
    type: float
    restore_value: yes
    initial_value: ${default_setpoint_c}

  - id: ctl_comp_diff
    type: float
    restore_value: yes
    initial_value: ${default_comp_diff_c}

  - id: ctl_alarm_high_delta
    type: float
    restore_value: yes
    initial_value: ${default_alarm_high_c}

  - id: ctl_alarm_low_delta
    type: float
    restore_value: yes
    initial_value: ${default_alarm_low_c}

  # Manual per-probe calibration offset (°C), added to the published reading
  # after unit conversion. Range ±10°C, default 0 — for fine-tuning against
  # a reference thermometer, not an automated calibration routine.
  - id: ctl_probe1_offset_c
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: ctl_probe2_offset_c
    type: float
    restore_value: yes
    initial_value: "0.0"

  # ── Runtime state ─────────────────────────────────────────────────────────
  - id: ctl_boot_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # True once the room has first reached the alarm-safe band around setpoint
  # since boot — ends the extended startup grace early once pulldown
  # genuinely completes, ahead of the startup_grace_max_min hard ceiling.
  - id: ctl_startup_pulldown_done
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_wifi_connected
    type: bool
    restore_value: no
    initial_value: "false"

  # ── RS485 health flags ─────────────────────────────────────────────────────
  - id: hw_rs485_relay_ok
    type: bool
    restore_value: no
    initial_value: "false"

  - id: hw_rs485_rtd1_ok
    type: bool
    restore_value: no
    initial_value: "false"

  # ── RTC health flag ────────────────────────────────────────────────────────
  - id: hw_rtc_ok
    type: bool
    restore_value: no
    initial_value: "false"

  # ── RTD sample timestamps (millis() at last valid reading) ─────────────────
  - id: rtd1_ch1_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rtd1_ch2_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # ── Probe enable flags (NVS-persistent) ───────────────────────────────────
  - id: input_probe2_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_humidity_internal_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_humidity_external_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  # ── Settings-screen PIN lock (same design as the earlier S3 project) ──────
  # djb2("0000") = 2088252485 — plaintext PIN is never stored, only the hash.
  - id: ctl_pin_hash
    type: uint32_t
    restore_value: yes
    initial_value: "2088252485"

  # Digits currently being typed on the LVGL keypad; cleared after every
  # check/save so the plaintext PIN never lingers longer than one keypress.
  - id: ctl_pin_buf
    type: std::string
    restore_value: no
    initial_value: '""'

  # New WiFi SSID, staged here by input_wifi_new_ssid's set_action until the
  # matching password arrives via input_wifi_new_password (two separate POSTs
  # from the dashboard, awaited sequentially) — see that entity's set_action
  # for where this is consumed and cleared.
  - id: ctl_wifi_new_ssid
    type: std::string
    restore_value: no
    initial_value: '""'

  # True while the settings screens are unlocked for this on-device session.
  # Reset to false whenever the Home tab is pressed (see switch_to_page_home).
  - id: ctl_settings_unlocked
    type: bool
    restore_value: no
    initial_value: "false"

  # Explicit result flag for the Save button on page_set_pin — avoids
  # inferring success/failure from ctl_pin_buf being empty, which is
  # ambiguous (a 0-digit Save press also leaves the buffer empty).
  - id: ctl_pin_save_ok
    type: bool
    restore_value: no
    initial_value: "false"
  # ── Phase 3: Control state ────────────────────────────────────────
  - id: ctl_probe_fault
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_alarm_high_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_alarm_low_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: fx_anim_tick
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_defrost_on_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_defrost_last_end_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # ── Phase 5: SD card state ─────────────────────────────────────────────
  - id: sd_card_ok
    type: bool
    restore_value: no
    initial_value: "false"

  # Alarm state tracking for ntfy edge detection (avoid repeat notifications)
  - id: ntfy_alarm_hi_sent
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_alarm_lo_sent
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_probe_fault_sent
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_sd_failure_sent
    type: bool
    restore_value: no
    initial_value: "false"

  # Door/no-cool/ice previously had event-log coverage only (step 7b) — no
  # phone push. Added so every alarm type reaches ntfy, matching high/low/
  # probe-fault.
  - id: ntfy_door_alarm_sent
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_no_cool_alarm_sent
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ntfy_ice_alarm_sent
    type: bool
    restore_value: no
    initial_value: "false"

  # ── Event-log edge tracking (SD-card side, independent of WiFi/ntfy) ────
  # These mirror the ntfy_*_sent flags above but drive the always-on SD
  # event log rather than the WiFi-gated ntfy push — a control decision
  # should be logged for troubleshooting regardless of whether the device
  # happens to be online at that exact moment. Previously ALARM_HI/LO/
  # PROBE_FAULT logging lived inside the WiFi-gated block and simply never
  # wrote to SD at all while offline; door/no-cool/ice alarms had no event
  # logging whatsoever.
  - id: ctl_alarm_hi_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_alarm_lo_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_probe_fault_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_door_alarm_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_no_cool_alarm_logged
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_ice_alarm_logged
    type: bool
    restore_value: no
    initial_value: "false"

  # Log tick counter (incremented every 10s, log when reaches interval)
  - id: log_tick_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # ── Phase 6: Extended control state ────────────────────────────────────────
  # Configurable parameters (NVS-persistent)
  - id: ctl_comp_lockout_min
    type: float
    restore_value: yes
    initial_value: ${default_comp_lockout_min}

  - id: ctl_startup_grace_min
    type: float
    restore_value: yes
    initial_value: ${default_startup_grace_min}

  - id: ctl_defrost_grace_min
    type: float
    restore_value: yes
    initial_value: ${default_defrost_grace_min}

  - id: ctl_defrost_interval_min
    type: float
    restore_value: yes
    initial_value: ${default_defrost_interval_min}

  - id: ctl_defrost_duration_min
    type: float
    restore_value: yes
    initial_value: ${default_defrost_duration_min}

  - id: ctl_defrost_drip_min
    type: float
    restore_value: yes
    initial_value: ${default_defrost_drip_min}

  - id: ctl_defrost_end_c
    type: float
    restore_value: yes
    initial_value: ${default_defrost_end_c}

  - id: ctl_alarm_persist_min
    type: float
    restore_value: yes
    initial_value: ${default_alarm_persist_min}

  - id: ctl_alarm_hysteresis_c
    type: float
    restore_value: yes
    initial_value: ${default_alarm_hysteresis_c}

  - id: ctl_door_alarm_delay_s
    type: float
    restore_value: yes
    initial_value: ${default_door_alarm_delay_s}

  - id: ctl_no_cool_alarm_min
    type: float
    restore_value: yes
    initial_value: ${default_no_cool_alarm_min}

  - id: ctl_ice_delta_c
    type: float
    restore_value: yes
    initial_value: ${default_ice_delta_c}

  - id: ctl_fallback_on_min
    type: float
    restore_value: yes
    initial_value: ${default_fallback_on_min}

  - id: ctl_fallback_off_min
    type: float
    restore_value: yes
    initial_value: ${default_fallback_off_min}

  - id: ctl_smart_delta_c
    type: float
    restore_value: yes
    initial_value: ${default_smart_delta_c}

  - id: ctl_smart_dwell_min
    type: float
    restore_value: yes
    initial_value: ${default_smart_dwell_min}

  # Runtime timestamps and state flags (non-persistent)
  - id: ctl_comp_last_off_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_comp_on_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_high_alarm_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_low_alarm_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_door_open_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_no_cool_alarm_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_ice_alarm_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_door_alarm_active
    type: bool
    restore_value: no
    initial_value: "false"

  # ── Door sensor mode (NC=true, NO=false) ───────────────────────────────────
  - id: ctl_door_sensor_mode_is_nc
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: ctl_defrost_dripping
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_drip_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: ctl_manual_defrost_req
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_defrost_delta_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # ── Dew-point-triggered early defrost ───────────────────────────────────
  # Last calculated dew point (°C) from the internal SHT31 temp+humidity.
  - id: ctl_last_dew_point_c
    type: float
    restore_value: no
    initial_value: "0.0"

  # True once the dew-point trigger has fired for the current frost cycle —
  # cleared when defrost ends, so it can fire again next cycle.
  - id: ctl_dew_point_defrost_triggered
    type: bool
    restore_value: no
    initial_value: "false"

  - id: input_dew_point_trigger_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: ctl_sensor_fallback_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_fallback_phase_on
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_fallback_last_toggle_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: input_door_sensor_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  # Gates door_reed_sensor's light-on-open/light-off-close behavior,
  # independent of input_door_sensor_enabled (which gates the door-open
  # *alarm*, not the light). Defaults on to preserve this project's
  # previous unconditional light behavior.
  - id: input_door_light_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_siren_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_defrost_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_fallback_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_defrost_term_temp_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_defrost_drip_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: input_smart_defrost_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  # ── Phase 9: LVGL page navigation state ────────────────────────────────────
  - id: page_home_active
    type: bool
    restore_value: no
    initial_value: "true"

  - id: page_settings_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: page_info_active
    type: bool
    restore_value: no
    initial_value: "false"

##############################################################################
# Phase 4: LDO — MIPI-DSI D-PHY power rail
# Channel 3 at 2.5V is the standard ESP32-P4 MIPI-DSI configuration.
# Confirmed: ESP_LDO_VO3 net present in board schematic.
##############################################################################

esp_ldo:
  - id: ldo_mipi_dphy
    channel: 3
    voltage: 2.5V

##############################################################################
# Phase 4: MIPI-DSI Display — 7" 1024×600 JD9365, 2-lane DSI
# Model matches exactly. Reset pin GPIO33 confirmed from schematic.
##############################################################################

display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    update_interval: never
    auto_clear_enabled: false
    on_page_change:
      - lambda: 'ESP_LOGD("lvgl", "display page changed");'

##############################################################################
# Phase 4: GT911 Capacitive Touchscreen
# Shares i2c_bus (GPIO 7/8). INT GPIO23, RST GPIO33 from schematic.
##############################################################################

touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: i2c_bus
    address: 0x5D
    interrupt_pin:
      number: ${touch_int_pin}
      mode:
        input: true
    # reset_pin omitted: GPIO33 is owned by the mipi_dsi model (shared LCD+touch reset line)

##############################################################################
# Phase 4: Backlight output
##############################################################################

output:
  - platform: ledc
    id: backlight_pwm
    pin: ${display_bl_pin}
    # Waveshare ESP-IDF BSP uses LEDC output_invert=1 for BL_CTRL.
    inverted: true
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 20

##############################################################################
# Phase 4: Fonts for LVGL
##############################################################################

font:
  - file: "gfonts://Roboto"
    id: font_huge
    size: 64
    glyphs: "0123456789.-+NA "
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.-: /%"
  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.-: /%+"
  - file: "gfonts://Roboto"
    id: font_small
    size: 15
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.-: /%+"
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 28
    glyphs: "\U000F0717\U000F0238\U000F0335\U000F009A"
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi_large
    size: 75
    glyphs: "\U000F0717\U000F0238\U000F0335\U000F009A"

##############################################################################
# Phase 4: LVGL Coolroom Dashboard
##############################################################################

color:
  - id: col_bg         # Dark background
    hex: "1C1C1E"
  - id: col_panel      # Card surface
    hex: "2C2C2E"
  - id: col_green      # Compressor ON / good status
    hex: "30D158"
  - id: col_blue       # Defrost / Coolroom temp arc (snowflake blue)
    hex: "0A84FF"
  - id: col_cyan       # Setpoint arc
    hex: "00BCD4"
  - id: col_pink       # Ambient temp arc
    hex: "FF1493"
  - id: col_grey       # Status icons (inactive)
    hex: "888888"
  - id: col_red        # Alarm
    hex: "FF453A"
  - id: col_orange     # Probe fault / warning
    hex: "FF9F0A"
  - id: col_text       # Primary text
    hex: "FFFFFF"
  - id: col_subtext    # Secondary text
    hex: "8E8E93"

lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_panel
  color_depth: 16
  bg_color: col_bg
  text_color: col_text
  log_level: WARN
  default_font: font_small
  full_refresh: true
  update_when_display_idle: true

  bottom_layer:
    bg_opa: TRANSP
    widgets:
      - obj:
          id: bg_fx_defrost_border
          x: 0
          y: 0
          width: 1024
          height: 600
          bg_opa: TRANSP
          border_side:
            - TOP
            - BOTTOM
            - LEFT
            - RIGHT
          border_width: 0
          border_opa: 0%
          border_color: col_orange
          radius: 0
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_1
          x: 120
          y: 80
          text: "❄"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_2
          x: 250
          y: 120
          text: "❄"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_3
          x: 390
          y: 100
          text: "❄"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_4
          x: 530
          y: 90
          text: "❄"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_5
          x: 690
          y: 110
          text: "❄"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

      - label:
          id: bg_fx_snow_6
          x: 840
          y: 130
          text: "❄"
          text_font: font_small
          text_color: col_blue
          text_opa: 45%
          clickable: false
          hidden: true

  pages:
    # Home page - Horseshoe Arc Design
    - id: page_home
      bg_color: col_bg
      width: 1024
      height: 600
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        # Header bar with clock and WiFi
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 48
            bg_color: col_panel
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  x: 16
                  y: 14
                  text: "Coolroom"
                  text_font: font_medium
                  text_color: col_text
              - label:
                  id: lbl_clock
                  x: 900
                  y: 14
                  text: "--:--"
                  text_font: font_small
                  text_color: col_subtext
              - label:
                  x: 950
                  y: 14
                  text: "📶"
                  text_font: font_small
                  text_color: col_subtext

        # Left Sidebar - Control Buttons (vertical stack)
        # Icon font doubled (50->100), then reduced 25% (100->75) per
        # operator feedback; buttons resized/repositioned to match,
        # evenly distributed across the full content height (below the
        # 48px header, above the 552px tab bar -- 504px of usable height)
        # with equal ~41px gaps above, between, and below all 4.
        # Compressor button
        - button:
            x: 6
            y: 89
            width: 75
            height: 75
            bg_opa: TRANSP
            radius: 38
            border_width: 0
            widgets:
              - led:
                  id: led_compressor
                  x: -20
                  y: -20
                  width: 8
                  height: 8
                  color: col_green
                  brightness: 0%
              - label:
                  id: ui_compressor_icon
                  align: CENTER
                  y: 0
                  text: "\U000F0717"
