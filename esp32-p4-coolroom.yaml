  - id: hw_rs485_relay_ok
    type: bool
    restore_value: no
    initial_value: "false"

  - id: hw_rs485_rtd1_ok
    type: bool
    restore_value: no
    initial_value: "false"

  # ── RTD sample timestamps (millis() at last valid reading) ─────────────────
  - id: rtd1_ch1_last_ms
