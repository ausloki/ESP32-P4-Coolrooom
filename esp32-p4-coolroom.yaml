  - id: ctl_comp_last_off_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # ── Relay hardware enables (Settings → Hardware) ────────────────────────
  # Independent of the *function* switches (Defrost System Enabled, Alarm
  # Siren Enabled, …): those decide whether a feature runs, these decide
  # whether its output is allowed to energise at all. The case that needs
  # them is an installation whose alarm relay drives an external siren the
  # site doesn't always want sounding — the alarm still raises, notifies and
  # logs, but the relay stays open. Also the safe way to isolate an output
  # for maintenance without disabling the logic behind it.
  - id: ctl_relay_compressor_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: ctl_relay_fan_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: ctl_relay_light_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: ctl_relay_siren_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

