    lambda: 'return id(ctl_alarm_high_active) || id(ctl_alarm_low_active);'
    on_state:
      - lvgl.label.update:
          id: ui_alarm_icon
          text_color: !lambda 'return x ? id(col_red) : id(col_grey);'

  # ── Phase 6: Extended alarm/status indicators ─────────────────────────────
  - platform: template
    id: door_alarm_active
    name: "Door Open Alarm"
    device_class: door
    web_server:
      sorting_group_id: group_door
      sorting_weight: 1
    lambda: 'return id(ctl_door_alarm_active);'

  - platform: template
    id: no_cool_alarm_sensor
    name: "No-Cool Alarm"
    device_class: problem
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 5
    lambda: 'return id(ctl_no_cool_alarm_active);'

  - platform: template
    id: ice_alarm_sensor
    name: "Ice Detect Alarm"
    device_class: problem
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 6
    lambda: 'return id(ctl_ice_alarm_active);'

  - platform: template
    id: sensor_fallback_sensor
    name: "Sensor Fallback Active"
    device_class: running
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 37
    lambda: 'return id(ctl_sensor_fallback_active);'

  # ── GPIO 20: Door Reed Sensor (normally closed, opens when door opened) ────
  - platform: gpio
    id: door_reed_sensor
    name: "Door Reed Sensor"
    pin:
      number: 20
      mode: INPUT_PULLUP
    device_class: door
    web_server:
      sorting_group_id: group_door
      sorting_weight: 2
    on_state:
      - lambda: |-
          // If mode is NC (true): x=false→closed, x=true→open
          // If mode is NO (false): x=false→open, x=true→closed
          bool door_is_open = id(ctl_door_sensor_mode_is_nc) ? x : !x;

          // Door-triggered light: independent of the alarm-enable switch
          // below — a site may want the light without the alarm feature.
          if (id(input_door_light_enabled)) {
            if (door_is_open) id(relay_light).turn_on();
            else               id(relay_light).turn_off();
          }

          // Door-open alarm timer: gated on Door Sensor Enabled. Previously
          // this ran unconditionally regardless of that switch's state —
          // fixed here so "disabled" genuinely means no alarm tracking.
          if (!id(input_door_sensor_enabled)) return;

          if (door_is_open) {
            if (id(ctl_door_open_since_ms) == 0)
              id(ctl_door_open_since_ms) = millis();
            ESP_LOGI("door", "Door OPEN — alarm pending (delay %gs)", id(ctl_door_alarm_delay_s));
          } else {
            id(ctl_door_open_since_ms) = 0;
            id(ctl_door_alarm_active) = false;
            ESP_LOGI("door", "Door closed — alarm cleared");
          }

  - platform: template
    id: defrost_drip_sensor
    name: "Defrost Drip Phase"
    device_class: running
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 3
    lambda: 'return id(ctl_defrost_dripping);'

  # ── Defrost control logic mode indicator (for LVGL icon color) ─────────────
  - platform: template
