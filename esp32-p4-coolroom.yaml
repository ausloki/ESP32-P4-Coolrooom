  - platform: template
    id: btn_calibration_start
    name: "Calibrate Probes Now"
    icon: "mdi:target"
    entity_category: config
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 30
    on_press:
      - lambda: |-
          // Needs SHT31 reference + at least one RTD online. Bench without
          // RS485 will refuse until the Modbus boards are connected.
          if (id(ctl_calibration_state) != 0) {
            ESP_LOGW("calibration", "Already in progress (state %d)", id(ctl_calibration_state));
            return;
          }
          float sht = id(sht31_internal_temp_raw).state;
          float rtd1 = id(probe1_temp).state;
          float rtd2 = id(probe2_temp).state;
          int sources = 0;
          if (!isnan(sht)) sources++;
          if (p4_rtd_valid(rtd1)) sources++;
          if (id(input_probe2_enabled) && p4_rtd_valid(rtd2)) sources++;
          if (isnan(sht) || sources < 2) {
            ESP_LOGW("calibration", "Need SHT31 + ≥1 RTD online (have %d usable sources)", sources);
            return;
          }
          id(ctl_calibration_state) = 2;  // collecting (skip wait — immediate)
          id(ctl_calibration_start_ms) = millis();
          id(ctl_calibration_sample_count) = 0;
          id(ctl_calibration_probe1_sum) = 0.0f;
          id(ctl_calibration_probe2_sum) = 0.0f;
          id(ctl_calibration_probe1_count) = 0;
          id(ctl_calibration_probe2_count) = 0;
          ESP_LOGI("calibration", "Started — sampling against SHT31 reference");

