    on_state:
      - lvgl.label.update:
          id: ui_defrost_icon
          text_color: !lambda 'return x ? id(col_orange) : id(col_grey);'

  # ── Phase 9: LVGL page navigation states ───────────────────────────────────
  - platform: template
