##############################################################################
# Sensors — all temperature probes are RS485 RTD
##############################################################################

sensor:
  # ── System diagnostics ────────────────────────────────────────────────────
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_rssi
    update_interval: 60s
    web_server:
      sorting_group_id: group_network
      sorting_weight: 1

  - platform: internal_temperature
    name: "Chip Temperature"
    id: chip_temp
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 10

  - platform: template
    name: "Free Heap (KB)"
    id: free_heap_kb
    lambda: 'return p4_free_heap_kb();'
    unit_of_measurement: "KB"
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 11

  - platform: template
    name: "Free PSRAM (KB)"
    id: free_psram_kb
    lambda: 'return p4_free_psram_kb();'
    unit_of_measurement: "KB"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 12

  - platform: uptime
    name: "System Uptime"
    id: system_uptime
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 2

  # ── RTD board 1 raw (internal — timestamps updated in filter lambda) ───────
  - platform: modbus_controller
    modbus_controller_id: rtd_board_1
    id: rtd1_ch1_raw
    internal: true
    register_type: holding
    address: ${rtd_temp_reg_ch1}
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (!isnan(x)) id(rtd1_ch1_last_ms) = millis();
          return x * ${rtd_temp_scale};

  - platform: modbus_controller
    modbus_controller_id: rtd_board_1
    id: rtd1_ch2_raw
    internal: true
    register_type: holding
    address: ${rtd_temp_reg_ch2}
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (!isnan(x)) id(rtd1_ch2_last_ms) = millis();
          return x * ${rtd_temp_scale};

  # ── Published probe sensors ────────────────────────────────────────────────
  - platform: template
    id: probe1_temp
    name: "Coolroom Temperature (Primary Control)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 2s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 1
    lambda: 'return p4_rtd_or_nan(id(rtd1_ch1_raw).state);'
    filters:
      # Manual calibration offset — fine-tunes this probe against a
      # reference thermometer. Applied after conversion, before every
      # downstream consumer (control, alarms, logs, display) sees it.
      - lambda: 'return isnan(x) ? x : x + id(ctl_probe1_offset_c);'
    on_value:
      - lvgl.label.update:
          id: lbl_coolroom_temp_large
          text: !lambda 'return p4_fmt_temp(x, false);'
      - lvgl.arc.update:
          id: home_temp_arc
          value: !lambda |-
            if (!p4_rtd_valid(x)) return 0;
            return (int)((x + 20.0f) / 35.0f * 100.0f);
      - if:
          condition:
            lambda: 'return p4_rtd_valid(x) && x > id(ctl_setpoint) + id(ctl_alarm_high_delta);'
          then:
            - lvgl.label.update:
                id: lbl_coolroom_temp_large
                text_color: col_red
          else:
            - if:
                condition:
                  lambda: 'return p4_rtd_valid(x) && x < id(ctl_setpoint) - id(ctl_alarm_low_delta);'
                then:
                  - lvgl.label.update:
                      id: lbl_coolroom_temp_large
                      text_color: col_blue
                else:
                  - lvgl.label.update:
                      id: lbl_coolroom_temp_large
                      text_color: col_green

  - platform: template
    id: probe2_temp
    name: "Evaporator Temperature (Secondary Control)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 2s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 2
    lambda: |-
      if (!id(input_probe2_enabled)) return NAN;
      return p4_rtd_or_nan(id(rtd1_ch2_raw).state);
    filters:
      - lambda: 'return isnan(x) ? x : x + id(ctl_probe2_offset_c);'
    on_value:
      - lvgl.label.update:
          id: lbl_evap_temp_large
          text: !lambda 'return p4_fmt_temp(x, false);'

  # ── Humidity/temp sensors — I2C, on the shared bus (see i2c: block above) ──
  # probe_external_temp (SHT20) is now also the "Ambient" reading — it drives
  # home_ambient_arc directly below. The dedicated ambient RTD board (probe3,
  # RTD board 2 @ 101) was decommissioned: SHT20 covers the same external-
  # reference role and adds humidity, which RTD never could.
  # SHT31 (internal, inside the coolroom): fixed address 0x44 on most breakouts
  # (ADDR pin low); some ship with ADDR pulled high = 0x45 instead — check the
  # physical board/datasheet before flashing. Raw readings are internal; the
  # public probe*_humidity/probe*_temp sensors below gate on their enable flag
  # the same way probe2_temp already does.
  # Bench-safe placeholders keep IDs stable when optional external I2C sensors
  # are absent. Downstream template/UI logic already treats NaN as unavailable.
  - platform: template
    id: sht31_internal_temp_raw
    internal: true
    update_interval: 30s
    lambda: 'return NAN;'

  - platform: template
    id: sht31_internal_humidity_raw
    internal: true
    update_interval: 30s
    lambda: 'return NAN;'

  # SHT20 (external, ambient/outside reference): HTU21D-compatible, fixed
  # address 0x40 (not configurable — SHT20/SHT21/SHT25/HTU21D all use 0x40).
  - platform: template
    id: sht20_external_temp_raw
    internal: true
    update_interval: 30s
    lambda: 'return NAN;'

  - platform: template
    id: sht20_external_humidity_raw
    internal: true
    update_interval: 30s
    lambda: 'return NAN;'

  - platform: template
    id: probe_internal_temp
    name: "Internal Temperature (SHT31)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 4
    lambda: |-
      if (!id(input_humidity_internal_enabled)) return NAN;
      return id(sht31_internal_temp_raw).state;
    on_value:
      # Composes both lines from current sensor state on every update (not
      # just this sensor's own value) — humidity updates independently on its
      # own interval and would otherwise clobber this line, and vice versa.
      - lvgl.label.update:
          id: lbl_int_humidity_large
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "Int %.1f°C\n%.0f%%RH", x, id(probe_internal_humidity).state);
            return std::string(buf);

  - platform: template
    id: probe_internal_humidity
    name: "Internal Humidity (SHT31)"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: humidity
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 5
    lambda: |-
      if (!id(input_humidity_internal_enabled)) return NAN;
      return id(sht31_internal_humidity_raw).state;
    on_value:
      - lvgl.label.update:
          id: lbl_int_humidity_large
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "Int %.1f°C\n%.0f%%RH", id(probe_internal_temp).state, x);
            return std::string(buf);

  - platform: template
    id: probe_external_temp
    name: "External Temperature (SHT20)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 6
    lambda: |-
      if (!id(input_humidity_external_enabled)) return NAN;
      return id(sht20_external_temp_raw).state;
    on_value:
      - lvgl.label.update:
          id: lbl_ext_humidity_large
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "Ext %.1f°C\n%.0f%%RH", x, id(probe_external_humidity).state);
            return std::string(buf);
      - lvgl.arc.update:
          id: home_ambient_arc
          value: !lambda |-
            if (isnan(x)) return 0;
            return (int)((x + 20.0f) / 35.0f * 100.0f);

  - platform: template
    id: probe_external_humidity
    name: "External Humidity (SHT20)"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: humidity
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 7
    lambda: |-
      if (!id(input_humidity_external_enabled)) return NAN;
      return id(sht20_external_humidity_raw).state;
    on_value:
      - lvgl.label.update:
          id: lbl_ext_humidity_large
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "Ext %.1f°C\n%.0f%%RH", id(probe_external_temp).state, x);
            return std::string(buf);

  # ── Probe staleness diagnostics ────────────────────────────────────────────
  - platform: template
    name: "RTD1 CH1 Sample Age (s)"
    id: rtd1_ch1_age_s
    unit_of_measurement: "s"
    update_interval: 5s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 20
    lambda: 'return p4_sample_age_s(id(rtd1_ch1_last_ms));'

  - platform: template
    name: "RTD1 CH2 Sample Age (s)"
    id: rtd1_ch2_age_s
    unit_of_measurement: "s"
    update_interval: 5s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 21
    lambda: 'return p4_sample_age_s(id(rtd1_ch2_last_ms));'


  # ── Phase 5: SD card free space ───────────────────────────────────────────
  - platform: template
    name: "SD Card Free (MB)"
    id: sd_free_mb
    unit_of_measurement: "MB"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 25
    lambda: 'return p4_sd_free_mb();'

  # ── Live countdown timers (seconds remaining; 0 = not currently counting
  # down) — computed directly from the same globals the control tick already
  # maintains, no new state needed. Previously only the *configured durations*
  # were visible (comp_lockout_min etc.); these are the first live progress
  # readouts for any of them.
  - platform: template
    name: "Compressor Lockout Remaining (s)"
    id: comp_lockout_remaining_sec
    unit_of_measurement: "s"
    update_interval: 1s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_compressor
      sorting_weight: 50
    lambda: |-
      if (id(ctl_comp_last_off_ms) == 0) return 0.0f;
      uint32_t lockout_ms = (uint32_t)(id(ctl_comp_lockout_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_comp_last_off_ms);
      if (elapsed >= lockout_ms) return 0.0f;
      return (lockout_ms - elapsed) / 1000.0f;

  - platform: template
    name: "Next Defrost In (s)"
    id: defrost_countdown_sec
    unit_of_measurement: "s"
    update_interval: 1s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 50
    lambda: |-
      if (id(relay_defrost).state || id(ctl_defrost_dripping)) return 0.0f;
      if (id(ctl_defrost_last_end_ms) == 0) return 0.0f;
      uint32_t interval_ms = (uint32_t)(id(ctl_defrost_interval_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_defrost_last_end_ms);
      if (elapsed >= interval_ms) return 0.0f;
      return (interval_ms - elapsed) / 1000.0f;

  - platform: template
    name: "Defrost Duration Remaining (s)"
    id: defrost_duration_remaining_sec
    unit_of_measurement: "s"
    update_interval: 1s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 51
    lambda: |-
      if (!id(relay_defrost).state) return 0.0f;
      uint32_t duration_ms = (uint32_t)(id(ctl_defrost_duration_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_defrost_on_since_ms);
      if (elapsed >= duration_ms) return 0.0f;
      return (duration_ms - elapsed) / 1000.0f;

  - platform: template
    name: "Defrost Drip Remaining (s)"
    id: defrost_drip_remaining_sec
    unit_of_measurement: "s"
    update_interval: 1s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 52
    lambda: |-
      if (!id(ctl_defrost_dripping)) return 0.0f;
      uint32_t drip_ms = (uint32_t)(id(ctl_defrost_drip_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_drip_start_ms);
      if (elapsed >= drip_ms) return 0.0f;
      return (drip_ms - elapsed) / 1000.0f;

