            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              # Outer decorative arc (light grey reference ring)
              #
              # Gauge geometry, tuned live against real hardware on
              # 2026-07-30 across several operator feedback passes:
              #   - Orientation: start_angle/end_angle 150/30 (not
              #     330/210 as an earlier pass mislabeled -- LVGL angles
              #     run clockwise from 0=3 o'clock, so 330/210 actually
              #     centers the gap at the TOP, not the bottom; 150/30
              #     centers it at 6 o'clock as intended. See
              #     reference/DISPLAY_ARCHITECTURE_VISUAL.md for the full
              #     writeup).
              #   - Diameter: three shrink passes (~3.5mm, ~2mm, ~2mm)
              #     brought all four rings down from their initial size,
              #     then blue+cyan grew back +1mm each on request --
              #     final values below aren't on a single clean formula,
              #     they're the result of live iteration, not a
              #     recomputed scheme.
              #   - Spacing: each ring should have daylight between it and
              #     its neighbor (no more touching/zero-gap bands, which
              #     read as "too big" on-device) -- verify this holds
              #     before changing any single ring in isolation.
              - arc:
                  align: CENTER
                  y: 0
                  width: 377
                  height: 377
                  bg_opa: TRANSP
                  arc_color: col_subtext
                  arc_opa: 20%
                  arc_width: 12
                  rotation: 0
                  start_angle: 150
                  end_angle: 30
                  value: 50
                  indicator:
                    arc_opa: TRANSP
                  knob:
                    bg_opa: TRANSP

