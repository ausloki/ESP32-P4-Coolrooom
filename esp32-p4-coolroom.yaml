      sorting_weight: 3
    lambda: 'return id(ctl_alarm_high_active);'
    on_state:
      - lvgl.led.update:
          id: led_alarm_hi
          brightness: !lambda 'return x ? 100.0f : 0.0f;'

  - platform: template
    id: alarm_low_active
    name: "Low Temperature Alarm"
    device_class: problem
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 4
    lambda: 'return id(ctl_alarm_low_active);'
    on_state:
      - lvgl.led.update:
          id: led_alarm_lo
          brightness: !lambda 'return x ? 100.0f : 0.0f;'

  - platform: template
    id: probe_fault_active
    name: "Probe Fault - Stale or Invalid"
    device_class: problem
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 35
    lambda: 'return id(ctl_probe_fault);'
    on_state:
      - lvgl.led.update:
          id: led_probe_fault
          brightness: !lambda 'return x ? 100.0f : 0.0f;'
      # Centre status string is owned by the 1s home-screen tick (relay offline /
      # probe fault / cooling / idle) so this path only drives the LED.

  # ── Phase 5: SD card health ──────────────────────────────────────────────
  - platform: template
    id: sd_card_online
    name: "SD Card Mounted"
    device_class: connectivity
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 36
    lambda: 'return id(sd_card_ok);'

  # ── Alarm state indicator (for LVGL icon color updates) ────────────────────
  - platform: template
    id: any_alarm_active
    name: "Any Alarm Active"
    device_class: problem
    entity_category: diagnostic
    lambda: 'return p4_ui_any_alarm(id(ctl_alarm_high_active), id(ctl_alarm_low_active), id(ctl_door_alarm_active), id(ctl_no_cool_alarm_active), id(ctl_ice_alarm_active), id(ctl_probe_fault));'
    on_state:
      - lvgl.label.update:
          id: ui_alarm_icon
          text_color: !lambda 'return x ? id(col_red) : id(col_grey);'

  # ── Phase 6: Extended alarm/status indicators ─────────────────────────────
  - platform: template
    id: door_alarm_active
    name: "Door Open Alarm"
    device_class: door
    web_server:
      sorting_group_id: group_door
      sorting_weight: 1
    lambda: 'return id(ctl_door_alarm_active);'

  - platform: template
    id: no_cool_alarm_sensor
    name: "No-Cool Alarm"
    device_class: problem
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 5
    lambda: 'return id(ctl_no_cool_alarm_active);'

  - platform: template
    id: ice_alarm_sensor
    name: "Ice Detect Alarm"
    device_class: problem
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 6
    lambda: 'return id(ctl_ice_alarm_active);'

  - platform: template
    id: sensor_fallback_sensor
    name: "Sensor Fallback Active"
    device_class: running
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 37
    lambda: 'return id(ctl_sensor_fallback_active);'

  # ── Door Reed Sensor — header P1 pin 7 (GPIO46), return on P1 pin 8 (GND) ──
  # Normally closed: contact opens when the door is opened.
  - platform: gpio
    id: door_reed_sensor
    name: "Door Reed Sensor"
    pin:
      number: ${door_reed_pin_num}
      mode: INPUT_PULLUP
    device_class: door
    web_server:
      sorting_group_id: group_door
      sorting_weight: 2
    on_state:
      - lambda: |-
          // If mode is NC (true): x=false→closed, x=true→open
          // If mode is NO (false): x=false→open, x=true→closed
          bool door_is_open = p4_door_is_open(id(ctl_door_sensor_mode_is_nc), x);

          // Door features all require Door Sensor Enabled. Light is an
          // optional add-on on top of that (cannot run with the sensor off).
          // Also respects Light Relay Enabled (hardware tab).
          if (!id(input_door_sensor_enabled)) return;

          if (id(input_door_light_enabled) && id(ctl_relay_light_enabled)) {
            if (door_is_open) id(relay_light).turn_on();
            else               id(relay_light).turn_off();
          }

          // Info voice: door open/close (only when door sensor is in use)
          if (door_is_open) id(speak_info_door_open).execute();
          else              id(speak_info_door_closed).execute();

          // Door-open alarm timer.
          if (door_is_open) {
            if (id(ctl_door_open_since_ms) == 0)
              id(ctl_door_open_since_ms) = millis();
            ESP_LOGI("door", "Door OPEN — alarm pending (delay %gs)", id(ctl_door_alarm_delay_s));
          } else {
            id(ctl_door_open_since_ms) = 0;
            id(ctl_door_alarm_active) = false;
            ESP_LOGI("door", "Door closed — alarm cleared");
          }

  - platform: template
    id: defrost_drip_sensor
    name: "Defrost Drip Phase"
    device_class: running
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 3
    lambda: 'return id(ctl_defrost_dripping);'

  # ── Defrost control logic mode indicator ───────────────────────────────────
  # Flame icon / FX animate from this — always passive on coil 0 (now Fan).
  - platform: template
    id: defrost_mode_active
    name: "Defrost Mode Active"
    device_class: running
    entity_category: diagnostic
    lambda: 'return id(ctl_defrost_active);'
    on_press:
      - lvgl.led.update:
          id: led_defrost
          brightness: 100%
    on_release:
      - lvgl.led.update:
          id: led_defrost
          brightness: 0%

  # ── Phase 9: LVGL page navigation states ───────────────────────────────────
  - platform: template
    id: page_home_state
    name: "Page Home Active"
    entity_category: diagnostic
    lambda: 'return id(page_home_active);'

  - platform: template
    id: page_settings_state
    name: "Page Settings Active"
    entity_category: diagnostic
    lambda: 'return id(page_settings_active);'

  - platform: template
    id: page_info_state
    name: "Page Info Active"
    entity_category: diagnostic
    lambda: 'return id(page_info_active);'

