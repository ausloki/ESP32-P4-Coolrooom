              - label: {align: CENTER, text: "Cancel", text_font: font_small, text_color: col_text}

##############################################################################
# Phase 4: LVGL update automations — merged into interval: above
##############################################################################

##############################################################################
# Phase 5: ntfy notification scripts (triggered from 10s control loop)
# Uses ESPHome http_request component. Each script sends one POST to ntfy.
##############################################################################

script:
  # ── Touchscreen settings pages: single refresh point ─────────────────────
  # Every stepper/toggle row's displayed value is kept in sync by this one
  # script rather than duplicating an lvgl.label.update inside each of the
  # 22 number entities' set_action and each of the 12 switches' turn_on/off
  # actions — called from each settings page's on_load (so values are
  # correct the moment you arrive, unlike the old per-page labels this
  # replaces, which only ever updated after a button press on that exact
  # page) and again after every stepper/toggle press on these pages.
  - id: refresh_all_settings_labels
    then:
      - lvgl.label.update:
          id: lbl_st_setpoint
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_setpoint)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_compdiff
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_comp_diff)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_lockout
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_comp_lockout_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_fbon
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_fallback_on_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_fboff
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_fallback_off_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_fallbacken
          text: !lambda 'return std::string(id(input_fallback_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_fallback_enabled) ? id(col_green) : id(col_grey);'

      - lvgl.label.update:
          id: lbl_sw_defrosten
          text: !lambda 'return std::string(id(input_defrost_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_defrost_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_st_definterval
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_defrost_interval_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_defduration
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_defrost_duration_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_termtemp
          text: !lambda 'return std::string(id(input_defrost_term_temp_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_defrost_term_temp_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_st_defend
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_defrost_end_c)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_defdripen
          text: !lambda 'return std::string(id(input_defrost_drip_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_defrost_drip_enabled) ? id(col_green) : id(col_grey);'

      - lvgl.label.update:
          id: lbl_st_defdrip
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_defrost_drip_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_smartdef
          text: !lambda 'return std::string(id(input_smart_defrost_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_smart_defrost_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_st_smartdelta
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_smart_delta_c)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_smartdwell
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_smart_dwell_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_dewpoint
          text: !lambda 'return std::string(id(input_dew_point_trigger_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_dew_point_trigger_enabled) ? id(col_green) : id(col_grey);'

      - lvgl.label.update:
          id: lbl_st_alarmhi
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_alarm_high_delta)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_alarmlo
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_alarm_low_delta)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_alarmpersist
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_alarm_persist_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_alarmhyst
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_alarm_hysteresis_c)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_siren
          text: !lambda 'return std::string(id(input_siren_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_siren_enabled) ? id(col_green) : id(col_grey);'

      - lvgl.label.update:
          id: lbl_st_icedelta
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_ice_delta_c)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_nocool
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_no_cool_alarm_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_startupgrace
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_startup_grace_min)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_defrostgrace
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d min", (int) id(ctl_defrost_grace_min)); return std::string(b);

      - lvgl.label.update:
          id: lbl_sw_doorsensor
          text: !lambda 'return std::string(id(input_door_sensor_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_door_sensor_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_sw_doormode
          text: !lambda 'return std::string(id(ctl_door_sensor_mode_is_nc) ? "NC" : "NO");'
      - lvgl.label.update:
          id: lbl_sw_doorlight
          text: !lambda 'return std::string(id(input_door_light_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_door_light_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_st_doordelay
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%d s", (int) id(ctl_door_alarm_delay_s)); return std::string(b);

      - lvgl.label.update:
          id: lbl_st_p1off
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_probe1_offset_c)); return std::string(b);
      - lvgl.label.update:
          id: lbl_st_p2off
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°C", id(ctl_probe2_offset_c)); return std::string(b);
      - lvgl.label.update:
          id: lbl_sw_probe2
          text: !lambda 'return std::string(id(input_probe2_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_probe2_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_sw_shtint
          text: !lambda 'return std::string(id(input_humidity_internal_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_humidity_internal_enabled) ? id(col_green) : id(col_grey);'
      - lvgl.label.update:
          id: lbl_sw_shtext
          text: !lambda 'return std::string(id(input_humidity_external_enabled) ? "ON" : "OFF");'
          text_color: !lambda 'return id(input_humidity_external_enabled) ? id(col_green) : id(col_grey);'

  - id: ntfy_high_alarm_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom HIGH TEMP Alarm"
            Priority: "${ntfy_priority}"
            Tags: "thermometer,rotating_light"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[104];
            snprintf(buf, sizeof(buf), "[%s] Coolroom %.1f°C — setpoint %.1f°C",
                     ts, id(probe1_temp).state, id(ctl_setpoint));
            return std::string(buf);

  - id: ntfy_low_alarm_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom LOW TEMP Alarm"
            Priority: "${ntfy_priority}"
            Tags: "snowflake,rotating_light"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[104];
            snprintf(buf, sizeof(buf), "[%s] Coolroom %.1f°C — setpoint %.1f°C",
                     ts, id(probe1_temp).state, id(ctl_setpoint));
            return std::string(buf);

  - id: ntfy_alarm_clear_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom Alarm CLEARED"
            Priority: "low"
            Tags: "white_check_mark"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[84];
            snprintf(buf, sizeof(buf), "[%s] Temperature normal: %.1f°C", ts, id(probe1_temp).state);
            return std::string(buf);

  - id: ntfy_probe_fault_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom PROBE FAULT"
            Priority: "urgent"
            Tags: "warning,thermometer"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[84];
            snprintf(buf, sizeof(buf), "[%s] Probe 1 stale or invalid — check RS485 connection.", ts);
            return std::string(buf);

  # Door/no-cool/ice alarms — previously event-log only (step 7b); every
  # alarm type now pushes to ntfy too, matching high/low/probe-fault.
  - id: ntfy_door_alarm_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom DOOR OPEN Alarm"
            Priority: "${ntfy_priority}"
            Tags: "door,rotating_light"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[96];
            snprintf(buf, sizeof(buf), "[%s] Door has been open past the alarm delay.", ts);
            return std::string(buf);

  - id: ntfy_no_cool_alarm_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom NO-COOL Alarm"
            Priority: "urgent"
            Tags: "warning,thermometer"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[112];
            snprintf(buf, sizeof(buf),
                     "[%s] Compressor running but room not cooling — check for a refrigeration fault.", ts);
            return std::string(buf);

  - id: ntfy_ice_alarm_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom ICE ALARM"
            Priority: "high"
            Tags: "snowflake,warning"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[96];
            snprintf(buf, sizeof(buf), "[%s] Evaporator coil may be iced — check airflow.", ts);
            return std::string(buf);

  # New — SD card failure alert. Fires once when the card goes from
  # working (or never-tried) to unavailable, whether that's "not detected
  # at boot" or "stopped working mid-session" (see p4_sd_mark_failed() in
  # p4_logging.h for what counts as a runtime failure). The device keeps
  # running fully without SD either way — logging/backup just become no-ops
  # — this purely advises that troubleshooting data collection has stopped.
  - id: ntfy_sd_failure_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom SD CARD FAILURE"
            Priority: "high"
            Tags: "warning,sd_card"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[200];
            snprintf(buf, sizeof(buf),
                     "[%s] SD card not detected or failed — event/temperature logging and "
                     "backup/restore are unavailable. Control continues normally without it.", ts);
            return std::string(buf);

  # New — fires once when the 60s auto-remount check successfully brings a
  # previously-failed/missing card back online.
  - id: ntfy_sd_recovered_request
    then:
      - http_request.post:
          url: !lambda |-
            return std::string("${ntfy_server}/${ntfy_topic}");
          request_headers:
            Title: "Coolroom SD Card Recovered"
            Priority: "low"
            Tags: "white_check_mark,sd_card"
          body: !lambda |-
            char ts[24];
            p4_fmt_time(ts, sizeof(ts));
            char buf[104];
            snprintf(buf, sizeof(buf),
                     "[%s] SD card auto-remounted — logging and backup/restore resumed.", ts);
            return std::string(buf);

  # ── Phase 9: LVGL page navigation scripts ──────────────────────────────────
  # Single PIN-gated entry point into the 7-page settings sequence — replaces
  # the old per-tab switch_to_page_settings_{1,2,3} scripts (each independently
  # PIN-gated with its own target). Same model as the old S3 project: one
  # "Settings" button, one PIN prompt, always land on page 1; Prev/Next then
  # move freely between pages 1-7 with no re-gating.
  - id: switch_to_page_home
    then:
      - lambda: |-
          id(ctl_settings_unlocked) = false;
          id(page_home_active) = true;
          id(page_settings_active) = false;
          id(page_info_active) = false;
      - lvgl.page.show: page_home

  - id: switch_to_page_settings
    then:
      - if:
          condition:
            lambda: 'return id(ctl_settings_unlocked);'
          then:
            - lambda: |-
                id(page_home_active) = false;
                id(page_settings_active) = true;
                id(page_info_active) = false;
            - lvgl.page.show: page_settings_1
          else:
            - lambda: 'id(ctl_pin_buf) = "";'
            - lvgl.label.update:
                id: ui_pin_entry_display
                text: ""
            - lvgl.label.update:
                id: ui_pin_entry_msg
                text: "Enter PIN to unlock settings"
            - lvgl.page.show: page_pin_entry

  # Info is read-only diagnostics (no adjustable parameters) — not PIN-gated,
  # same treatment as the web dashboard's Health section.
  - id: switch_to_page_info
    then:
      - lambda: |-
          id(page_home_active) = false;
          id(page_settings_active) = false;
          id(page_info_active) = true;
      - lvgl.page.show: page_info
