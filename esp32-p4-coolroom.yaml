          ESP_LOGI("config", "Probe 1 calibration offset set to %.2f", (double) x);

      - script.execute: persist_config_to_nvs
  - platform: template
    id: audio_volume_pct
    name: "Speaker Volume (%)"
    icon: "mdi:volume-high"
    unit_of_measurement: "%"
    min_value: 50
    max_value: 90
    step: 5
    entity_category: config
    update_interval: 2s
    web_server:
      sorting_group_id: group_audio
      sorting_weight: 2
    lambda: 'return id(ctl_audio_volume_pct);'
    set_action:
      - lambda: |-
          float v = x;
          if (v < 50.0f) v = 50.0f;
          if (v > 90.0f) v = 90.0f;
          id(ctl_audio_volume_pct) = v;
          // Suppress on_volume echo for 2s so a lagged callback from a
          // previous volume_set cannot overwrite this value.
          id(ctl_audio_volume_suppress_until_ms) = millis() + 2000;
          ESP_LOGI("audio", "Speaker volume set to %.0f%%", v);
      - media_player.volume_set:
          id: coolroom_media
          volume: !lambda 'return id(ctl_audio_volume_pct) / 100.0f;'
