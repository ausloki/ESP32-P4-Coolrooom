##############################################################################
# Text — web-side "Change PIN" control (touchscreen has its own keypad, see
# page_set_pin). Mirrors the same djb2-hash storage as the LVGL side.
##############################################################################

text:
  - platform: template
    id: input_change_pin_web
    name: "Change Touchscreen Access PIN"
    icon: "mdi:lock-reset"
    mode: password
    min_length: 4
    max_length: 4
    pattern: "^[0-9]{4}$"
    optimistic: false
    entity_category: config
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 90
    set_action:
      - lambda: |-
          // Deliberately never publish_state(x) here: mode: password only masks
          // the *display* state in web_server's JSON response, but the raw
          // "value" field is the same underlying obj->state either way. The
          // only way to guarantee the plaintext PIN never lands anywhere
          // readable is to never let it become this entity's published state.
          if (x.size() != 4) {
            ESP_LOGW("pin", "Web PIN change rejected: must be exactly 4 digits");
            return;
          }
          for (char c : x) {
            if (c < '0' || c > '9') {
              ESP_LOGW("pin", "Web PIN change rejected: digits only");
              return;
            }
          }
          id(ctl_pin_hash) = p4_pin_hash_djb2(x);
          ESP_LOGI("pin", "Access PIN changed via web");
          p4_sd_log_event("PIN_CHANGED", "web");
      - script.execute: persist_config_to_nvs

  - platform: template
    id: input_ntfy_server
    name: "ntfy Server"
    icon: "mdi:cloud-outline"
    mode: text
    min_length: 8
    max_length: 96
    entity_category: config
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 21
    lambda: 'return id(ctl_ntfy_server);'
    set_action:
      - lambda: |-
          std::string s = x;
          while (!s.empty() && (s.back() == '/' || s.back() == ' ')) s.pop_back();
          while (!s.empty() && s.front() == ' ') s.erase(s.begin());
          if (s.rfind("http://", 0) != 0 && s.rfind("https://", 0) != 0) {
            ESP_LOGW("ntfy", "Server rejected — must start with http:// or https://");
            return;
          }
          id(ctl_ntfy_server) = s;
          ESP_LOGI("ntfy", "Server set to %s", s.c_str());

      - script.execute: persist_config_to_nvs
  - platform: template
    id: input_ntfy_topic
    name: "ntfy Topic"
    icon: "mdi:pound"
    mode: text
    min_length: 1
    max_length: 64
    entity_category: config
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 22
    lambda: 'return id(ctl_ntfy_topic);'
    set_action:
      - lambda: |-
          std::string t = x;
          while (!t.empty() && (t.front() == '/' || t.front() == ' ')) t.erase(t.begin());
          while (!t.empty() && (t.back() == '/' || t.back() == ' ')) t.pop_back();
          if (t.empty()) {
            ESP_LOGW("ntfy", "Topic rejected — empty");
            return;
          }
          id(ctl_ntfy_topic) = t;
          ESP_LOGI("ntfy", "Topic set to %s", t.c_str());

      - script.execute: persist_config_to_nvs
  # ── WiFi reconnect (read-only stats live on Hardware Config; this is the
  # write side) — deliberately the simple "reconnect and hope" version, not
  # a safe test-before-commit switchover: save_wifi_sta() persists the new
  # credentials and reconnects immediately, dropping the current connection
  # in the process. If the new credentials are wrong, this device's existing
  # "CoolroomP4-Setup" fallback AP (see wifi:/ap: above) is the recovery
  # path — same as it already is for any other WiFi misconfiguration.
  - platform: template
    id: input_wifi_new_ssid
    name: "New WiFi SSID"
    icon: "mdi:wifi-plus"
    mode: text
    max_length: 32
    optimistic: false
    entity_category: config
    web_server:
      sorting_group_id: group_network
      sorting_weight: 10
    set_action:
      lambda: |-
        // Not sensitive — fine to stage here plainly. Consumed and cleared
        // by input_wifi_new_password's set_action below.
        id(ctl_wifi_new_ssid) = x;

  - platform: template
    id: input_wifi_new_password
    name: "New WiFi Password (submit after SSID)"
    icon: "mdi:wifi-lock"
    mode: password
    max_length: 64
    optimistic: false
    entity_category: config
    web_server:
      sorting_group_id: group_network
      sorting_weight: 11
    set_action:
      lambda: |-
        // Deliberately never publish_state(x) — same reasoning as the
        // touchscreen PIN entity above: mode: password only masks the JSON
        // "state" field, not the raw "value" field, so the only safe option
        // is to never let the plaintext password become published state.
        std::string ssid = id(ctl_wifi_new_ssid);
        if (ssid.empty()) {
          ESP_LOGW("wifi_apply", "New WiFi password submitted with no SSID staged — ignored");
          return;
        }
        id(ctl_wifi_new_ssid) = "";
        ESP_LOGI("wifi_apply", "Reconnecting to new WiFi network: %s", ssid.c_str());
        p4_sd_log_event("WIFI_RECONFIG", ssid.c_str());
        wifi::global_wifi_component->save_wifi_sta(ssid, x);

