##############################################################################
# ESP32-P4 Coolroom Controller
# Board: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
# https://docs.waveshare.com/ESP32-P4-WIFI6-Touch-LCD-7B
#
# CODING PRINCIPLE: C++/ESP-IDF first.
#   Complex logic lives in p4_helpers.h as proper C++ functions.
#   YAML lambdas are one-liners that call those helpers.
#   YAML is configuration; C++ is the firmware.
#
# HARDWARE-FIRST RULE
# All pin assignments must be verified against the board schematic before
# flashing. Pins marked ⚠️ VERIFY are unconfirmed estimates.
# Schematic: https://files.waveshare.com/wiki/ESP32-P4-WIFI6-Touch-LCD-7B/
#
# TEMPERATURE SENSOR ARCHITECTURE
# Coolroom + evaporator temperature are RS485 RTD (Waveshare BRT-PT100AD or
# equivalent) — that decision is unchanged from Phase 2. External/ambient
# temperature and all humidity readings come from I2C sensors instead (RS485
# RTD has no humidity capability at all, and the second RTD board that used
# to cover ambient has been decommissioned in favor of the I2C SHT20 — one
# less RS485 board to wire/maintain, and humidity comes along for free). I2C
# also carries the onboard RTC (chip identity not confirmed from local
# schematic text extraction; verify on physical hardware, with PCF8563
# currently treated as the working assumption) and the GT911 touch
# controller. See reference/hardware_pins.md for the full I2C address table.
#
# PROBE MAP
#   Probe 1 (coolroom primary)   — RTD board 1, CH1, addr 100
#   Probe 2 (evaporator/defrost) — RTD board 1, CH2, addr 100
#   Ambient (external reference) — I2C SHT20 @ 0x40 (probe_external_temp)
#   Internal (secondary/humidity)— I2C SHT31 @ 0x44 (probe_internal_temp)
#
# RELAY MAP (Waveshare Modbus RTU Relay 4-CH, addr 1)
#   Coil 0 = Defrost   Coil 1 = Compressor
#   Coil 2 = Light     Coil 3 = Siren
#
# PHASE STATUS
#   Phase 1: WiFi, HA native API, web server, OTA            ✓
#   Phase 2: RS485 Modbus — relays + 2x RTD probes           ✓
#   Phase 3: Coolroom control logic                          ✓
#   Phase 4: LVGL 7" MIPI-DSI touchscreen UI                ✓
#   Phase 5: SD card logging, ntfy, backup/restore           ← CURRENT
##############################################################################

substitutions:
  device_name:   esp32-p4-coolroom
  friendly_name: "Coolroom Controller P4"
  timezone:      Australia/Perth

  # ── NTP servers ───────────────────────────────────────────────────────────
  ntp_server_1: au.pool.ntp.org
  ntp_server_2: time.google.com

  # ── NTP sync intervals (milliseconds, passed to ESP-IDF esp_sntp_set_sync_interval)
  # ntp_fast_sync_ms  : poll rate at boot until first sync (1 minute)
  # ntp_normal_sync_ms: steady-state interval (86400000 = 24 h)
  ntp_fast_sync_ms:   "60000"
  ntp_normal_sync_ms: "86400000"

  # ── I2C header (GPIO CONFIRMED from Waveshare docs) ───────────────────────
  # Reserved for onboard RTC only. NOT used for temperature.
  i2c_sda_pin: GPIO7
  i2c_scl_pin: GPIO8

  # ── RS485 UART (✅ CONFIRMED from Waveshare 13_RS485_Test example) ────────
  rs485_tx_pin: GPIO27
  rs485_rx_pin: GPIO26

  # ── Relay board ───────────────────────────────────────────────────────────
  modbus_relay_address: "1"

  # ── RTD board 1: Coolroom (CH1) + Evaporator (CH2), addr 100 ─────────────
  modbus_rtd1_address:          "100"
  modbus_rtd_universal_address: "249"
  rtd_temp_reg_ch1:             "1"
  rtd_temp_reg_ch2:             "2"
  rtd_temp_scale:               "0.1"

  # ── WiFi co-processor (ESP32-C6 via SDIO) ─────────────────────────────────
  # ✅ CONFIRMED from Waveshare esp32_p4_function_ev_board.h (CONFIG_BSP_BOARD_TYPE_FIB)
  wifi_sdio_clk_pin: GPIO18
  wifi_sdio_cmd_pin: GPIO19
  wifi_sdio_d0_pin:  GPIO14
  wifi_sdio_d1_pin:  GPIO15
  wifi_sdio_d2_pin:  GPIO16
  wifi_sdio_d3_pin:  GPIO17
  wifi_c6_reset_pin: GPIO54
  wifi_c6_wakeup_pin: GPIO6
  wifi_c6_wakeup_pin_num: "6"

  # ── Phase 4: Display & Touch GPIO (✅ confirmed from board schematic PDF) ─
  # INT_TP  → NLGPIO23, RESET_TP → NLGPIO33, BL_CTRL → NLGPIO32
  touch_int_pin:  GPIO23
  touch_rst_pin:  GPIO33   # shared with LCD reset — ESPHome model handles LCD side
  display_bl_pin: GPIO32

  # ── Control defaults ──────────────────────────────────────────────────────
  default_setpoint_c:   "2.0"
  default_comp_diff_c:  "1.0"
  default_alarm_high_c: "3.0"
  default_alarm_low_c:  "3.0"

  # ── Phase 6: Extended control parameter defaults ──────────────────────────
  default_comp_lockout_min:    "3"    # compressor off-delay (minutes)
  default_startup_grace_min:   "15"   # no alarms for N min after boot
  default_defrost_grace_min:   "20"   # no alarms for N min after defrost
  default_alarm_persist_min:   "5"    # alarm must hold N min before siren
  default_alarm_hysteresis_c:  "0.5"  # temp band to clear alarm (°C)
  default_no_cool_alarm_min:   "60"   # no-cool alarm after N min compressor run
  default_door_alarm_delay_s:  "300"  # door open alarm delay (seconds, 5 min)
  default_defrost_interval_min: "480"  # defrost every N min (8h)
  default_defrost_duration_min: "30"   # max defrost on-time (min)
  default_defrost_drip_min:    "5"    # drip time after defrost (min)
  default_defrost_end_c:       "5.0"  # evap temp to terminate defrost (°C)
  default_ice_delta_c:         "2.0"  # coolroom-evap min delta; below = ice alarm
  default_fallback_on_min:     "3"    # sensor fallback compressor on-time (min)
  default_fallback_off_min:    "27"   # sensor fallback compressor off-time (min)
  default_smart_delta_c:       "8.0"  # delta threshold for smart defrost trigger
  default_smart_dwell_min:     "30"   # delta must hold N min before smart defrost
  # ── Phase 3: Defrost scheduling & probe health ────────────────────
  defrost_interval_h:  "8"      # hours between defrost cycles
  defrost_max_min:     "30"     # maximum defrost duration (minutes)
  probe_stale_ms:      "30000"  # probe 1 declared stale after this many ms

  # Hard safety ceiling on the startup alarm grace period — the grace stays
  # active past default_startup_grace_min until the room first reaches the
  # alarm-safe band (covers a slow pulldown from a warm start), but never
  # longer than this, so a genuinely stuck/broken pulldown still alarms
  # eventually. Not exposed as a tunable number entity (technical safety
  # limit, not an operational setting) — matches probe_stale_ms/
  # defrost_max_min's treatment above.
  startup_grace_max_min: "240"  # 4h hard ceiling on startup pulldown grace

  # ── Phase 5: SD logging & ntfy ──────────────────────────────
  log_interval_min:    "5"      # temperature log interval (minutes)
  ntfy_server:         "https://ntfy.sh"   # ntfy server URL
  ntfy_topic:          "sacor-coolroom"    # ntfy topic name
  ntfy_priority:       "high"              # default ntfy message priority

##############################################################################
# Platform
##############################################################################

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - p4_helpers.h
    - p4_control.h
    - p4_logging.h
    - p4_log_manager.h
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            // Keep the ESP32-C6 co-processor awake before hosted SDIO init.
            gpio_reset_pin((gpio_num_t) ${wifi_c6_wakeup_pin_num});
            gpio_set_direction((gpio_num_t) ${wifi_c6_wakeup_pin_num}, GPIO_MODE_OUTPUT);
            gpio_set_level((gpio_num_t) ${wifi_c6_wakeup_pin_num}, 1);

    - priority: 600
      then:
        - lambda: |-
            id(ctl_boot_ms) = millis();
            // Defrost interval clock starts counting from power-on rather
            // than triggering immediately (matches Carel's d0=off default —
            // no forced defrost on every reboot/OTA of an already-cold room).
            id(ctl_defrost_last_end_ms) = id(ctl_boot_ms);
            p4_log_boot();
            p4_ntp_set_fast_sync(${ntp_fast_sync_ms});
    - priority: -200
      then:
        - lambda: |-
            // Phase 5: mount SD card after all peripherals are up
            if (p4_sd_mount()) {
                id(sd_card_ok) = true;
                // Attempt full settings restore from /sdcard/backup.json.
                // This acts as recovery if NVS was reset/lost; normal retention
                // still comes from restore_value + NVS sync.
                float sp = id(ctl_setpoint);
                float cd = id(ctl_comp_diff);
                float ah = id(ctl_alarm_high_delta);
                float al = id(ctl_alarm_low_delta);
              float lockout = id(ctl_comp_lockout_min);
              float def_grace = id(ctl_defrost_grace_min);
              float def_int = id(ctl_defrost_interval_min);
              float def_dur = id(ctl_defrost_duration_min);
              float def_drip = id(ctl_defrost_drip_min);
              float def_end = id(ctl_defrost_end_c);
              float alarm_persist = id(ctl_alarm_persist_min);
              float alarm_hyst = id(ctl_alarm_hysteresis_c);
              float door_delay = id(ctl_door_alarm_delay_s);
              float no_cool = id(ctl_no_cool_alarm_min);
              float ice_delta = id(ctl_ice_delta_c);
              float fb_on = id(ctl_fallback_on_min);
              float fb_off = id(ctl_fallback_off_min);
              float smart_delta = id(ctl_smart_delta_c);
              float smart_dwell = id(ctl_smart_dwell_min);
              bool probe2_en = id(input_probe2_enabled);
              bool door_mode_nc = id(ctl_door_sensor_mode_is_nc);
              bool door_en = id(input_door_sensor_enabled);
              bool siren_en = id(input_siren_enabled);
              bool defrost_en = id(input_defrost_enabled);
              bool fallback_en = id(input_fallback_enabled);
              bool def_term_en = id(input_defrost_term_temp_enabled);
              bool def_drip_en = id(input_defrost_drip_enabled);
              bool smart_def_en = id(input_smart_defrost_enabled);
              bool hum_int_en = id(input_humidity_internal_enabled);
              bool hum_ext_en = id(input_humidity_external_enabled);
              float p1_off = id(ctl_probe1_offset_c);
              float p2_off = id(ctl_probe2_offset_c);
              bool dew_trigger_en = id(input_dew_point_trigger_enabled);
              float startup_grace = id(ctl_startup_grace_min);
              bool door_light_en = id(input_door_light_enabled);
              if (p4_sd_restore_params(
                  sp, cd, ah, al,
                  lockout, def_grace, def_int, def_dur, def_drip, def_end,
                  alarm_persist, alarm_hyst, door_delay, no_cool, ice_delta,
                  fb_on, fb_off, smart_delta, smart_dwell,
                  probe2_en, door_mode_nc, door_en, siren_en,
                  defrost_en, fallback_en, def_term_en, def_drip_en, smart_def_en,
                  hum_int_en, hum_ext_en,
                  p1_off, p2_off, dew_trigger_en, startup_grace, door_light_en)) {
                    id(ctl_setpoint)         = sp;
                    id(ctl_comp_diff)        = cd;
                    id(ctl_alarm_high_delta) = ah;
                    id(ctl_alarm_low_delta)  = al;
                id(ctl_comp_lockout_min) = lockout;
                id(ctl_defrost_grace_min) = def_grace;
                id(ctl_defrost_interval_min) = def_int;
                id(ctl_defrost_duration_min) = def_dur;
                id(ctl_defrost_drip_min) = def_drip;
                id(ctl_defrost_end_c) = def_end;
                id(ctl_alarm_persist_min) = alarm_persist;
                id(ctl_alarm_hysteresis_c) = alarm_hyst;
                id(ctl_door_alarm_delay_s) = door_delay;
                id(ctl_no_cool_alarm_min) = no_cool;
                id(ctl_ice_delta_c) = ice_delta;
                id(ctl_fallback_on_min) = fb_on;
                id(ctl_fallback_off_min) = fb_off;
                id(ctl_smart_delta_c) = smart_delta;
                id(ctl_smart_dwell_min) = smart_dwell;
                id(input_probe2_enabled) = probe2_en;
                id(ctl_door_sensor_mode_is_nc) = door_mode_nc;
                id(input_door_sensor_enabled) = door_en;
                id(input_siren_enabled) = siren_en;
                id(input_defrost_enabled) = defrost_en;
                id(input_fallback_enabled) = fallback_en;
                id(input_defrost_term_temp_enabled) = def_term_en;
                id(input_defrost_drip_enabled) = def_drip_en;
                id(input_smart_defrost_enabled) = smart_def_en;
                id(input_humidity_internal_enabled) = hum_int_en;
                id(input_humidity_external_enabled) = hum_ext_en;
                id(ctl_probe1_offset_c) = p1_off;
                id(ctl_probe2_offset_c) = p2_off;
                id(input_dew_point_trigger_enabled) = dew_trigger_en;
                id(ctl_startup_grace_min) = startup_grace;
                id(input_door_light_enabled) = door_light_en;
                if (esphome::global_preferences != nullptr)
                  esphome::global_preferences->sync();
                ESP_LOGI("sd", "All control settings restored from SD backup");
                    p4_sd_log_event("BOOT_RESTORE", "params loaded from SD");
                } else {
                    p4_sd_log_event("BOOT", "SD mounted, no restore needed");
                }
            } else {
                id(sd_card_ok) = false;
                ESP_LOGW("sd", "SD card not found or mount failed");
            }
    - priority: -250
      then:
        - lambda: |-
            // Custom SD log-manager endpoint (list/download/delete daily CSV
            // logs) — registered on the same AsyncWebServer instance
            // web_server uses, so it automatically inherits the same
            // basic-auth credentials via WebServerBase::add_handler().
            if (web_server_base::global_web_server_base != nullptr) {
                web_server_base::global_web_server_base->add_handler(new p4_logs::LogManagerHandler());
                ESP_LOGI("logmgr", "SD log manager endpoint registered at /logs");
            }
    - priority: -100
      then:
        - lambda: id(status_text).publish_state("Booting...");
    - priority: -90
      then:
        - logger.log: "Diagnostic: Wi-Fi kept disabled to avoid hosted-link reset loop"

esp32:
  variant: esp32p4
  # First real hardware in hand (2026-07-29) reports chip revision v1.3 via
  # esptool -- confirmed engineering-sample silicon (rev < 3.0). This flag
  # gates chip-revision-specific init (PSRAM/flash timing tuning differs
  # between ES and production silicon); already documented as required in
  # reference/hardware_pins.md but never applied since no board existed to
  # check the actual revision against until now. cpu_frequency below was
  # already at the ES-safe 360MHz cap independently, so that part was fine.
  engineering_sample: true
  # Every official Waveshare ESP-IDF example for this exact board (including
  # 08_lvgl_display_panel, the closest analog to what we're doing) sets
  # CONFIG_ESPTOOLPY_FLASHMODE_QIO — Quad I/O. We were on ESPHome's default
  # (DIO), confirmed via the ROM bootloader's own boot banner ("SPI mode:DIO")
  # captured from real hardware. A flash-mode mismatch against what the
  # physical chip is actually characterized for is a plausible cause of a
  # hang during the bootloader's own SPI-speed reconfiguration, which happens
  # very early -- before any of its own log output.
  flash_mode: qio
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESPHome's flash_mode: qio (above) only sets the CONFIG_ESPTOOLPY_
      # FLASHMODE_QIO choice-boolean, not the companion literal string
      # CONFIG_ESPTOOLPY_FLASHMODE that esptool's elf2image actually reads
      # when stamping the bootloader/app image header's flash-mode byte --
      # confirmed by inspecting the generated sdkconfig (QIO=y but the
      # string still read "dio") and the built binaries themselves (header
      # byte 0x02 = DIO in both bootloader.bin and the app image). Setting
      # the string explicitly here forces both to agree.
      CONFIG_ESPTOOLPY_FLASHMODE: "qio"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65535"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "16"
      # Phase 5: FATFS for SD card (long filename support)
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
  flash_size: 32MB
  partitions: partitions_custom.csv
  cpu_frequency: 360MHz

psram:
  mode: hex
  # Keep PSRAM at a conservative speed during bench bring-up. The UI path is
  # PSRAM-heavy; aggressive timing can destabilize early hardware sessions.
  speed: 100MHZ

##############################################################################
# WiFi via ESP32-C6 co-processor (ESP-Hosted SDIO)
# ✅ SDIO PINS CONFIRMED from Waveshare esp32_p4_function_ev_board.h (FIB variant)
##############################################################################

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: ${wifi_c6_reset_pin}
  active_high: true
  clk_pin: ${wifi_sdio_clk_pin}
  cmd_pin: ${wifi_sdio_cmd_pin}
  d0_pin:  ${wifi_sdio_d0_pin}
  d1_pin:  ${wifi_sdio_d1_pin}
  d2_pin:  ${wifi_sdio_d2_pin}
  d3_pin:  ${wifi_sdio_d3_pin}
  bus_width: 4
  sdio_frequency: 40MHz
  use_psram: true

wifi:
  # Diagnostic isolation mode: keep hosted config present but do not start
  # Wi-Fi automatically at boot.
  enable_on_boot: false
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
  # Keep control logic autonomous if Wi-Fi/AP is unavailable.
  reboot_timeout: 0s
  ap:
    ssid: "CoolroomP4-Setup"
    password: !secret ap_password
  on_connect:
    - lambda: |-
        id(ctl_wifi_connected) = true;
        ESP_LOGI("wifi", "WiFi connected");
  on_disconnect:
    - lambda: id(ctl_wifi_connected) = false;

captive_portal:

api:
  # NOTE: ESPHome native API is inbound (Home Assistant connects to this device).
  # Endpoint selection (for web dashboards or proxies) must be handled by the
  # connecting client. In this project we now target HA's LAN IP over VPN
  # routing between sites instead of using a public IP fallback.
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  on_client_connected:
    - lambda: |-
        ESP_LOGI("ha", "HA client connected: %s", client_info.c_str());

ota:
  - platform: esphome
    password: !secret ota_password

mdns:
  disabled: false

##############################################################################
# Time — SNTP with configurable sync intervals via ESP-IDF API
# The P4 board has a battery-backed RTC holder (item 11).
# RTC chip identity is not confirmed from local schematic text extraction.
# Use PCF8563 as the working assumption until hardware I2C scan or chip marking
# inspection confirms the actual RTC device.
# Fast-sync at boot is set by p4_ntp_set_fast_sync() in on_boot above.
# Normal interval is restored by p4_ntp_set_interval() in on_time_sync below.
##############################################################################

time:
  - platform: sntp
    id: ntp_time
    timezone: ${timezone}
    servers:
      - ${ntp_server_1}
      - ${ntp_server_2}
    on_time_sync:
      - lambda: |-
          ESP_LOGI("ntp", "Sync complete — switching to normal interval");
          p4_ntp_set_interval(${ntp_normal_sync_ms});

  # External RTC probe is temporarily disabled for bench bring-up so missing
  # optional hardware cannot force reboot loops. Keep hw_rtc_ok false and
  # rely on SNTP-only time until hardware confirmation is complete.

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    modbus_controller: WARN
    modbus: WARN
    sensor: WARN
    text_sensor: WARN

safe_mode:
  # Keep safe mode available for bad firmware, but avoid false boot-loop
  # detection during bench diagnostics when optional external hardware is
  # missing and/or USB logging tools trigger an early reset event.
  boot_is_good_after: 1s
  num_attempts: 8

web_server:
  port: 80
  version: 3
  auth:
    type: basic
    username: !secret web_server_username
    password: !secret web_server_password
  # Web dashboard access model (see reference/RBAC_USER_GUIDE.md):
  # ESPHome's web_server auth supports exactly one username/password pair — there is
  # no server-side concept of multiple accounts or roles. The dashboard's guest/operator
  # split (assets/dashboard.html) is a client-side UI convenience only: "operator" means
  # "knows this one credential", not a distinct backend privilege level.
  #
  # Access REST API: GET http://192.168.x.x/api/states (returns all entity states as JSON)
  # Dashboard: /assets/dashboard.html or serve via external web server
  # Example: curl -u admin:password http://192.168.x.x/api/states | jq '.'
  sorting_groups:
    - id: group_system_info
      name: "System"
      sorting_weight: -200
    - id: group_network
      name: "Network & Connectivity"
      sorting_weight: -190
    - id: group_control
      name: "Temperature Control"
      sorting_weight: -100
    - id: group_compressor
      name: "Compressor"
      sorting_weight: -80
    - id: group_defrost
      name: "Defrost"
      sorting_weight: -60
    - id: group_probes
      name: "Probes & Sensors"
      sorting_weight: -40
    - id: group_door
      name: "Door"
      sorting_weight: -30
    - id: group_alarms
      name: "Alarms"
      sorting_weight: -20
    - id: group_diagnostics
      name: "Diagnostics"
      sorting_weight: 100

##############################################################################
# I2C — RTC + GT911 touch + external I2C header (item 19, PH2.0 4-PIN: SDA/SCL
# GPIO7/8, on-board pullups already present, do not enable internal pullups).
#
# Phase 2 deliberately kept this bus temperature-free (RS485 RTD handles all
# temperature sensing) — that constraint is unchanged. What's new here is
# humidity, which RS485 RTD cannot provide at all, so the SHT31 (internal)
# and SHT20 (external) humidity/temp sensors below share this same bus rather
# than opening a second I2C bus or connector. All four devices coexist at
# distinct addresses (RTC 0x51, GT911 0x5D, SHT31 0x44/0x45, SHT20 0x40) — no
# conflicts. See reference/hardware_pins.md for the full address table and
# physical wiring (both new sensors land on the same item-19 4-pin header,
# wired in parallel — I2C is a shared bus, not a point-to-point link).
##############################################################################

i2c:
  - id: i2c_bus
    sda: ${i2c_sda_pin}
    scl: ${i2c_scl_pin}
    scan: true
    frequency: 100kHz

##############################################################################
# RS485 / Modbus
# ✅ UART PINS CONFIRMED from Waveshare 13_RS485_Test example (GPIO 27 TX / 26 RX)
##############################################################################

uart:
  - id: rs485_uart
    tx_pin: ${rs485_tx_pin}
    rx_pin: ${rs485_rx_pin}
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE

modbus:
  - id: rs485_modbus
    uart_id: rs485_uart
    send_wait_time: 250ms

modbus_controller:
  - id: relay_board
    address: ${modbus_relay_address}
    modbus_id: rs485_modbus
    setup_priority: -10
    update_interval: 5s
    on_online:
      - lambda: |-
          id(hw_rs485_relay_ok) = true;
          ESP_LOGI("rs485", "Relay board ONLINE");
    on_offline:
      - lambda: |-
          id(hw_rs485_relay_ok) = false;
          ESP_LOGW("rs485", "Relay board OFFLINE");

  - id: rtd_board_1
    address: ${modbus_rtd1_address}
    modbus_id: rs485_modbus
    setup_priority: -10
    update_interval: 2s
    on_online:
      - lambda: |-
          id(hw_rs485_rtd1_ok) = true;
          ESP_LOGI("rs485", "RTD board 1 ONLINE");
    on_offline:
      - lambda: |-
          id(hw_rs485_rtd1_ok) = false;
          ESP_LOGW("rs485", "RTD board 1 OFFLINE");

##############################################################################
# Relay Switches — coils 0-3 on relay_board
##############################################################################

switch:
  - platform: modbus_controller
    modbus_controller_id: relay_board
    id: relay_defrost
    name: "Defrost Relay"
    icon: "mdi:snowflake-melt"
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 2
    register_type: coil
    address: 0
    restore_mode: ALWAYS_OFF
    write_lambda: |-
      if (x) id(relay_compressor).turn_off();
      return x;
    on_turn_on:
      - lambda: ESP_LOGI("relay", "Defrost ON");
      - lvgl.led.update:
          id: led_defrost
          brightness: 100%
    on_turn_off:
      - lambda: ESP_LOGI("relay", "Defrost OFF");
      - lvgl.led.update:
          id: led_defrost
          brightness: 0%

  - platform: modbus_controller
