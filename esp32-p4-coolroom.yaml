##############################################################################
# Phase 4: LVGL update automations — merged into interval: above
##############################################################################

##############################################################################
# Phase 5: ntfy notification scripts (triggered from 10s control loop)
# Uses ESPHome http_request component. Each script sends one POST to ntfy.
##############################################################################

script:
  # ── Force every NVS-backed global to stage + flush ───────────────────────
  # RestoringGlobalsComponent only calls pref.save() from its own 1s poll,
  # *after* the action that changed the value has returned. A sync() inside
  # that action therefore commits the *previous* value; the new one sits in
  # RAM until the next poll+sync pair (~2s). Rebooting inside that window
  # silently loses the change — which is exactly the "I turned ntfy/light
  # off and it came back after reboot" report. This script forces every
  # restoring global to stage its current RAM value, then flushes NVS.
  # Call it from every config switch/number action, and once a second from
  # the display interval as a safety net.
  - id: persist_config_to_nvs
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          // RestoringGlobalsComponent is a PollingComponent, but ESPHome's
          // component.update action types the ID as GlobalsComponent and
          // rejects it. Call update() on the generated pointers directly —
          // that runs store_value_() and stages the current RAM value into
          // the preference buffer. sync() then commits it to NVS.
          ctl_setpoint->update();
          ctl_comp_diff->update();
          ctl_alarm_high_delta->update();
          ctl_alarm_low_delta->update();
          ctl_probe1_offset_c->update();
          ctl_probe2_offset_c->update();
          input_probe2_enabled->update();
          input_humidity_internal_enabled->update();
          input_humidity_external_enabled->update();
          ctl_pin_hash->update();
          ctl_ntfy_server->update();
          ctl_ntfy_topic->update();
          input_ntfy_enabled->update();
          input_ha_api_enabled->update();
          ctl_comp_lockout_min->update();
          ctl_comp_min_run_min->update();
          ctl_startup_grace_min->update();
          ctl_defrost_grace_min->update();
          ctl_defrost_interval_min->update();
          ctl_defrost_duration_min->update();
          ctl_defrost_drip_min->update();
          ctl_defrost_end_c->update();
          ctl_defrost_skip_below_c->update();
          ctl_defrost_force_max_min->update();
          ctl_frost_rate_humidity_threshold_pct->update();
          ctl_frost_rate_window_s->update();
          ctl_alarm_persist_min->update();
          ctl_alarm_hysteresis_c->update();
          ctl_door_alarm_delay_s->update();
          ctl_no_cool_alarm_min->update();
          ctl_ice_delta_c->update();
          ctl_ice_dwell_min->update();
          ctl_fallback_on_min->update();
          ctl_fallback_off_min->update();
          ctl_smart_delta_c->update();
          ctl_smart_dwell_min->update();
          ctl_relay_compressor_enabled->update();
          ctl_relay_fan_enabled->update();
          ctl_relay_light_enabled->update();
          ctl_relay_siren_enabled->update();
          ctl_door_sensor_mode_is_nc->update();
          input_dew_point_trigger_enabled->update();
          input_defrost_skip_cold_enabled->update();
          input_frost_rate_monitoring_enabled->update();
          input_ice_detect_enabled->update();
          ctl_calibration_samples_min->update();
          ctl_calibration_samples_max->update();
          input_door_sensor_enabled->update();
          input_door_light_enabled->update();
          input_door_hold_compressor->update();
          input_siren_enabled->update();
          input_audio_alerts_enabled->update();
          ctl_audio_volume_pct->update();
          input_audio_alarm_high->update();
          input_audio_alarm_low->update();
          input_audio_alarm_door->update();
          input_audio_alarm_no_cool->update();
          input_audio_alarm_ice->update();
          input_audio_alarm_probe->update();
          input_audio_alarm_relay_board->update();
          input_audio_alarm_temp_board->update();
          input_audio_alarm_humidity_sensor->update();
          input_audio_alarm_ambient_sensor->update();
          input_audio_info_cooling_on->update();
          input_audio_info_cooling_off->update();
          input_audio_info_defrost_on->update();
          input_audio_info_defrost_off->update();
          input_audio_info_door_open->update();
          input_audio_info_door_closed->update();
          input_defrost_enabled->update();
          input_fallback_enabled->update();
          input_defrost_term_temp_enabled->update();
          input_defrost_drip_enabled->update();
          input_smart_defrost_enabled->update();
          ctl_sd_temp_log_retention_days->update();
          if (esphome::global_preferences != nullptr)
            esphome::global_preferences->sync();

  # ── Touchscreen settings pages: single refresh point ─────────────────────
  # Every stepper/toggle row's displayed value is kept in sync by this one
  # script rather than duplicating an lvgl.label.update inside each of the
  # 22 number entities' set_action and each of the 12 switches' turn_on/off
  # actions — called from each settings page's on_load (so values are
  # correct the moment you arrive, unlike the old per-page labels this
  # replaces, which only ever updated after a button press on that exact
  # page) and again after every stepper/toggle press on these pages.
  - id: refresh_all_settings_labels
    then:
      - lvgl.label.update:
          id: lbl_st_setpoint
