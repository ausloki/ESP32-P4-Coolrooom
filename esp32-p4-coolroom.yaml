  # genuinely completes, ahead of the startup_grace_max_min hard ceiling.
  - id: ctl_startup_pulldown_done
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ctl_wifi_connected
    type: bool
    restore_value: no
    initial_value: "false"

