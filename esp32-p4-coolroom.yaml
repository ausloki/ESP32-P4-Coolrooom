##############################################################################
# ntfy per-alert-type priority
#
# Each alert category carries its own ntfy Priority header, so a phone can be
# told to break through Do Not Disturb for a no-cool failure while an all-clear
# arrives silently. These were fixed at build time (one substitution for the
# alarm types, hardcoded strings for the rest); they are runtime settings now.
# The initial_option values reproduce exactly what the firmware sent before.
#
# "urgent" is ntfy's alias for max priority. Options deliberately stop there
# rather than also offering 1-5 — same five levels, two spellings, no gain.
##############################################################################

select:
  # Display preference only: all control math, persisted values, Modbus data,
  # logs, and native-API temperature sensors remain canonical Celsius. Home
  # Assistant applies its own unit-system conversion to temperature sensors;
  # this select is also published to HA so automations can choose the LVGL/web
  # presentation unit.
  - platform: template
    id: sel_temperature_display_unit
    name: "Temperature Display Unit"
    icon: "mdi:temperature-celsius"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Celsius"
