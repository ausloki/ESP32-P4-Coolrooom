  # Refresh every temperature readout immediately when the display-unit select
  # changes. Sensor callbacks will keep these synchronized on later readings.
  - id: refresh_temperature_display
    then:
      - lvgl.label.update:
          id: lbl_coolroom_temp_large
          text: !lambda |-
            return p4_fmt_temp(
                id(probe1_temp).state,
                id(sel_temperature_display_unit).current_option() == "Fahrenheit");
      - lvgl.label.update:
          id: lbl_coolroom_temp_large_v2
          text: !lambda |-
            return p4_fmt_temp(
                id(probe1_temp).state,
                id(sel_temperature_display_unit).current_option() == "Fahrenheit");
      - lvgl.label.update:
