##############################################################################
# Sensors — all temperature probes are RS485 RTD
##############################################################################

sensor:
  # ── System diagnostics ────────────────────────────────────────────────────
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_rssi
    update_interval: 60s
    web_server:
      sorting_group_id: group_network
      sorting_weight: 1

  - platform: internal_temperature
    name: "Chip Temperature"
    id: chip_temp
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 10

  - platform: template
    name: "Free Heap (KB)"
    id: free_heap_kb
    lambda: 'return p4_free_heap_kb();'
    unit_of_measurement: "KB"
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 11

  - platform: template
    name: "Free PSRAM (KB)"
    id: free_psram_kb
    lambda: 'return p4_free_psram_kb();'
    unit_of_measurement: "KB"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 12

  - platform: template
    name: "CPU Usage"
    id: cpu_usage_pct
    lambda: 'return p4_cpu_usage_pct();'
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 13

  - platform: template
    name: "CPU Usage Core 0"
    id: cpu_usage_core0_pct
    lambda: 'return p4_cpu_usage_core_pct(0);'
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 14

  - platform: template
    name: "CPU Usage Core 1"
    id: cpu_usage_core1_pct
    lambda: 'return p4_cpu_usage_core_pct(1);'
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 15

  - platform: uptime
    name: "System Uptime"
    id: system_uptime
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 2

  # ── RTD board 1 raw (internal — timestamps updated in filter lambda) ───────
  - platform: modbus_controller
    modbus_controller_id: rtd_board_1
    id: rtd1_ch1_raw
    internal: true
    register_type: holding
    address: ${rtd_temp_reg_ch1}
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (!isnan(x)) id(rtd1_ch1_last_ms) = millis();
          return x * ${rtd_temp_scale};

  - platform: modbus_controller
    modbus_controller_id: rtd_board_1
    id: rtd1_ch2_raw
    internal: true
    register_type: holding
    address: ${rtd_temp_reg_ch2}
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (!isnan(x)) id(rtd1_ch2_last_ms) = millis();
          return x * ${rtd_temp_scale};

  # ── Published probe sensors ────────────────────────────────────────────────
  - platform: template
    id: probe1_temp
    name: "Coolroom Temperature (Primary Control)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 2s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 1
    lambda: 'return p4_rtd_or_nan(id(rtd1_ch1_raw).state);'
    filters:
      # Manual calibration offset — fine-tunes this probe against a
      # reference thermometer. Applied after conversion, before every
      # downstream consumer (control, alarms, logs, display) sees it.
      - lambda: 'return isnan(x) ? x : x + id(ctl_probe1_offset_c);'
    on_value:
      - lvgl.label.update:
          id: lbl_coolroom_temp_large
          text: !lambda |-
            return p4_fmt_temp(
                x, id(sel_temperature_display_unit).current_option() == "Fahrenheit");
      - lvgl.label.update:
          id: lbl_coolroom_temp_large_v2
          text: !lambda |-
            return p4_fmt_temp(
                x, id(sel_temperature_display_unit).current_option() == "Fahrenheit");
      - lvgl.arc.update:
          id: home_temp_arc
          value: !lambda |-
            return p4_ui_temp_to_arc_pct(x, ${dial_min_c}, ${dial_max_c});
      - lambda: |-
          // Skip alt-view arc/knob math while classic home (or another tab) is showing.
          if (!id(page_home_active) || !id(home2_view_active)) return;
          p4_ui_update_home2_cooling(
              id(home2_set_arc), id(home2_temp_arc), id(home2_temp_delta_arc),
              id(home2_knob_set), id(home2_knob_cur),
              x, id(ctl_setpoint), ${dial_min_c}, ${dial_max_c},
              id(home2_ambient_arc));

  - platform: template
    id: probe2_temp
    name: "Evaporator Temperature (Secondary Control)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 2s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 2
    lambda: |-
      if (!id(input_probe2_enabled)) return NAN;
      return p4_rtd_or_nan(id(rtd1_ch2_raw).state);
    filters:
      - lambda: 'return isnan(x) ? x : x + id(ctl_probe2_offset_c);'
    on_value:
      - lvgl.label.update:
          id: lbl_evap_temp_large
          text: !lambda |-
            return p4_fmt_evap_label(
                x, id(sel_temperature_display_unit).current_option() == "Fahrenheit");
      - lvgl.label.update:
          id: lbl_evap_temp_alt
          text: !lambda |-
            return p4_fmt_evap_label(
                x, id(sel_temperature_display_unit).current_option() == "Fahrenheit");

  # Pre-offset RTD readings for web Probes tab (corrected = probe1/2_temp above).
  - platform: template
    id: probe1_temp_raw
    name: "Probe 1 Raw Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    entity_category: diagnostic
    update_interval: 2s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 3
    lambda: 'return p4_rtd_or_nan(id(rtd1_ch1_raw).state);'

  - platform: template
    id: probe2_temp_raw
    name: "Probe 2 Raw Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    entity_category: diagnostic
    update_interval: 2s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 4
    lambda: |-
      if (!id(input_probe2_enabled)) return NAN;
      return p4_rtd_or_nan(id(rtd1_ch2_raw).state);

  # ── Humidity/temp sensors — I2C, on the shared bus (see i2c: block above) ──
  # probe_external_temp (SHT20) is now also the "Ambient" reading — it drives
  # home_ambient_arc directly below. The dedicated ambient RTD board (probe3,
  # RTD board 2 @ 101) was decommissioned: SHT20 covers the same external-
  # reference role and adds humidity, which RTD never could.
  # Raw readings stay internal; public probe_* sensors below gate on their
  # enable flags the same way probe2_temp already does. Absent breakouts log
  # I2C communication errors and leave state NaN — firmware still boots.
  #
  # SHT31 (internal, coolroom cabinet): prefer 0x44 (ADDR pin low / default).
  # Some breakouts strap ADDR high → 0x45 — change address: below if needed.
  # See reference/hardware_pins.md (External I2C Header).
  - platform: sht3xd
    i2c_id: i2c_bus
    address: 0x44
    update_interval: 30s
    temperature:
      id: sht31_internal_temp_raw
      internal: true
    humidity:
      id: sht31_internal_humidity_raw
      internal: true

  # SHT20 (external ambient): HTU21D-compatible, fixed address 0x40
  # (SHT20/SHT21/SHT25/HTU21D all use 0x40 — not configurable).
  - platform: htu21d
    i2c_id: i2c_bus
    address: 0x40
    model: HTU21D
    update_interval: 30s
    temperature:
      id: sht20_external_temp_raw
      internal: true
    humidity:
      id: sht20_external_humidity_raw
      internal: true

  - platform: template
    id: probe_internal_temp
    name: "Internal Temperature (SHT31)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 4
    lambda: |-
      if (!id(input_humidity_internal_enabled)) return NAN;
      return id(sht31_internal_temp_raw).state;
    on_value:
      # Composes both lines from current sensor state on every update (not
      # just this sensor's own value) — humidity updates independently on its
      # own interval and would otherwise clobber this line, and vice versa.
      - lvgl.label.update:
          id: lbl_int_humidity_large
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_int_humidity_label(x, id(probe_internal_humidity).state, f);
      - lvgl.label.update:
          id: lbl_int_humidity_alt
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_int_humidity_label(x, id(probe_internal_humidity).state, f);

  - platform: template
    id: probe_internal_humidity
    name: "Internal Humidity (SHT31)"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: humidity
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 5
    lambda: |-
      if (!id(input_humidity_internal_enabled)) return NAN;
      return id(sht31_internal_humidity_raw).state;
    on_value:
      - lvgl.label.update:
          id: lbl_int_humidity_large
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_int_humidity_label(id(probe_internal_temp).state, x, f);
      - lvgl.label.update:
          id: lbl_int_humidity_alt
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_int_humidity_label(id(probe_internal_temp).state, x, f);

  - platform: template
    id: probe_external_temp
    name: "External Temperature (SHT20)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 6
    lambda: |-
      if (!id(input_humidity_external_enabled)) return NAN;
      return id(sht20_external_temp_raw).state;
    on_value:
      - lvgl.label.update:
          id: lbl_ext_humidity_large
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_ext_humidity_label(x, id(probe_external_humidity).state, f);
      - lvgl.label.update:
          id: lbl_ext_humidity_alt
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_ext_humidity_label(x, id(probe_external_humidity).state, f);
      - lvgl.arc.update:
          id: home_ambient_arc
          value: !lambda 'return p4_ui_temp_to_arc_pct(x, ${dial_min_c}, ${dial_max_c});'
      - lambda: |-
          if (!id(page_home_active) || !id(home2_view_active)) return;
          lv_arc_set_value(id(home2_ambient_arc),
              p4_ui_temp_to_arc_pct(x, ${dial_min_c}, ${dial_max_c}));

  - platform: template
    id: probe_external_humidity
    name: "External Humidity (SHT20)"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: humidity
    update_interval: 30s
    web_server:
      sorting_group_id: group_probes
      sorting_weight: 7
    lambda: |-
      if (!id(input_humidity_external_enabled)) return NAN;
      return id(sht20_external_humidity_raw).state;
    on_value:
      - lvgl.label.update:
          id: lbl_ext_humidity_large
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_ext_humidity_label(id(probe_external_temp).state, x, f);
      - lvgl.label.update:
          id: lbl_ext_humidity_alt
          text: !lambda |-
            const bool f = id(sel_temperature_display_unit).current_option() == "Fahrenheit";
            return p4_fmt_ext_humidity_label(id(probe_external_temp).state, x, f);

  # ── Probe staleness diagnostics ────────────────────────────────────────────
  - platform: template
    name: "RTD1 CH1 Sample Age (s)"
    id: rtd1_ch1_age_s
    unit_of_measurement: "s"
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 20
    lambda: 'return p4_sample_age_s(id(rtd1_ch1_last_ms));'

  - platform: template
    name: "RTD1 CH2 Sample Age (s)"
    id: rtd1_ch2_age_s
    unit_of_measurement: "s"
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 21
    lambda: 'return p4_sample_age_s(id(rtd1_ch2_last_ms));'


  # ── Phase 5: SD card free space ───────────────────────────────────────────
  - platform: template
    name: "SD Card Free (MB)"
    id: sd_free_mb
    unit_of_measurement: "MB"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 25
    lambda: 'return p4_sd_free_mb();'

  # ── Live countdown timers (seconds remaining; 0 = not currently counting
  # down) — computed directly from the same globals the control tick already
  # maintains, no new state needed. Previously only the *configured durations*
  # were visible (comp_lockout_min etc.); these are the first live progress
  # readouts for any of them. Published at 3 s (web/HA); home LVGL lockout
  # uses p4_ui_comp_lockout_remaining_s each 1 s tick so the amber countdown
  # stays snappy on the Home page.
  - platform: template
    name: "Compressor Lockout Remaining (s)"
    id: comp_lockout_remaining_sec
    unit_of_measurement: "s"
    update_interval: 3s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_compressor
      sorting_weight: 50
    lambda: |-
      return p4_ui_comp_lockout_remaining_s(
          id(ctl_comp_last_off_ms), id(ctl_comp_lockout_min));

  - platform: template
    name: "Next Defrost In (s)"
    id: defrost_countdown_sec
    unit_of_measurement: "s"
    update_interval: 3s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 50
    lambda: |-
      if (id(ctl_defrost_active) || id(ctl_defrost_dripping)) return 0.0f;
      if (id(ctl_defrost_last_end_ms) == 0) return 0.0f;
      uint32_t interval_ms = (uint32_t)(id(ctl_defrost_interval_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_defrost_last_end_ms);
      if (elapsed >= interval_ms) return 0.0f;
      return (interval_ms - elapsed) / 1000.0f;

  - platform: template
    name: "Defrost Duration Remaining (s)"
    id: defrost_duration_remaining_sec
    unit_of_measurement: "s"
    update_interval: 3s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 51
    lambda: |-
      if (!id(ctl_defrost_active)) return 0.0f;
      uint32_t duration_ms = (uint32_t)(id(ctl_defrost_duration_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_defrost_on_since_ms);
      if (elapsed >= duration_ms) return 0.0f;
      return (duration_ms - elapsed) / 1000.0f;

  - platform: template
    name: "Defrost Drip Remaining (s)"
    id: defrost_drip_remaining_sec
    unit_of_measurement: "s"
    update_interval: 3s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_defrost
      sorting_weight: 52
    lambda: |-
      if (!id(ctl_defrost_dripping)) return 0.0f;
      uint32_t drip_ms = (uint32_t)(id(ctl_defrost_drip_min) * 60000.0f);
      uint32_t elapsed = millis() - id(ctl_drip_start_ms);
      if (elapsed >= drip_ms) return 0.0f;
      return (drip_ms - elapsed) / 1000.0f;

##############################################################################
# Text Sensors
##############################################################################

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      web_server:
        sorting_group_id: group_network
        sorting_weight: 2
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_text
      web_server:
        sorting_group_id: group_network
        sorting_weight: 3
    mac_address:
      name: "MAC Address"
      id: mac_address
      web_server:
        sorting_group_id: group_network
        sorting_weight: 4

  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 1

  - platform: template
    name: "Status"
    id: status_text
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 3

  - platform: template
    name: "Current Time"
    id: current_time
    update_interval: 10s
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 4
    lambda: |-
      char buf[24];
      p4_fmt_time(buf, sizeof(buf));
      return std::string{buf};

  - platform: template
    name: "NTP Sync Status"
    id: ntp_sync_status
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_system_info
      sorting_weight: 5
    lambda: 'return std::string{p4_ntp_synced() ? "SYNCED" : "PENDING"};'

  # ── Phase 7: Diagnostic text sensors ──────────────────────────────────────
  - platform: template
    name: "RS485 Bus Status"
    id: rs485_status
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 40
    lambda: |-
      bool relay_ok = id(hw_rs485_relay_ok);
      bool time_ok  = p4_wall_clock_ok();
      char buf[64];
      snprintf(buf, sizeof(buf), "Relay: %s | Time: %s",
               relay_ok ? "OK" : "OFFLINE",
               time_ok  ? "OK" : "PENDING");
      return std::string(buf);

  - platform: template
    name: "Relay Config Address"
    id: rs485_relay_config_address
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
      sorting_weight: 41
    lambda: 'return std::string("Addr: 1 (Modbus RTU)");'

  - platform: template
    name: "RTD Active Address"
