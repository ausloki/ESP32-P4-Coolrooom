  # ── Door Sensor Mode (NC=on / NO=off) ───────────────────────────────────────
  # Previously also toggled relay_light directly (id: door_sensor_mode_light_
  # control) — an unintentional coupling where changing the wiring-mode
  # setting flipped the cabinet light as a side effect. Decoupled: this
  # switch only sets NC/NO now. Door-triggered lighting is its own feature —
