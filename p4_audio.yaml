# Voice announcements — ES8311 + NS4150B (Waveshare 7B pins via substitutions
# in esp32-p4-coolroom.yaml). Clips are pre-recorded female English WAVs under
# assets/audio/ (regenerate with scripts/generate_audio_clips.sh).
#
# ★ Anti-click (canonical — see reference/AUDIO_ALERTS.md):
#   Do NOT use speaker.keep_alive on ESPHome 2026.7.0 (truncates clips).
#   Soft-start instead: PA off + mute → play into ~400 ms WAV lead-in →
#   PA on → unmute (audio_prepare_* + 25 ms interval below). Glass-OK 2026-08-02.
#
# Mic / speech-to-command is intentionally not wired yet — PA + speaker path
# first; ADC/mic follows once playback is proven on hardware.

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${audio_i2s_lrck_pin}
    i2s_bclk_pin: ${audio_i2s_sclk_pin}
    i2s_mclk_pin: ${audio_i2s_mclk_pin}

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: ${audio_i2s_dout_pin}
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac

media_player:
  - platform: speaker
    id: coolroom_media
    name: "Coolroom Speaker"
    # Volume is the *codec* float (not UI %). ES8311 0.75 = 0 dB (unity);
    # ceiling 0.82 = mild boost (raw 0.85–1.0 crackles on this speaker).
    # Operator UI 20–100% maps linearly to codec 0.35–0.82 via
    # p4_audio_ui_to_codec — see reference/AUDIO_ALERTS.md.
    volume_initial: 0.732   # UI default 85% → linear map
    volume_min: 0.35        # UI floor 20%
    volume_max: 0.82        # UI 100% → loudest clean
    # Keep the NVS-backed % number in sync when HA (or anything else) changes
    # the media-player volume directly (x is codec float — reverse-map to UI %).
    on_volume:
      - lambda: |-
          // Ignore callbacks caused by our own volume_set (boot / web / play).
          // Those can arrive out of order and would overwrite a newer setting.
          if (millis() < id(ctl_audio_volume_suppress_until_ms)) return;
          float pct = p4_audio_codec_to_ui(x);
          if (id(ctl_audio_volume_pct) < pct - 0.5f || id(ctl_audio_volume_pct) > pct + 0.5f) {
            id(ctl_audio_volume_pct) = pct;
            ESP_LOGI("audio", "Speaker volume synced from media player: %.0f%% (codec %.3f)",
                     pct, x);
          }
      - if:
          condition:
            lambda: 'return millis() >= id(ctl_audio_volume_suppress_until_ms);'
          then:
            - script.execute: persist_config_to_nvs
    announcement_pipeline:
      speaker: i2s_speaker
      format: WAV
      num_channels: 1
      sample_rate: 16000
    files:
      - id: clip_alarm_high
        file: assets/audio/alarm_high.wav
      - id: clip_alarm_low
        file: assets/audio/alarm_low.wav
      - id: clip_alarm_door
        file: assets/audio/alarm_door.wav
      - id: clip_alarm_no_cool
        file: assets/audio/alarm_no_cool.wav
      - id: clip_alarm_ice
        file: assets/audio/alarm_ice.wav
      - id: clip_alarm_probe
        file: assets/audio/alarm_probe.wav
      - id: clip_alarm_relay_board
        file: assets/audio/alarm_relay_board.wav
      - id: clip_alarm_temp_board
        file: assets/audio/alarm_temp_board.wav
      - id: clip_alarm_humidity_sensor
        file: assets/audio/alarm_humidity_sensor.wav
      - id: clip_alarm_ambient_sensor
        file: assets/audio/alarm_ambient_sensor.wav
      - id: clip_info_cooling_on
        file: assets/audio/info_cooling_on.wav
      - id: clip_info_cooling_off
        file: assets/audio/info_cooling_off.wav
      - id: clip_info_defrost_on
        file: assets/audio/info_defrost_on.wav
      - id: clip_info_defrost_off
        file: assets/audio/info_defrost_off.wav
      - id: clip_info_door_open
        file: assets/audio/info_door_open.wav
      - id: clip_info_door_closed
        file: assets/audio/info_door_closed.wav
      - id: clip_info_audio_test
        file: assets/audio/info_audio_test.wav

interval:
  # Canonical anti-click (reference/AUDIO_ALERTS.md): I2S re-init with PA *off*
  # + DAC muted, then amp into leading silence, then unmute. Matches ~400 ms
  # lead-in on assets/audio/*.wav. Do not replace with keep_alive on 2026.7.0.
  - interval: 25ms
    then:
      - lambda: |-
          uint8_t phase = id(ctl_audio_softstart_phase);
          if (phase == 0) return;
          uint32_t now = millis();
          uint32_t at = id(ctl_audio_softstart_at_ms);
          if ((int32_t) (now - at) < 0) return;

          if (phase == 1) {
            // I2S should be streaming silence with the amp still off — safe to
            // bias the NS4150B now without amplifying the bus bring-up pop.
            id(audio_pa_enable).turn_on();
            id(ctl_audio_softstart_phase) = 2;
            id(ctl_audio_softstart_at_ms) = now + 150;
            return;
          }

          if (phase == 2) {
            id(ctl_audio_softstart_phase) = 0;
            id(ctl_audio_softstart_at_ms) = 0;
            // Mapped gain *before* unmute — never pass raw ui%/100 here.
            float vol = p4_audio_ui_to_codec(id(ctl_audio_volume_pct));
            id(es8311_dac).set_volume(vol);
            id(ctl_audio_volume_suppress_until_ms) = now + 2000;
            id(coolroom_media).make_call().set_volume(vol).perform();
            id(i2s_speaker).set_mute_state(false);
            id(es8311_dac).set_mute_off();
          }

script:
  # Shared gate: master on, codec present, not soft-muted from the home bell.
  # Per-clip scripts add their own category toggle.
  - id: audio_prepare_play
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(input_audio_alerts_enabled) && id(hw_audio_ok) &&
                     !id(ctl_alarm_silenced);
          then:
            # Amp OFF + DAC muted before play starts so I2S channel recreate
            # cannot drive the speaker. Soft-start interval turns PA on, then
            # unmutes, inside the WAV lead-in silence.
            - lambda: 'id(ctl_audio_volume_suppress_until_ms) = millis() + 2000;'
            - switch.turn_off: audio_pa_enable
            - lambda: |-
                id(es8311_dac).set_mute_on();
                id(i2s_speaker).set_mute_state(true);
                id(ctl_audio_softstart_phase) = 1;
                id(ctl_audio_softstart_at_ms) = millis() + 120;

  - id: speak_alarm_high
    mode: queued
    max_runs: 3
    then:
      - if:
          condition:
            lambda: |-
              return id(input_audio_alerts_enabled) && id(input_audio_alarm_high) &&
                     id(hw_audio_ok) && !id(ctl_alarm_silenced);
          then:
            - script.execute: audio_prepare_play
            - media_player.speaker.play_on_device_media_file:
                id: coolroom_media
                media_file: clip_alarm_high
                announcement: true
                enqueue: true

  - id: speak_alarm_low
